const LDOCS = {"dec": [{"no": "제1장", "title": "총칙", "arts": [{"no": "제1조", "title": "목적", "lines": ["이 영은 「장애인 등에 대한 특수교육법」에서 위임된 사항과 그 시행에 필요한 사항을 규정함을 목적으로 한다."]}, {"no": "제2조", "title": "의무교육의 실시", "lines": ["「장애인 등에 대한 특수교육법」(이하 “법”이라 한다) 제3조 및 법률 제8483호 부칙 제1조 단서에 따라 특수교육대상자에 대한 의무교육은 다음 각 호에 따라 차례로 각각 실시한다. <개정 2025. 2. 25.>", "1. 2010학년도: 5세 이상 유치원 과정 및 고등학교 과정", "2. 2011학년도: 4세 이상 유치원 과정", "3. 2012학년도: 3세 이상 유치원 과정"]}, {"no": "제3조", "title": "의무교육의 비용 등", "lines": ["① 법 제3조제3항에 따라 국가 또는 지방자치단체가 부담하여야 하는 비용은 입학금, 수업료, 교과용 도서대금 및 학교급식비로 한다.", "② 국가 및 지방자치단체는 제1항의 비용 외에 학교운영 지원비, 통학비, 현장ㆍ체험학습비 등을 예산의 범위에서 부담하거나 보조할 수 있다."]}]}, {"no": "제2장", "title": "국가 및 지방자치단체의 임무", "arts": [{"no": "제4조", "title": "위탁교육", "lines": ["① 교육감은 법 제6조제2항에 따라 특수교육대상자에 대한 교육을 사립(私立) 특수교육기관에 위탁할 때에는 관할 구역에 있는 사립 특수교육기관의 교육여건, 교육 가능한 인원, 교육기간 등에 관하여 그 특수교육기관의 장(특수학급이 설립된 사립학교의 장을 포함한다)과 협의해야 한다. <개정 2022. 6. 28.>", "② 교육감은 특수교육대상자의 교육을 위탁한 사립 특수교육기관에 대하여 국립 또는 공립 특수교육기관과 같은 수준의 교육을 할 수 있도록 운영비, 시설비, 실험실습비, 진로 및 직업교육비, 교직원의 인건비, 그 밖에 특수교육에 필요한 경비를 지급하여야 한다.", "③ 제1항과 제2항 외에 위탁교육의 운영에 관한 세부 사항은 교육감이 정하는 바에 따른다."]}, {"no": "제5조", "title": "교원의 자질 향상", "lines": ["① 교육부장관 및 교육감은 통합교육에 대한 이해를 높이기 위하여 일반학교의 교원(특수교육교원은 제외한다. 이하 이 조에서 같다)에게 연수를 받게 하는 경우 특수교육에 관한 내용을 포함하여야 한다. <개정 2013. 3. 23.>", "② 교육부장관 및 교육감은 통합교육을 효율적으로 시행하기 위하여 통합교육을 지원하는 일반학교의 교원에 대하여는 특수교육과 관련된 직무연수 과정을, 특수교육교원에 대하여는 일반교과 교육에 관한 직무연수 과정을 개설ㆍ운영하여야 한다. <개정 2013. 3. 23.>"]}, {"no": "제6조", "title": "중앙특수교육운영위원회 구성ㆍ운영", "lines": ["① 법 제10조제1항에 따른 중앙특수교육운영위원회(이하 “중앙위원회”라 한다)는 위원장을 포함하여 15명 이내의 위원으로 구성한다.", "② 중앙위원회의 위원장(이하 “위원장”이라 한다)은 교육부차관이 되고, 위원은 당연직위원과 위촉위원으로 구성한다. <개정 2013. 3. 23.>", "③ 당연직위원은 교육부, 행정안전부, 문화체육관광부, 보건복지부, 고용노동부, 성평등가족부의 고위공무원단 소속 공무원으로서 해당 부처의 장관이 지명하는 사람이 된다. <개정 2010. 3. 15., 2010. 7. 12., 2013. 3. 23., 2014. 11. 19., 2017. 7. 26., 2025. 10. 1.>", "④ 위촉위원은 다음 각 호의 어느 하나에 해당하는 사람 중에서 위원장이 성별을 고려하여 위촉한다. 이 경우 제4호에 해당하는 사람이 포함되어야 한다. <개정 2025. 12. 23.>", "1. 특수교육교원 자격이 있는 사람으로서 7년 이상 특수교육대상자를 교육하거나 교육하였던 사람", "2. 특수교육대상자의 학부모 또는 보호자로서 특수교육 분야에서 활동하거나 활동 경험이 있는 사람", "3. 「고등교육법」 제2조제1호 또는 제3호에 따른 학교에서 특수교육에 관한 학문을 가르치는 부교수 이상으로 재직하거나 재직하였던 사람", "4. 제1호부터 제3호까지의 어느 하나에 해당하는 사람으로서 「지방교육자치에 관한 법률」 제42조제1항에 따라 설립된 협의체가 추천하는 사람", "⑤ 위촉위원의 임기는 2년으로 하되, 2차에 한하여 연임할 수 있다.", "⑥ 중앙위원회의 회의는 연 2회 이상 개최하여야 하며, 위원장이 필요 하다고 인정하거나 재적위원 3분의 1 이상이 요구하는 경우에는 위원장이 회의를 소집한다.", "⑦ 중앙위원회의 회의는 재적위원의 과반수 출석으로 개의하고, 출석위원 과반수의 찬성으로 의결한다.", "⑧ 중앙위원회는 필요하다고 인정되면 관계 행정기관에 직원의 출석ㆍ설명과 자료 제출을 요구할 수 있다.", "⑨ 그 밖에 중앙위원회의 구성 및 운영 등에 필요한 사항은 중앙위원회의 의결을 거쳐 위원장이 정한다."]}, {"no": "제6조의2", "title": "위촉위원의 해촉", "lines": ["중앙위원회의 위원장은 제6조제4항제1호부터 제3호까지의 규정에 따른 위촉위원이 다음 각 호의 어느 하나에 해당하는 경우에는 해당 위원을 해촉(解囑)할 수 있다. <개정 2025. 2. 25.>", "1. 심신쇠약 등으로 장기간 직무를 수행할 수 없게 된 경우", "2. 직무와 관련된 비위사실이 있는 경우", "3. 직무태만, 품위손상이나 그 밖의 사유로 인하여 위원으로 적합하지 아니하다고 인정되는 경우", "4. 위원 스스로 직무를 수행하는 것이 곤란하다고 의사를 밝히는 경우", "[본조신설 2015. 12. 31.]"]}, {"no": "제7조", "title": "특수교육지원센터의 설치ㆍ운영", "lines": ["① 교육감은 법 제11조에 따른 특수교육지원센터를 설치할 때 그 업무를 수행할 수 있는 독립된 공간을 확보하여야 한다.", "② 교육감은 특수교육지원센터가 그 업무를 효율적으로 수행할 수 있도록, 담당 업무를 전담하는 특수교육 분야의 전문인력을 배치하여야 한다.", "③ 교육감은 지역의 지리적 특성 및 특수교육의 수요 등을 고려하여 필요한 경우에는 하나의 하급교육행정기관에 2 이상의 특수교육지원센터를 설치ㆍ운영할 수 있다.", "④ 특수교육지원센터는 담당 업무를 효율적으로 수행하기 위하여 관련 기관과의 연계체제를 구축하고 협력하여 업무를 수행할 수 있다.", "⑤ 교육감은 특수교육지원센터의 진단ㆍ평가 과정에서 장애가 의심되는 영유아 또는 학생이 이전에 의료적 진단을 받지 아니한 경우에는 이에 대한 의료적 진단을 보건소, 병원 또는 의원에 의뢰하여야 한다.", "⑥ 교육감은 제5항에 따라 의료적 진단을 보건소, 병원 또는 의원에 의뢰한 경우에는 그 비용을 부담하여야 한다."]}, {"no": "제8조", "title": "실태조사", "lines": ["① 법 제13조제1항에 따른 실태조사에는 다음 각 호의 사항이 포함되어야 한다. <개정 2020. 1. 29.>", "1. 특수교육대상자의 성ㆍ연령ㆍ장애유형ㆍ장애정도별 현황", "2. 특수교육기관 및 그 교육과정의 운영 실태", "3. 특수교육 관련서비스의 제공 현황", "4. 특수교육 지원을 위한 행정조직 및 지원 현황", "5. 특수교육재정의 확보ㆍ분배ㆍ활용 현황", "6. 특수교육대상자의 교육성과 및 학교 졸업 후의 생활상태", "7. 삭제 <2021. 4. 20.>", "8. 특수교육대상자 및 그 보호자, 특수교육에 관한 전문가 등 특수교육 관련자의 특수교육 지원에 대한 만족도 및 요구 사항", "② 법 제13조제2항에 따른 실태조사에는 다음 각 호의 사항이 포함되어야 한다. <신설 2020. 1. 29.>", "1. 법 제29조에 따른 특별지원위원회의 설치ㆍ운영 현황", "2. 법 제30조제1항에 따른 장애학생지원센터의 설치ㆍ운영 현황", "3. 법 제31조제1항 및 제2항에 따른 장애학생의 교육활동 편의 및 장애수험생의 수험 편의를 위한 수단의 제공 현황", "4. 법 제32조에 따른 장애학생 지원 등에 관한 학칙의 규정 현황", "5. 법 제35조제3항에 따른 심사청구의 운영 현황", "③ 법 제13조제3항에 따른 실태조사에는 다음 각 호의 사항이 포함되어야 한다. <신설 2020. 12. 8.>", "1. 특수교육대상자에 대한 인권침해 행위의 유형별 현황", "2. 인권침해 행위로 피해를 입은 특수교육대상자를 보호하기 위한 조치 현황", "3. 인권침해 행위를 한 사람에 대한 조치 현황", "4. 그 밖에 특수교육대상자의 인권보호를 위하여 필요하다고 교육부장관이 인정하는 사항", "④ 법 제13조제1항부터 제3항까지의 규정에 따른 실태조사는 표본조사의 방법으로 시행하되, 제1항부터 제3항까지에서 규정한 사항에 관하여 정확한 현황을 파악하고 조사항목의 특성상 필요한 경우에는 전수조사(全數調査)의 방법으로 시행할 수 있다. <개정 2020. 1. 29., 2020. 12. 8.>", "⑤ 교육감은 법 제13조제3항에 따른 실태조사를 다른 교육감과 공동으로 실시하거나 필요하면 해당 조사 업무에 전문성이 있는 기관 또는 단체에 의뢰하여 실시할 수 있다. <신설 2020. 12. 8.>"]}, {"no": "제8조의2", "title": "인권침해 사건의 조사", "lines": ["① 법 제13조의2제3항에 따른 조사는 서면조사와 현장조사의 방법으로 실시할 수 있다.", "② 교육감은 법 제13조의2제3항에 따른 조사를 할 때에는 조사의 목적과 항목 등을 포함한 조사계획을 미리 조사대상자에게 통지해야 한다.", "③ 교육감은 법 제13조의2제3항에 따른 조사에 필요한 자료의 제출이나 의견의 진술을 학교 등 관계 기관에 요청할 수 있다.", "④ 교육감은 법 제13조의2제3항에 따른 조사에 필요하면 관계 전문가를 참여하게 하여 의견을 청취할 수 있다.", "[본조신설 2020. 12. 8.]"]}]}, {"no": "제3장", "title": "특수교육대상자의 선정 및 학교 배치 등", "arts": [{"no": "제9조", "title": "장애의 조기발견 등", "lines": ["① 교육장 또는 교육감은 매년 1회 이상 법 제14조제1항에 따른 홍보를 하여야 한다.", "② 교육장 또는 교육감은 장애의 조기발견을 위하여 관할 구역의 어린이집ㆍ유치원 및 학교의 영유아 또는 학생(이하 “영유아 등”이라 한다. 이하 이 조에서 같다)을 대상으로 수시로 선별검사를 하여야 한다. 이 경우 「국민건강보험법」 제52조제1항 또는 「의료급여법」 제14조제1항에 따른 건강검진의 결과를 활용할 수 있다. <개정 2011. 12. 8., 2012. 8. 31.>", "③ 교육장 또는 교육감은 선별검사를 한 결과 장애가 의심되는 영유아 등을 발견한 경우에는 병원 또는 의원에서 영유아 등에 대한 장애 진단을 받도록 보호자에게 안내하고 상담을 하여야 한다.", "④ 교육장 또는 교육감은 선별검사를 받은 영유아 등의 보호자가 법 제15조에 따른 특수교육대상자로 선정받기를 요청할 경우 영유아 등의 보호자에게 영유아 등의 건강검진 결과통보서 또는 진단서를 제출하도록 하여 영유아 등이 특수교육대상자에 해당하는지 여부를 판단하기 위한 진단ㆍ평가를 하여야 한다.", "⑤ 교육장 또는 교육감은 제3항에 따라 진단ㆍ평가한 결과 영유아 등에게 특수교육이 필요하다고 판단되면 보호자에게 그 내용과 특수교육대상자 선정에 필요한 절차를 문서로 알려야 한다.", "⑥ 제2항부터 제5항까지의 규정에 따른 선별검사 및 진단ㆍ평가에 필요한 사항은 교육부령으로 정한다. 이 경우 제2항에 따른 선별검사에 관한 사항은 보건복지부장관과 협의하여야 한다. <개정 2010. 3. 15., 2013. 3. 23.>"]}, {"no": "제10조", "title": "특수교육대상자의 선정", "lines": ["① 법 제15조제1항제11호에서 “두 가지 이상의 장애가 있는 경우 등 대통령령으로 정하는 장애”란 같은 항 제1호부터 제9호까지의 규정에 따른 장애가 두 가지 이상 중복된 장애를 말한다.", "② 법 제15조제1항에 따라 특수교육대상자를 선정하는 기준은 별표와 같다.", "[전문개정 2022. 6. 28.]"]}, {"no": "제11조", "title": "특수교육대상자의 학교 배치 등", "lines": ["① 교육장 또는 교육감은 법 제17조제1항에 따라 특수교육대상자를 학교에 배치할 때에는 해당 학교의 장과 특수교육대상자에게 각각 문서로 알려야 한다.", "② 교육장 또는 교육감은 특수교육대상자를 일반학교의 일반학급에 배치한 경우에는 특수교육지원센터에서 근무하는 특수교육교원에게 그 학교를 방문하여 학습을 지원하도록 하여야 한다.", "③ 각급학교의 장은 특수교육대상자에 대한 교육지원의 내용을 추가ㆍ변경 또는 종료하거나 특수교육대상자를 재배치할 필요가 있으면 법 제22조제1항에 따른 개별화교육지원팀의 검토를 거쳐 교육장 및 교육감에게 그 특수교육대상자의 진단ㆍ평가 및 재배치를 요구할 수 있다."]}, {"no": "제12조", "title": "배치에 대한 이의", "lines": ["법 제17조제4항에서 “대통령령으로 정하는 특별한 사유”란 해당 특수학교가 교육하는 특수교육대상자의 장애유형과 배치를 요구받은 특수교육대상자의 장애유형이 달라 효율적인 교육을 할 수 없는 경우를 말한다. <개정 2025. 2. 25.>"]}]}, {"no": "제4장", "title": "영유아 및 초ㆍ중등교육", "arts": [{"no": "제13조", "title": "장애영아의 교육지원", "lines": ["① 3세 미만의 장애영아(이하 이 조에서 “장애영아”라 한다) 교육의 수업일수는 매 학년도 150일을 기준으로 하되, 장애영아의 건강 상태 및 교육과정의 운영상 필요한 경우에는 교육부장관, 교육감 또는 교육장의 승인을 받아 30일의 범위에서 줄일 수 있다. <개정 2013. 3. 23., 2025. 2. 25.>", "② 법 제18조제2항에 따라 특수교육을 받는 영아학급 등의 교원 배치에 관한 사항은 교육부장관, 교육감 또는 교육장이 정한다. <개정 2013. 3. 23.>", "③ 교육감이나 교육장은 법 제18조제2항에 따라 장애영아를 특수교육지원센터에 배치하여 교육을 하는 경우 「특수학교시설ㆍ설비기준령」 별표에 따른 보통교실을 그 특수교육지원센터에 갖추어야 한다.", "④ 장애영아 담당 교원은 「초ㆍ중등교육법」 제21조제2항에 따른 특수학교 유치원교사 자격증을 소지한 사람으로 한다. <개정 2014. 12. 23.>"]}, {"no": "제14조", "title": "취학의무의 유예 또는 면제 등", "lines": ["① 특수교육대상자의 보호자가 법 제19조제2항에 따라 특수교육대상자의 취학의무를 유예받거나 면제 받으려는 경우에는 관할 교육감 또는 교육장에게 취학의무의 유예 또는 면제를 신청하여야 한다.", "② 제1항에 따른 신청을 받은 교육감 또는 교육장은 법 제10조제1항에 따른 관할 특수교육운영위원회의 심의를 거쳐 특수교육대상자의 등ㆍ하교 가능성, 순회교육 실시 가능성 및 보호자의 의견 등을 고려하여 면제 또는 유예를 결정한다. 이 경우 유예기간은 1년 이내로 하고, 유예기간을 연장하려는 경우에도 관할 특수교육운영위원회의 심의를 거쳐야 한다.", "③ 취학의무를 면제 또는 유예받은 사람이 다시 취학하고자 하는 경우 그 보호자는 교육감 또는 교육장에게 취학을 신청하고, 그 신청을 받은 교육감 또는 교육장은 관할 특수교육운영위원회의 심의를 거쳐 취학 여부를 결정하여야 한다."]}, {"no": "제15조", "title": "유치원 의무교육을 받는 것으로 보는 어린이집의 요건", "lines": ["법 제19조제2항 단서에서 “대통령령으로 정하는 일정한 교육 요건을 갖춘 어린이집”이란 「장애아동 복지지원법」 제32조제2항에 따라 지정받은 장애영유아를 위한 어린이집을 말한다.", "[전문개정 2022. 6. 28.]"]}, {"no": "제16조", "title": "통합교육을 위한 시설ㆍ설비 등", "lines": ["① 일반학교의 장은 법 제21조제3항에 따라 통합교육을 실시하는 경우에는 특수교육대상자의 교내 이동이 쉽고, 세면장ㆍ화장실 등과 가까운 곳에 위치한 66제곱미터 이상의 교실에 특수학급을 설치하여야 한다. 다만, 배치된 특수교육대상자의 수 및 그 학교의 여건 등을 고려하여 시ㆍ도 조례로 정하는 바에 따라 44제곱미터 이상의 교실에 학급을 설치할 수 있다. <개정 2025. 2. 25.>", "② 일반학교의 장은 법 제21조제3항에 따라 통합교육을 실시하는 경우에는 배치된 특수교육대상자의 성별, 연령, 장애의 유형ㆍ정도 및 교육활동 등에 맞도록 정보 접근을 위한 기기, 의사소통을 위한 보완ㆍ대체기구 등의 교재ㆍ교구를 갖추어야 한다. <개정 2025. 2. 25.>", "③ 교육부장관 및 교육감은 법 제21조제5항에 따라 특수교육대상자의 통합학급 교육활동을 지원하기 위하여 특수교육교원을 둘 때에는 다음 각 호의 사항을 고려해야 한다. <신설 2025. 2. 25.>", "1. 일반학교에 배치된 특수교육대상자의 수", "2. 일반학교에 배치된 특수교육대상자의 장애유형 및 장애정도", "3. 특수교육대상자가 배치된 일반학교의 여건과 지역적 특성", "4. 그 밖에 교육부장관 및 교육감이 특수교육대상자의 통합학급 교육활동을 지원하기 위하여 필요하다고 인정하는 사항"]}, {"no": "제17조", "title": "전문인력의 자격 기준 등", "lines": ["법 제23조제1항에서 “대통령령으로 정하는 자격이 있는 진로 및 직업교육을 담당하는 전문인력”이란 「초ㆍ중등교육법」 제21조제2항에 따른 특수학교 정교사ㆍ준교사ㆍ실기교사의 자격(각각 중학교 과정 이상의 교육과정을 담당할 수 있는 자격으로 한정한다)이 있는 사람으로서 다음 각 호의 어느 하나에 해당하는 사람을 말한다. <개정 2018. 10. 30.>", "1. 대학이나 대학원에서 직업재활에 관한 전공을 이수한 사람", "2. 진로 및 직업교육과 관련한 국가자격증 또는 민간자격증 소지자", "3. 진로 및 직업교육과 관련한 직무연수를 이수한 사람"]}, {"no": "제18조", "title": "진로 및 직업교육을 위한 시설 등", "lines": ["① 중학교 과정 이상 각급 학교의 장은 법 제23조제2항에 따라 진로 및 직업교육을 위하여 66제곱미터 이상의 교실을 1개 이상 설치하여야 한다. 다만, 중학교 과정 이상 특수학교의 장은 「특수학교시설ㆍ설비기준령」 제4조에서 정하는 기준에 따라 설치하여야 한다. <개정 2016. 12. 5.>", "② 특수교육지원센터는 특수교육기관, 한국장애인고용공단지부 등 해당 지역의 장애인 고용 관련 기관, 직업재활시설, 장애인복지관, 산업체 등 관련 기관과 협의체를 구성하여야 한다. <개정 2009. 12. 31.>", "③ 교육감은 제1항에 따른 진로 및 직업 교육을 위한 교실의 설치비용을 지원하는 등 특수교육대상자의 진로 및 직업 교육에 필요한 인력과 경비를 지원하도록 노력하여야 한다. <개정 2016. 12. 5.>"]}, {"no": "제19조", "title": "전공과의 설치ㆍ운영", "lines": ["① 법 제24조제1항에 따른 전공과를 설치ㆍ운영하는 특수교육기관의 장은 66제곱미터 이상의 전공과 전용 교실을 1개 이상 설치하여야 하며, 세부적인 시설ㆍ설비의 기준은 교육감이 정한다.", "② 전공과를 설치한 교육기관의 장은 그 설치 목적을 달성하기 위하여 현장실습이 포함된 직업교육계획을 수립하여야 한다.", "③ 전공과의 수업 연한과 학생의 선발 방법은 교육감의 승인을 받아 전공과를 설치한 교육기관의 장이 정한다.", "④ 전공과를 전담할 인력은 전공과를 설치한 특수교육기관의 고등학교 과정과 같은 수준으로 배치한다."]}, {"no": "제20조", "title": "순회교육의 운영 등", "lines": ["① 교육장이나 교육감은 법 제25조제1항에 따른 순회교육을 하기 위하여 순회교육을 받는 특수교육대상자의 능력, 장애 정도 등을 고려하여 순회교육계획을 작성ㆍ운영하여야 한다.", "② 순회교육의 수업일수는 매 학년도 150일을 기준으로 하여 각급학교의 장이 정하되, 순회교육을 받는 특수교육대상자의 상태와 교육과정의 운영상 필요한 경우에는 지도ㆍ감독기관의 승인을 받아 30일의 범위에서 줄일 수 있다.", "③ 삭제 <2016. 6. 21.>"]}, {"no": "제20조의2", "title": "원격수업의 운영", "lines": ["① 교육부장관 및 교육감은 법 제25조제2항에 따른 원격수업(이하 “원격수업”이라 한다)을 실시하기 위하여 특수교육대상자의 장애유형 및 장애정도를 고려한 원격수업시스템을 구축ㆍ운영해야 한다.", "② 교육부장관 및 교육감은 원격수업을 위하여 점자 및 자막 자료 등 특수교육대상자의 장애유형 및 장애정도에 따른 교육자료를 개발ㆍ보급해야 한다.", "③ 제1항 및 제2항에서 규정한 사항 외에 원격수업의 원활한 운영을 위하여 필요한 세부사항은 교육부장관 및 교육감이 정한다.", "[본조신설 2021. 4. 20.]"]}, {"no": "제20조의3", "title": "특수교육대상자를 위한 학급을 설치ㆍ운영 중인 의료기관 등에 대한 지원", "lines": ["국가 및 지방자치단체는 법 제25조제5항에 따라 특수교육대상자를 위한 학급을 설치ㆍ운영 중인 의료기관 및 복지시설 등에 다음 각 호의 지원을 한다.", "1. 학급의 설치ㆍ운영에 필요한 비용 지원", "2. 학급 담당 교원 또는 특수교육 관련서비스 담당 인력 지원", "3. 순회교육에 필요한 교재ㆍ교구 지원", "4. 그 밖에 국립 또는 공립 특수교육기관 수준의 교육이 이루어질 수 있도록 지원이 필요하다고 국가기관 또는 지방자치단체의 장이 인정하는 지원", "[본조신설 2022. 6. 28.]"]}, {"no": "제21조", "title": "유치원 과정의 방과후 과정 담당 인력의 자격기준 및 운영방법", "lines": ["① 법 제26조제1항에 따라 특수교육대상자에 대한 방과후 과정 운영을 담당하는 인력은 「영유아보육법」 제21조제2항에 따른 보육교사의 자격 또는 「유아교육법」 제22조 및 「초ㆍ중등교육법」 제21조에 따른 교원의 자격을 가지고 있는 사람으로 한다. <개정 2012. 4. 20.>", "② 방과후 과정을 운영하는 유치원 과정의 교육기관의 장은 교육과 보육을 연계하고 정규교육과정을 포함하여 1일 8시간 이상으로 운영하며, 그 밖에 운영에 필요한 사항은 교육감이 정한다. <개정 2012. 4. 20.>", "③ 교육감은 방과후 과정을 운영하는 유치원 과정의 교육기관에 대하여 그 교육에 소요되는 경비를 부담하거나 보조하여야 한다. <개정 2012. 4. 20.>", "[제목개정 2012. 4. 20.]"]}, {"no": "제22조", "title": "특수학교 및 특수학급에 두는 특수교육교원의 배치기준", "lines": ["법 제27조제3항에 따라 배치하는 특수교육 담당 교사는 학생 4명마다 1명으로 한다. 다만, 도시와 농촌ㆍ산촌ㆍ어촌 교육의 균형발전, 특수교육지원센터의 운영현황, 특수교육대상자의 지역별 분포 및 두 가지 이상의 장애를 지니면서 장애의 정도가 심한 특수교육대상자의 배치 현황 등을 고려하여 특별시ㆍ광역시ㆍ특별자치시ㆍ도ㆍ특별자치도별 교사는 교육부장관이, 단위 학교ㆍ학급별 교사는 해당 교육감 또는 교육장이 배치기준의 50퍼센트의 범위에서 가감하여 배치할 수 있다. <개정 2013. 3. 23., 2022. 6. 28.>"]}, {"no": "제23조", "title": "가족지원", "lines": ["① 법 제28조제1항에 따른 가족지원은 가족상담, 양육상담, 보호자 교육, 가족지원프로그램 운영 등의 방법으로 한다.", "② 제1항에 따른 가족지원은 「건강가정기본법」 제35조 및 제35조의2에 따른 건강가정지원센터 및 가족센터, 「장애인복지법」 제58조에 따른 장애인복지시설 등과 연계하여 할 수 있다. <개정 2025. 9. 30.>"]}, {"no": "제24조", "title": "치료지원", "lines": ["① 법 제28조제2항에 따른 치료지원에 필요한 인력은 「의료기사 등에 관한 법률」 제4조에 따른 면허 또는 「자격기본법」 제19조제1항에 따라 주무부장관이 공인한 민간자격을 소지한 사람으로 한다.", "② 교육감 또는 특수학교의 장은 특수교육지원센터 또는 특수학교에 치료실을 설치ㆍ운영할 수 있다.", "③ 교육감은 「공공보건의료에 관한 법률」 제2조에 따른 공공보건의료기관 및 「장애인복지법」 제58조에 따른 장애인복지시설 등과 연계하여 치료지원을 할 수 있다."]}, {"no": "제25조", "title": "지원인력", "lines": ["① 교육감은 법 제28조제3항에 따라 각급학교의 장이 특수교육대상자를 위한 지원인력을 원활하게 제공할 수 있도록 지원인력 수급에 관한 계획의 수립, 지원인력의 채용ㆍ배치 등 지원인력의 운영에 필요한 업무를 수행한다. <개정 2022. 6. 28.>", "② 교육감 또는 교육장은 지원인력의 자질 향상을 위하여 특수교육에 관한 연수를 실시해야 한다. <개정 2022. 6. 28.>", "③ 지원인력의 역할 및 자격은 교육부령으로 정하고, 그 밖에 운영 방법에 관한 세부 사항은 교육감이 정하여 고시한다. <개정 2013. 3. 23., 2022. 6. 28.>", "[제목개정 2022. 6. 28.]"]}, {"no": "제26조", "title": "각종 교구 및 학습보조기 등 지원", "lines": ["교육감은 법 제28조제4항에 따라 각급학교의 장이 각종 교구ㆍ학습보조기ㆍ보조공학기기를 제공할 수 있도록 특수교육지원센터에 필요한 기구를 갖추어 두어야 한다."]}, {"no": "제27조", "title": "통학 지원", "lines": ["① 교육감은 각급학교의 장이 법 제28조제5항에 따른 통학 지원을 원활하게 할 수 있도록 통학차량을 각급학교에 제공하거나 통학 지원이 필요한 특수교육대상자 및 보호자에게 통학비를 지급하여야 한다.", "② 각급학교의 장은 특수교육대상자가 현장체험학습, 수련회 등 학교밖 활동에 참여할 수 있도록 조치를 취하여야 한다."]}, {"no": "제28조", "title": "기숙사의 설치ㆍ운영", "lines": ["① 교육감은 법 제28조제6항에 따른 기숙사의 운영에 필요한 경비를 예산의 범위에서 부담하거나 보조할 수 있다.", "② 공립 및 사립학교의 기숙사 시설ㆍ설비 기준은 시ㆍ도 교육규칙으로 정한다."]}, {"no": "제28조의2", "title": "학교 내 의료적 지원", "lines": ["법 제28조제9항에 따라 의료인이 제공하는 의료적 지원의 구체적 범위는 다음 각 호와 같다.", "1. 흡인(특수교육대상자의 코, 입, 기도 및 폐 등에 있는 분비물을 인공적으로 뽑아내는 행위를 말한다)", "2. 튜브영양공급", "3. 배출관을 이용한 간헐적 소변 배출", "4. 인공호흡기를 이용하는 학생에 대한 간호", "5. 그 밖에 교육감(국립학교의 경우에는 해당 학교의 장을 말한다)이 관할 학교 내에 배치된 특수교육대상자에게 필요하다고 인정하여 「의료법」 제3조에 따른 의료기관과 협의하여 정하는 의료적 지원", "[본조신설 2025. 2. 25.]"]}, {"no": "제29조", "title": "기타 특수교육 관련서비스의 제공", "lines": ["① 교육부장관 또는 교육감은 제23조부터 제28조까지 및 제28조의2에 따른 특수교육 관련서비스 외에 보행훈련, 심리ㆍ행동 적응훈련 등 특정한 장애유형의 특수교육대상자에게 필요한 특수교육 관련서비스를 제공하여야 한다. <개정 2013. 3. 23., 2025. 2. 25.>", "② 제1항의 특수교육 관련서비스 제공에 필요한 인력은 국가자격 또는 「자격기본법」 제19조제1항에 따라 주무부장관이 공인한 민간자격을 소지한 사람으로 한다."]}]}, {"no": "제5장", "title": "고등교육", "arts": [{"no": "제30조", "title": "특별지원위원회의 설치ㆍ운영", "lines": ["① 대학의 장은 그 대학에 장애학생이 10명 이상 재학하는 경우에는 법 제29조에 따른 특별지원위원회(이하 “특별지원위원회”라 한다)를 설치ㆍ운영하여야 한다.", "② 장애학생이 10명 미만인 대학의 장은 법 제30조제2항에 따른 장애학생 지원부서가 법 제29조제1항제1호 및 제3호에 관한 특별지원위원회의 기능을 수행할 수 있도록 할 수 있다. <개정 2023. 4. 18.>", "③ 특별지원위원회는 위원장 1명을 포함하여 5명 이상 15명 이하의 위원으로 성별을 고려하여 구성한다. <개정 2023. 4. 18.>", "④ 특별지원위원회의 위원은 다음 각 호의 사람 중에서 대학의 장이 임명한다. 이 경우 각 호별 해당 위원 수가 전체 위원 수의 10분의 6을 초과하지 않도록 해야 한다. <신설 2023. 4. 18.>", "1. 해당 대학의 장애학생 지원 및 복지 관련 교직원", "2. 해당 대학에 재학 중인 장애학생", "3. 그 밖에 장애학생 지원에 관한 학식과 경험이 풍부하다고 대학의 장이 인정하는 전문가", "⑤ 제1항부터 제4항까지에서 규정한 사항 외에 특별지원위원회의 구성 및 운영에 필요한 사항은 대학의 장이 정한다. <신설 2023. 4. 18.>"]}, {"no": "제31조", "title": "장애학생지원센터의 설치ㆍ운영", "lines": ["① 법 제30조제1항 단서에서 “일정 인원”이란 9명을 말한다.", "② 법 제30조제3항에 따른 장애학생지원센터의 장의 자격을 갖춘 사람은 해당 대학의 교직원으로서 다음 각 호의 어느 하나에 해당하는 사람으로 한다. <개정 2023. 4. 18.>", "1. 교육학, 사회복지학, 법학 등 장애인 인권 관련 분야의 학위를 소지한 사람", "2. 교육, 보건ㆍ의료, 복지 등 분야의 「자격기본법」에 따른 국가자격을 소지한 사람", "3. 장애학생 지원 및 복지 관련 업무에 3년 이상 종사한 경력이 있는 사람", "4. 그 밖에 제1호부터 제3호까지의 규정에 준하는 자격으로 대학의 장이 정하는 자격을 갖춘 사람", "[제목개정 2023. 4. 18.]"]}, {"no": "제31조의2", "title": "개인별 수요 조사 및 교육지원계획 수립 등", "lines": ["① 법 제30조의2제1항에 따른 장애학생의 개인별 수요 조사에는 다음 각 호의 사항이 포함돼야 한다.", "1. 장애유형 및 장애정도", "2. 법 제31조제1항 각 호의 수단 중 장애학생에게 필요한 수단 및 기간", "② 장애학생지원센터(법 제30조제1항에 따라 장애학생 지원부서로 갈음하는 경우에는 이를 말한다)의 장은 법 제30조의2제2항에 따라 대학의 장에게 보고된 개인별 교육지원계획의 내용을 해당 장애학생에게 대학의 장이 정하는 기간 내에 알려야 한다. 이 경우 장애학생이 요청하면 해당 계획을 장애학생이 소속된 학과ㆍ학부 또는 대학원의 장에게도 통지해야 한다.", "③ 제1항 및 제2항에서 규정한 사항 외에 개인별 수요 조사 및 교육지원계획 수립 등에 필요한 사항은 대학의 장이 정한다.", "[본조신설 2023. 4. 18.]"]}, {"no": "제32조", "title": "수업 중 활용하는 영상물의 편의제공", "lines": ["① 법 제31조제4항에 따라 대학의 장은 장애학생을 위하여 다음 각 호의 편의를 제공해야 한다.", "1. 「장애인복지법 시행령」 별표 1 제3호에 따른 시각장애인을 위하여 영상물의 화면 장면, 자막 등을 음성으로 전달하는 화면해설", "2. 「장애인복지법 시행령」 별표 1 제4호에 따른 청각장애인 또는 같은 표 제5호에 따른 언어장애인(이하 이 조에서 “청각장애인등”이라 한다)을 위하여 영상물의 음성 및 음향을 화면에 글자로 전달하는 폐쇄자막", "3. 청각장애인등을 위하여 영상물의 음성 및 음향을 손짓, 몸짓, 표정 등으로 전달하는 한국수어 통역", "② 대학의 장이 법 제31조제4항에 따라 수업 중 활용하는 영상물(이하 이 조에서 “수업영상물”이라 한다)에 제1항에 따른 편의를 제공할 때에는 다음 각 호의 방법을 사용할 수 있다.", "1. 제1항 각 호의 편의를 영상의 형태로 제작하여 수업영상물에 포함하는 방법", "2. 교육지원인력을 배치하거나 학습보조기기ㆍ보조공학기기 및 정보통신매체 등을 활용하여 제1항 각 호의 편의를 수업영상물과 함께 실시간으로 제공하는 방법", "[본조신설 2022. 6. 28.]"]}, {"no": "제32조의2", "title": "장애인고등교육지원센터의 설치ㆍ지정 등", "lines": ["① 교육부장관은 법 제33조제1항에 따라 장애인고등교육지원센터(이하 “고등교육센터”라 한다)를 설치하거나 다음 각 호의 기관 또는 법인 중에서 고등교육센터를 지정해야 한다.", "1. 「공공기관의 운영에 관한 법률」 제4조에 따른 공공기관", "2. 「고등교육법」 제2조 각 호에 따른 학교", "3. 「정부출연연구기관 등의 설립ㆍ운영 및 육성에 관한 법률」 제8조제1항에 따른 연구기관", "4. 「공익법인의 설립ㆍ운영에 관한 법률」 제2조에 따른 공익법인", "5. 「민법」 제32조에 따른 비영리법인", "6. 그 밖에 장애학생 고등교육 지원 업무에 관한 전문성을 갖춘 기관이나 법인", "② 제1항에 따라 고등교육센터로 지정받으려는 기관 또는 법인은 다음 각 호의 기준을 모두 갖추어야 한다.", "1. 법 제33조제2항 각 호에 따른 업무 수행에 필요한 조직ㆍ인력을 보유할 것", "2. 법 제33조제2항 각 호에 따른 업무 수행에 필요한 사무실, 장비ㆍ시설을 갖출 것", "3. 법 제33조제2항 각 호에 따른 업무 수행에 필요한 사업계획 및 운영규정을 갖출 것", "③ 제2항에 따라 고등교육센터가 갖추어야 하는 기준의 세부 내용은 교육부장관이 정하여 고시한다.", "④ 교육부장관은 고등교육센터를 지정하려는 경우에는 제2항 및 제3항에 따른 기준이 포함된 지정계획을 10일 이상 관보 또는 교육부 인터넷 홈페이지에 게시해야 한다.", "⑤ 고등교육센터로 지정받으려는 기관 또는 법인은 지정신청서에 다음 각 호의 서류를 첨부하여 교육부장관에게 제출해야 한다.", "1. 제2항제1호의 조직ㆍ인력의 보유 현황이나 확보 계획", "2. 제2항제2호의 사무실, 장비ㆍ시설의 보유 현황이나 확보 계획", "3. 제2항제3호의 사업계획 및 운영규정", "⑥ 고등교육센터의 지정기간은 5년으로 한다.", "⑦ 교육부장관은 제1항에 따라 지정된 고등교육센터가 다음 각 호의 어느 하나에 해당하는 경우에는 그 지정을 취소할 수 있다. 다만, 제1호에 해당하는 경우에는 그 지정을 취소해야 한다.", "1. 거짓이나 그 밖의 부정한 방법으로 지정을 받은 경우", "2. 제2항 및 제3항에 따른 기준에 적합하지 않게 된 경우", "⑧ 교육부장관은 제1항 및 제7항에 따라 고등교육센터를 지정하거나 지정을 취소한 경우에는 관보 또는 교육부 인터넷 홈페이지에 지체 없이 게시해야 한다.", "⑨ 제1항부터 제8항까지에서 규정한 사항 외에 고등교육센터의 지정ㆍ운영에 필요한 사항은 교육부장관이 정하여 고시한다.", "[본조신설 2023. 4. 18.]"]}]}, {"no": "제6장", "title": "보칙", "arts": [{"no": "제33조", "title": "심사청구 절차", "lines": ["법 제35조제3항 및 법 제36조제1항 또는 제2항에 따른 심사청구 및 그 심사청구에 대한 결과의 통지에 필요한 서류는 각각 교육부령으로 정한다. <개정 2013. 3. 23.>"]}, {"no": "제34조", "title": "규제의 재검토", "lines": ["교육부장관은 다음 각 호의 사항에 대하여 다음 각 호의 기준일을 기준으로 3년마다(매 3년이 되는 해의 1월 1일 전까지를 말한다) 그 타당성을 검토하여 개선 등의 조치를 하여야 한다. <개정 2023. 4. 18., 2026. 3. 24.>", "1. 제30조에 따른 특별지원위원회의 설치ㆍ운영: 2016년 1월 1일", "1의2. 삭제 <2026. 3. 24.>", "1의3. 삭제 <2026. 3. 24.>", "2. 제31조의2제2항에 따른 장애학생 개인별 교육지원계획의 내용을 장애학생에게 알릴 의무: 2016년 1월 1일", "3. 삭제 <2017. 5. 29.>", "[전문개정 2016. 12. 30.]"]}]}], "rul": [{"no": "", "title": "", "arts": [{"no": "제1조", "title": "목적", "lines": ["이 규칙은 「장애인 등에 대한 특수교육법」 및 같은 법 시행령에서 위임된 사항과 그 시행에 필요한 사항을 규정함을 목적으로 한다."]}, {"no": "제1조의2", "title": "특성화특수학교의 지정 절차", "lines": ["① 「장애인 등에 대한 특수교육법」(이하 “법”이라 한다) 제6조제2항 전단에 따른 특정 분야의 인재 양성을 목적으로 하는 교육을 전문적으로 실시하는 특수학교(이하 “특성화특수학교”라 한다)로 지정받으려는 특수학교의 장 또는 법인은 다음 각 호의 사항이 포함된 신청서를 작성하여 국립의 특수학교의 경우에는 교육부장관에게, 공립 또는 사립의 특수학교의 경우에는 교육감에게 각각 제출해야 한다.", "1. 특성화특수학교 운영에 관한 계획", "2. 교육과정 운영에 관한 계획", "3. 입학전형 실시에 관한 계획", "4. 교직원 배치에 관한 계획", "5. 그 밖에 특성화특수학교의 운영 등에 관하여 교육부장관 또는 교육감이 정하여 고시하는 사항", "② 교육부장관 및 교육감은 법 제6조제2항 전단에 따라 특성화특수학교를 지정하려는 경우에는 다음 각 호의 구분에 따라야 한다.", "1. 국립의 특수학교인 경우: 법 제10조제1항에 따른 중앙특수교육운영위원회의 심의를 거칠 것", "2. 공립 또는 사립의 특수학교인 경우: 법 제10조제1항에 따른 시ㆍ도특수교육운영위원회의 심의를 거칠 것", "③ 제1항 및 제2항에서 규정한 사항 외에 특성화특수학교의 지정 절차에 관하여 필요한 사항은 국립의 특수학교에 대해서는 교육부장관이, 공립 또는 사립의 특수학교에 대해서는 교육감이 각각 정하여 고시한다.", "[본조신설 2025. 6. 20.]"]}, {"no": "제2조", "title": "장애의 조기발견 등", "lines": ["① 교육장 또는 교육감은 법 제14조제1항 또는 제3항에 따른 선별검사나 진단ㆍ평가를 실시하는 경우에는 별표에 따른 검사를 각각 실시하여야 한다. <개정 2025. 6. 20.>", "② 보호자 또는 각급학교의 장은 법 제15조제1항 각 호에 해당하는 장애를 가지고 있거나 장애를 가지고 있다고 의심되는 영유아 및 학생을 발견하여 진단ㆍ평가를 의뢰하고자 하는 경우에는 별지 제1호서식에 따른 진단ㆍ평가의뢰서를 작성하여 교육장 또는 교육감에게 제출하여야 한다.", "③ 교육감 또는 교육장은 「장애인 등에 대한 특수교육법 시행령」(이하 “영”이라 한다) 제9조제5항에 따라 진단ㆍ평가의 결과를 영유아 및 학생의 보호자에게 알릴 때에는 별지 제2호서식에 따른다."]}, {"no": "제3조", "title": "특수교육대상자의 학교 배치", "lines": ["교육감 또는 교육장이 영 제11조제1항에 따라 특수교육대상자를 학교에 배치할 때에는 별지 제3호서식에 따라 해당 학교장과 특수교육대상자에게 통지하여야 한다."]}, {"no": "제3조의2", "title": "", "lines": ["삭제 <2022. 6. 29.>"]}, {"no": "제4조", "title": "개별화교육지원팀의 구성 등", "lines": ["① 각급학교의 장은 법 제22조제1항에 따라 매 학년의 시작일부터 2주 이내에 각각의 특수교육대상자에 대한 개별화교육지원팀을 구성하여야 한다.", "② 개별화교육지원팀은 매 학기의 시작일부터 30일 이내에 개별화교육계획을 작성하여야 한다.", "③ 개별화교육계획에는 특수교육대상자의 인적사항과 특별한 교육지원이 필요한 영역의 현재 학습수행수준, 교육목표, 교육내용, 교육방법, 평가계획 및 제공할 특수교육 관련서비스의 내용과 방법 등이 포함되어야 한다.", "④ 각급학교의 장은 매 학기마다 개별화교육계획에 따른 각각의 특수교육대상자의 학업성취도 평가를 실시하고, 그 결과를 특수교육대상자 또는 그 보호자에게 통보하여야 한다."]}, {"no": "제5조", "title": "지원인력의 역할 및 자격", "lines": ["① 법 제28조제3항에 따라 학교에 배치되는 지원인력은 교사의 지시에 따라 교수학습 활동, 신변처리, 급식, 교내외 활동, 등하교 등 특수교육대상자의 교육 및 학교 활동에 대하여 보조 역할을 담당한다. <개정 2022. 6. 29.>", "② 제1항에 따른 지원인력의 자격은 고등학교를 졸업한 사람 또는 이와 같은 수준 이상의 학력이 있다고 인정된 사람으로 한다. <개정 2022. 6. 29.>", "[제목개정 2022. 6. 29.]"]}, {"no": "제6조", "title": "생활지도원의 자격 및 배치기준", "lines": ["① 법 제28조제6항 후단에 따라 특수학교의 기숙사에 두는 생활지도원은 다음 각 호의 어느 하나에 해당하는 사람으로 한다. <개정 2013. 10. 4.>", "1. 「초ㆍ중등교육법」 별표 2의 자격 기준에 해당하는 사람", "2. 고등학교를 졸업한 사람 또는 이와 같은 수준 이상의 학력이 있다고 인정된 사람으로서 다음 각 목의 어느 하나에 해당하는 자격이 있는 사람", "가. 「의료기사 등에 관한 법률」 제2조에 따른 물리치료사 또는 작업치료사", "나. 「사회복지사업법」 제11조에 따른 사회복지사", "다. 「영유아보육법」 제21조제2항에 따른 보육교사", "② 법 제28조제6항 후단에 따라 국립학교에 두는 생활지도원은 학생 5명마다 1명 이상을 배치하여야 한다. 다만, 시각장애 또는 청각장애가 있는 특수교육대상자를 교육하는 중학교 및 고등학교 과정의 경우에는 학생 7명마다 1명 이상을 배치할 수 있다."]}, {"no": "제6조의2", "title": "간호사 등의 배치기준", "lines": ["법 제28조제6항 후단에 따라 국립학교에는 간호사를 1명 이상 배치하되, 기숙사에 기숙하는 학생이 50명을 초과하는 경우에는 그 초과인원 50명마다 간호사 또는 간호조무사를 1명 이상 추가로 배치하여야 한다.", "[본조신설 2013. 10. 4.]"]}, {"no": "제7조", "title": "특별지원위원회에 대한 심사청구 결과 통보 등", "lines": ["① 법 제35조제3항에 따라 장애학생 또는 그 보호자가 심사청구를 할 때에는 별지 제4호서식에 따른 심사청구서를 해당 학교의 특별지원위원회에 제출하여야 한다.", "② 제1항에 따른 심사청구를 받은 해당 학교의 특별지원위원회는 심사를 거쳐 별지 제5호서식에 따른 심사결과통지서를 그 청구인에게 교부하여야 한다."]}, {"no": "제8조", "title": "고등학교 과정 이하의 심사청구 결과 통보 등", "lines": ["① 법 제36조제1항 또는 제2항에 따라 특수교육대상자, 그 보호자 또는 각급학교의 장이 심사청구를 할 때에는 별지 제6호서식에 따른 심사청구서를 해당 시ㆍ군ㆍ구특수교육운영위원회 또는 시ㆍ도특수교육운영위원회에 제출하여야 한다.", "② 제1항에 따른 심사청구를 받은 해당 시ㆍ군ㆍ구특수교육운영위원회 또는 시ㆍ도특수교육운영위원회는 심사를 거쳐 별지 제7호서식에 따른 심사결과통지서를 그 청구인에게 교부하여야 한다."]}]}], "bylDec": ["■ 장애인 등에 대한 특수교육법 시행령 [별표]<개정 2025. 2. 25.>", "특수교육대상자 선정 기준(제10조 관련)", "1. 시각장애를 지닌 특수교육대상자", "시각계의 손상이 심하여 시각기능을 전혀 이용하지 못하거나 보조공학기기의 지원을 받아야 시각적 과제를 수행할 수 있는 사람으로서 시각에 의한 학습이 곤란하여 특정의 광학기구ㆍ학습매체 등을 통하여 학습하거나 촉각 또는 청각을 학습의 주요 수단으로 사용하는 사람", "2. 청각장애를 지닌 특수교육대상자", "청력 손실이 심하여 보청기를 착용해도 청각을 통한 의사소통이 불가능 또는 곤란한 상태이거나, 청력이 남아 있어도 보청기를 착용해야 청각을 통한 의사소통이 가능하여 청각에 의한 교육적 성취가 어려운 사람", "3. 지적장애를 지닌 특수교육대상자", "지적 기능과 적응행동상의 어려움이 함께 존재하여 교육적 성취에 어려움이 있는 사람", "4. 지체장애를 지닌 특수교육대상자", "기능ㆍ형태상 장애를 가지고 있거나 몸통을 지탱하거나 팔다리의 움직임 등에 어려움을 겪는 신체적 조건이나 상태로 인해 교육적 성취에 어려움이 있는 사람", "5. 정 /* ----- 빈칸 채우기 ----- */
const LAW_BLANKABLE=LAW_ARTS.filter(a=>!/^삭제/.test(a.lines[0])&&!a.futureOnly);
S.lb={idx:0,amt:"low",seed:1,vals:{},graded:false,reveal:false};
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function buildBlanks(a,seed,amt){
  const segs=[];let id=0;const r=rng(seed+a.no.length*97+a.no.charCodeAt(a.no.length-2)*13);
  a.lines.forEach((line,li)=>{
    const parts=[];
    lawNote(line).split(/(\u0000[^\u0001]*\u0001)/).forEach(part=>{
      if(part.startsWith("\u0000")){parts.push({t:"note",s:part.slice(1,-1)});return;}
      BLANK_RE.lastIndex=0;let m,lst=0;
      while((m=BLANK_RE.exec(part))){
        parts.push({t:"txt",s:part.slice(lst,m.index)});
        const kind=m[1]?"actor":m[2]?"num":"term";let act=null;
        if(kind==="actor"){ACTOR_RE.lastIndex=0;const am=ACTOR_RE.exec(m[0]);if(am)act=ACTORS[am.slice(1).findIndex(Boolean)];}
        parts.push({t:"cand",s:m[0],kind,act});lst=m.index+m[0].length;
      }
      parts.push({t:"txt",s:part.slice(lst)});
    });
    segs.push({li,parts});
  });
  // 기간·숫자 > 행위 주체 > 핵심 용어 순으로 우선, 조금만
  const cands=segs.flatMap(s=>s.parts.filter(p=>p.t==="cand"));
  const cap={low:2,mid:4,high:7}[amt], ratio={low:.15,mid:.3,high:.5}[amt];
  const n=Math.min(cap,Math.max(1,Math.round(cands.length*ratio)),cands.length);
  const w={num:4,actor:3,term:1};
  const pool=cands.map(p=>({p,k:Math.pow(r(),1/w[p.kind])}));   // 가중 무작위 추출
  pool.sort((x,y)=>y.k-x.k);
  const used=new Set();
  for(const {p} of pool){if(used.size>=n)break;if([...used].some(q=>q.s===p.s))continue;p.blank=true;used.add(p);}
  cands.filter(p=>p.blank).forEach(p=>p.id=id++);
  return {segs,count:id};
}
const normAns=s=>s.replace(/\s+/g,"").replace(/[·・.]/g,"ㆍ");
function lawBlank(){
  const a=LAW_BLANKABLE[S.lb.idx],b=buildBlanks(a,S.lb.seed,S.lb.amt);
  const all=b.segs.flatMap(s=>s.parts).filter(p=>p.blank);
  const right=all.filter(p=>normAns(S.lb.vals[p.id]||"")===normAns(p.s)).length;
  const body=b.segs.map(({li,parts})=>{
    const cls=li===0?"":lineCls(a.lines[li]);
    return `<p class="${cls}">${parts.map(p=>{
      if(p.t==="note")return `<span class="lnote">${esc(p.s)}</span>`;
      if(p.t!=="cand"||!p.blank)return esc(p.s);
      const v=S.lb.vals[p.id]||"",ok=normAns(v)===normAns(p.s);
      if(S.lb.reveal)return `<span class="bl show ${p.act?"act":""}" ${p.act?`style="--hl:${p.act.col}"`:""}>${esc(p.s)}</span>`;
      const hl=p.act?` style="--hl:${p.act.col}"`:"";
      if(S.lb.graded)return ok?`<span class="bl okv ${p.act?"act":""}"${hl}>${esc(p.s)}</span>`:`<span class="bl wrongv">${v.trim()?`<s>${esc(v)}</s> `:""}${esc(p.s)}</span>`;
      return `<input class="bl ${p.act?"act":""}" data-b="${p.id}" value="${esc(v)}" title="${p.act?p.act.name+" 자리":p.kind==="num"?"기간·숫자":"핵심 용어"}" style="${p.act?`--hl:${p.act.col};`:""}width:${Math.min(Math.max(3,p.s.length)*1.05+1.4,18)}em" aria-label="빈칸 ${p.id+1}" autocomplete="off">`;
    }).join("")}</p>`;}).join("");
  return `
  <div class="lbtop">
    <label for="lbsel" class="vh">조문 선택</label>
    <select id="lbsel">${LAW.map((c,ci)=>`<optgroup label="${c.no} ${esc(c.title)}">${LAW_BLANKABLE.map((x,i)=>x.ch===ci?`<option value="${i}" ${i===S.lb.idx?"selected":""}>${x.no}${x.title?`(${esc(x.title)})`:""}</option>`:"").join("")}</optgroup>`).join("")}</select>
    <div class="seg" role="group" aria-label="빈칸 양">${[["low","조금"],["mid","보통"],["high","많이"]].map(([k,l])=>`<button aria-pressed="${S.lb.amt===k}" data-amt="${k}">${l}</button>`).join("")}</div>
  </div>
  <article class="lart blankart"><header><b>${a.no}${a.title?`(${esc(a.title)})`:""}</b><span class="src">빈칸 ${b.count}개</span></header>${body}</article>
  ${S.lb.graded?`<div class="lbscore ${right===b.count?"ok":""}"><b>${right} / ${b.count}</b> 맞혔어요${right===b.count?" · 완벽해요!":" · 빨간 칸이 틀린 곳이에요"}</div>`:""}
  <div class="row2"><button class="btn ghost" id="lbReveal">${S.lb.reveal?"빈칸으로 돌아가기":"정답 보기"}</button><button class="btn" id="lbGrade">${S.lb.graded?"다시 풀기":"채점하기"}</button></div>
  <div class="row2"><button class="btn ghost" id="lbPrev" ${S.lb.idx===0?"disabled":""}>이전 조문</button><button class="btn ghost" id="lbNext" ${S.lb.idx>=LAW_BLANKABLE.length-1?"disabled":""}>다음 조문</button></div>
  <button class="btn blue" id="lbRand">무작위 조문으로 새로 뚫기</button>
  <p class="src">색이 칠해진 빈칸은 행위 주체 자리예요. 법 읽기의 형광펜과 같은 색이라 색으로 누가 들어갈지 떠올릴 수 있어요. 기간·숫자, 행위 주체, 핵심 용어 순으로 우선해서 조문마다 조금만 뚫어요. 틀린 칸은 빨간색으로 정답을 보여 줘요. 띄어쓰기는 채점하지 않아요. ‘ㆍ’ 대신 ‘·’나 ‘.’을 써도 돼요. 시행 전 개정 조문은 빼고 현재 시행 중인 조문으로만 만들어요.</p>`;

    ${L.wrong.length?`<section class="sect"><h3>틀린 문제</h3>${L.wrong.map(i=>{const q=LQ[i];return `<div class="lqrev"><p>${esc(q.q)}</p><p class="ok">정답: ${esc(q.a)}</p><p class="src">법 ${q.no}</p></div>`;}).join("")}</section>`:""}
    <div class="row2">${L.wrong.length?`<button class="btn" id="lqRetry">틀린 문제 다시</button>`:""}<button class="btn ghost" id="lqHome">처음으로</button></div>`;

  else body=`<div class="mclist">${q.opts.map((o,k)=>`<button class="opt mcopt ${a?(o===q.a?"right":(o===L.sel?"wrong":"")):""}" data-lo="${esc(o)}" aria-pressed="${!a&&L.sel===o}" ${a?"disabled":""}><span>${"①②③④"[k]}</span>${esc(o)}</button>`).join("")}</div>`;
  const art=findArt("law",q.no);
  return `
  <div class="cmpnav"><button class="btn ghost" id="lqQuit">그만하기</button><span>${L.i+1} / ${L.qs.length} · 맞힘 ${L.right}</span><span class="tchip">${TLABEL[q.t]}</span></div>
  <article class="card"><p class="qtext">${esc(q.q).replace("(   )",`<span class="qblank">${a&&q.t==="short"?esc(q.a):""}</span>`)}</p>${body}
  ${a?`<div class="lqfb ${a.ok?"ok":"no"}"><b>${a.ok?"정답이에요!":"아쉬워요"}</b>${a.ok?"":`<p>정답: <b>${esc(q.a)}</b></p>`}<p>${esc(q.why)}</p>
    <div class="lqquote"><span class="src">근거 · 법 ${q.no}${art&&art.title?`(${esc(art.title)})`:""}</span>${q.quote.split("\n").map(l=>`<p>${lawLineHTML(l,true)}</p>`).join("")}</div></div>`:""}
  </article>

function wireLq(){
  const $=s=>app.querySelector(s);const L=S.lq;
  const b10=$("#lq10");if(b10)b10.onclick=()=>lqStart(shuffle(LQ.map((_,i)=>i)).slice(0,10));
  const ba=$("#lqAll");if(ba)ba.onclick=()=>lqStart(shuffle(LQ.map((_,i)=>i)));
  const rt=$("#lqRetry");if(rt)rt.onclick=()=>lqStart(shuffle(L.wrong));
  const hm=$("#lqHome");if(hm)hm.onclick=()=>{S.lq=null;render();};
  const qt=$("#lqQuit");if(qt)qt.onclick=()=>{S.lq=null;render();};
  if(!L||L.i>=L.qs.length)return;
  const q=LQ[L.qs[L.i]];
  const inp=$("#lqin");if(inp){inp.oninput=()=>{L.val=inp.value;$("#lqCheck").disabled=!inp.value.trim();};inp.onkeydown=e=>{if(e.key==="Enter"&&inp.value.trim()){e.preventDefault();$("#lqCheck").click();}};}
  app.querySelectorAll("[data-lo]").forEach(b=>b.onclick=()=>{L.sel=b.dataset.lo;render();});
  const ck=$("#lqCheck");if(ck)ck.onclick=()=>{let ok;
    if(q.t==="short"){ok=[q.a,...q.alt].some(x=>lqNorm(x)===lqNorm(L.val));}else ok=L.sel===q.a;
    L.ans={ok};if(ok)L.right++;else L.wrong.push(L.qs[L.i]);render();};
  const nx=$("#lqNext");if(nx)nx.onclick=()=>{L.i++;L.val="";L.sel=null;L.ans=null;render();scrollTo(0,0);const n=$("#lqin");if(n)n.focus();};
}

function wireLaw(){
  const $=s=>app.querySelector(s);
  app.querySelectorAll("[data-jump]").forEach(a=>a.onclick=e=>{e.preventDefault();const el=document.getElementById(a.dataset.jump);if(el)scrollTo({top:el.getBoundingClientRect().top+scrollY-12,behavior:"smooth"});});
  app.querySelectorAll("[data-lawmode]").forEach(b=>b.onclick=()=>{S.lawMode=b.dataset.lawmode;TY.key=null;render();});
  if(S.lawMode==="type"&&S.tab==="read")wireTyping(f=>{render();if(f){const i=document.getElementById("tyIn");if(i)i.focus();}});
  const ch=$("#lawch");if(ch)ch.onchange=()=>{Object.assign(lawPos(S.lawDoc),{k:+ch.value,a:0});render();};
  app.querySelectorAll("[data-ai]").forEach(b=>b.onclick=()=>{lawPos(S.lawDoc).a=+b.dataset.ai;render();});
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const [k,i]=b.dataset.go.split(":").map(Number);Object.assign(lawPos(S.lawDoc),{k,a:Math.max(0,i)});S.lawQ="";render();scrollTo(0,0);});
  const lp=$("#lawPrev");if(lp)lp.onclick=()=>lawGo(-1);
  const ln=$("#lawNext");if(ln)ln.onclick=()=>lawGo(1);
  const strip=$("#lawstrip");if(strip){const on=strip.querySelector(".on");if(on)strip.scrollLeft=on.offsetLeft-strip.clientWidth/2+on.clientWidth/2;}
  const sw=$("#lawswipe");if(sw){let x0=null,y0=null;sw.addEventListener("touchstart",e=>{if(e.target.closest("textarea")){x0=null;return;}x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
    sw.addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;if(Math.abs(dx)>60&&Math.abs(dy)<50&&!getSelection().toString())lawGo(dx<0?1:-1);},{passive:true});}
  const lg=$("#lawLegend");if(lg)lg.ontoggle=()=>{S.lawLegend=lg.open;};
  app.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{S.lawOn[b.dataset.act]=S.lawOn[b.dataset.act]===false;render();});
  const on=$("#hlAll");if(on)on.onclick=()=>{S.lawOn={};render();};
  const off=$("#hlNone");if(off)off.onclick=()=>{ACTORS.forEach(a=>S.lawOn[a.id]=false);render();};
  const q=$("#lawq");if(q){q.oninput=()=>{S.lawQ=q.value;clearTimeout(S._lq);S._lq=setTimeout(()=>{const pos=q.selectionStart;render();const n=$("#lawq");if(n){n.focus();n.setSelectionRange(pos,pos);}},250);};}
  app.querySelectorAll("[data-listen]").forEach(b=>b.onclick=()=>ttsStart(S.lawDoc,b.dataset.listen));
  fillVoices();const la=app.querySelector("#listenAll");if(la)la.onclick=()=>ttsStart(S.lawDoc,ttsArts(S.lawDoc)[0].no);
  app.querySelectorAll("[data-doc]").forEach(b=>b.onclick=()=>{S.lawDoc=b.dataset.doc;S.lawQ="";render();scrollTo(0,0);});
  app.querySelectorAll("[data-next]").forEach(b=>b.onclick=()=>{S.lawNext[b.dataset.next]=!S.lawNext[b.dataset.next];render();});
  // 빈칸
  const sel=$("#lbsel");if(sel)sel.onchange=()=>{S.lb={...S.lb,idx:+sel.value,vals:{},graded:false,reveal:false};render();};
  app.querySelectorAll("[data-amt]").forEach(b=>b.onclick=()=>{S.lb={...S.lb,amt:b.dataset.amt,vals:{},graded:false,reveal:false};render();});
  app.querySelectorAll("input.bl").forEach(inp=>{inp.oninput=()=>{S.lb.vals[inp.dataset.b]=inp.value;};
    inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();const all=[...app.querySelectorAll("input.bl")];const i=all.indexOf(inp);if(all[i+1])all[i+1].focus();else $("#lbGrade").click();}};});
  const g=$("#lbGrade");if(g)g.onclick=()=>{if(S.lb.graded){S.lb={...S.lb,vals:{},graded:false};}else{S.lb.graded=true;S.lb.reveal=false;}render();};
  const rv=$("#lbReveal");if(rv)rv.onclick=()=>{S.lb.reveal=!S.lb.reveal;render();};
  const go=i=>{S.lb={...S.lb,idx:i,vals:{},graded:false,reveal:false,seed:S.lb.seed+1};render();scrollTo(0,0);};
  const p=$("#lbPrev");if(p)p.onclick=()=>go(S.lb.idx-1);
  const n=$("#lbNext");if(n)n.onclick=()=>go(S.lb.idx+1);
  const r=$("#lbRand");if(r)r.onclick=()=>go(Math.floor(Math.random()*LAW_BLANKABLE.length));
}

주는 맞춤형 교육에 대한 요구가 증가하고 있다."}, {"k": "p", "s": "넷째, 교육과정 의사 결정 과정에 다양한 교육 주체들의 참여를 확대하고 교육과정 자율화 및 분권화를 활성화해야 한다는 요구가 높아지고 있다."}, {"k": "p", "s": "이에 그동안의 교육과정 발전 방향을 계승하면서 미래 사회를 살아갈 학생들이 주도적으로 삶을 이끌어가는 능력을 함양할 수 있도록 교육과정을 구성한다."}, {"k": "p", "s": "이 교육과정은 우리나라 교육과정이 추구해 온 교육 이념과 인간상을 바탕으로, 미래 사회가 요구하는 핵심역량을 함양하여 포용성과 창의성을 갖춘 주도적인 사람으로 성장하게 하는 데 중점을 둔다."}, {"k": "p", "s": "이를 위한 교육과정 구성의 중점은 다음과 같다."}, {"k": "gs", "s": "가. 디지털 전환, 기후⋅생태환경 변화 등에 따른 미래 사회의 불확실성에 능동적으로 대응할 수 있는 능력과 자신의 삶과 학습을 스스로 이끌어가는 주도성을 함양한다."}, {"k": "gs", "s": "나. 학생 개개인의 인격적 성장을 지원하고, 사회 구성원 모두의 행복을 위해 서로 존중하고 배려하며 협력하는 공동체 의식을 함양한다."}, {"k": "gs", "s": "다. 모든 학생이 학습의 기초인 언어‧수리‧디지털 기초소양을 갖출 수 있도록 하여 학교 교육과 평생 학습에서 학습을 지속할 수 있게 한다."}, {"k": "gs", "s": "라. 학생들이 자신의 진로와 학습을 주도적으로 설계하고, 적절한 시기에 학습할 수 있도록 학습자 맞춤형 교육과정 체제를 구축한다."}, {"k": "gs", "s": "마. 교과 교육에서 깊이 있는 학습을 통해 역량을 함양할 수 있도록 교과 간 연계와 통합, 학생의 삶과 연계된 학습, 학습에 대한 성찰 등을 강화한다."}, {"k": "gs", "s": "바. 다양한 학생 참여형 수업을 활성화하고, 문제 해결 및 사고의 과정을 중시하는 평가를 통해 학습의 질을 개선한다."}, {"k": "gs", "s": "사. 교육과정 자율화⋅분권화를 기반으로 학교, 교사, 학부모, 시⋅도 교육청, 교육부 등 교육 주체들 간의 협조 체제를 구축하여 학습자의 특성과 학교 여건에 적합한 학습이 이루어질 수 있도록 한다."}]}, {"h": "2. 추구하는 인간상과 핵심역량", "lines": [{"k": "p", "s": "우리나라의 교육은 홍익인간의 이념 아래 모든 국민으로 하여금 인격을 도야하고, 자주적 생활 능력과 민주시민으로서 필요한 자질을 갖추어 인간다운 삶을 영위하고, 민주 국가의 발전과 인류 공영의 이상을 실현할 수 있도록 함을 목적으로 한다."}, {"k": "p", "s": "이러한 교육 이념과 교육 목적을 바탕으로, 이 교육과정이 추구하는 인간상은 다음과 같다."}, {"k": "gs", "s": "가. 전인적 성장을 바탕으로 자아정체성을 확립하고 자신의 진로와 삶을 스스로 개척하는 자기주도적인 사람"}, {"k": "gs", "s": "나. 폭넓은 기초 능력을 바탕으로 진취적 발상과 도전을 통해 새로운 가치를 창출하는 창의적인 사람"}, {"k": "gs", "s": "다. 문화적 소양과 다원적 가치에 대한 이해를 바탕으로 인류 문화를 향유하고 발전시키는 교양 있는 사람"}, {"k": "gs", "s": "라. 공동체 의식을 바탕으로 다양성을 이해하고 서로 존중하며 세계와 소통하는 민주시민으로서 배려와 나눔, 협력을 실천하는 더불어 사는 사람"}, {"k": "p", "s": "이 교육과정이 추구하는 인간상을 구현하기 위해 교과 교육과 창의적 체험활동을 포함한 학교 교육 전 과정을 통해 중점적으로 기르고자 하는 핵심역량은 다음과 같다."}, {"k": "gs", "s": "가. 자아정체성과 자신감을 가지고 자신의 삶과 진로를 스스로 설계하며 이에 필요한 기초 능력과 자질을 갖추어 자기주도적으로 살아갈 수 있는 자기관리 역량"}, {"k": "gs", "s": "나. 문제를 합리적으로 해결하기 위하여 다양한 영역의 지식과 정보를 깊이 있게 이해하고 비판적으로 탐구하며 활용할 수 있는 지식정보처리 역량"}, {"k": "gs", "s": "다. 폭넓은 기초 지식을 바탕으로 다양한 전문 분야의 지식, 기술, 경험을 융합적으로 활용하여 새로운 것을 창출하는 창의적 사고 역량"}, {"k": "gs", "s": "라. 인간에 대한 공감적 이해와 문화적 감수성을 바탕으로 삶의 의미와 가치를 성찰하고 향유하는 심미적 감성 역량"}, {"k": "gs", "s": "마. 다른 사람의 관점을 존중하고 경청하는 가운데 자신의 생각과 감정을 효과적으로 표현하며 상호협력적인 관계에서 공동의 목적을 구현하는 협력적 소통 역량"}, {"k": "gs", "s": "바. 지역⋅국가⋅세계 공동체의 구성원에게 요구되는 개방적⋅포용적 가치와 태도로 지속 가능한 인류 공동체 발전에 적극적이고 책임감 있게 참여하는 공동체 역량"}]}, {"h": "3. 학교급별 교육 목표", "lines": [{"k": "gh", "s": "나. 중학교 교육 목표"}, {"k": "p", "s": "중학교 교육은 초등학교 교육의 성과를 바탕으로, 학생의 일상생활과 학습에 필요한 기본 능력을 기르고, 바른 인성 및 민주시민의 자질을 함양하는 데 중점을 둔다."}, {"k": "i1", "s": "1) 심신의 조화로운 발달을 바탕으로 자아존중감을 기르고, 다양한 지식과 경험을 통해 책임감을 가지고 적극적으로 삶의 방향과 진로를 탐색한다."}, {"k": "i1", "s": "2) 학습과 생활에 필요한 기본 능력 및 문제 해결력을 바탕으로, 도전정신과 창의적 사고력을 기른다."}, {"k": "i1", "s": "3) 자신을 둘러싼 세계에서 경험한 내용을 토대로 우리나라와 세계의 다양한 문화를 이해하고 공감하는 태도를 기른다."}, {"k": "i1", "s": "4) 공동체 의식을 바탕으로 타인을 존중하고 서로 소통하는 민주시민의 자질과 태도를 기른다."}, {"k": "gh", "s": "다. 고등학교 교육 목표"}, {"k": "p", "s": "고등학교 교육은 중학교 교육의 성과를 바탕으로, 학생의 적성과 소질에 맞게 진로를 개척하며 세계와 소통하는 민주시민으로서의 자질을 함양하는 데 중점을 둔다."}, {"k": "i1", "s": "1) 성숙한 자아의식과 인간의 존엄성에 대한 존중을 바탕으로 일의 가치를 이해하고, 자신의 진로에 맞는 지식과 기능을 익히며 평생 학습의 기본 능력을 기른다."}, {"k": "i1", "s": "2) 다양한 분야의 지식과 경험을 융합하여 창의적으로 문제를 해결하고, 새로운 상황에 능동적으로 대처하는 능력을 기른다."}, {"k": "i1", "s": "3) 다양한 문화에 대한 이해를 바탕으로 자신의 삶을 성찰하고 새로운 문화 창출에 기여할 수 있는 자질과 태도를 기른다."}, {"k": "i1", "s": "4) 국가 공동체에 대한 책임감을 바탕으로 배려와 나눔을 실천하며 세계와 소통하는 민주시민으로서의 자질과 태도를 기른다."}]}]}, {"id": "c2", "short": "Ⅱ 설계와 운영", "name": "Ⅱ. 학교 교육과정 설계와 운영", "intro": ["이 장에서는 초⋅중등교육법에 근거한 국가 교육과정에 따라 학교 교육과정을 설계하고 운영할 때 지향해야 할 방향과 고려해야 할 일반적인 원칙을 제시한다.", "• ‘설계의 원칙’에서는 학교 교육과정을 설계하고 운영할 때 반영해야 할 주요 원칙들과 유의사항 및 절차 등을 안내한다.", "• ‘교수⋅학습’에서는 학습의 일반적 원리에 근거하여 수업을 설계하고 운영할 때 고려해야 할 주요 원칙들을 제시한다.", "• ‘평가’에서는 학교 교육과정 설계⋅운영의 맥락에서 평가가 학습자의 성장을 지원하는 데 고려해야 할 원칙과 유의사항을 제시한다.", "• ‘모든 학생을 위한 교육기회의 제공’에서는 다양한 특성을 가진 학습자들이 차별을 받지 않고 적합한 교육기회를 갖게 하는 데 필요한 지원 과제를 안내한다."], "secs": [{"h": "1. 설계의 원칙", "lines": [{"k": "gs", "s": "가. 학교는 이 교육과정을 바탕으로 학교 교육과정을 자율적으로 설계⋅운영하며, 학생의 특성과 학교 여건에 적합한 학습 경험을 제공한다."}, {"k": "i1", "s": "1) 학습자의 발달 수준에 적합한 폭넓고 균형 있는 교육과정을 통해 다양한 영역의 세계를 탐색해보는 기회를 제공하고, 학습자의 전인적인 성장⋅발달이 가능하도록 학교 교육과정을 설계하여 운영한다."}, {"k": "i1", "s": "2) 학생 실태와 요구, 교원 조직과 교육 시설⋅설비 등 학교 실태, 학부모 의견 및 지역사회 실정 등 학교의 교육 여건과 환경을 종합적으로 고려하여 학습자에게 적합한 학습 경험을 제공한다."}, {"k": "i1", "s": "3) 학교는 학생의 필요와 요구에 따라 학교의 특성을 고려하여 다양한 교육 활동을 설계하여 운영할 수 있다."}, {"k": "i1", "s": "4) 학교 교육 기간을 포함한 평생 학습에 필요한 기초소양과 자기주도 학습 능력을 갖출 수 있도록 지원하며 학습 격차를 줄이도록 노력한다."}, {"k": "i1", "s": "5) 학생들의 자발적인 참여를 원칙으로 하여 학교와 시⋅도 교육청은 학생과 학부모의 요구에 따라 방과 후 활동 또는 방학 중 활동을 운영⋅지원할 수 있다."}, {"k": "i1", "s": "6) 학교는 학교 교육과정의 효율적인 설계와 운영을 위하여 지역사회의 인적, 물적 자원을 계획적으로 활용한다."}, {"k": "i1", "s": "7) 학교는 가정 및 지역과 연계하여 학생이 건전한 생활 태도와 행동 양식을 가지고 학습할 수 있도록 지도한다."}, {"k": "gs", "s": "나. 학교 교육과정은 모든 교원이 전문성을 발휘하여 참여하는 민주적인 절차와 과정을 거쳐 설계⋅운영하며, 지속적인 개선을 위해 노력한다."}, {"k": "i1", "s": "1) 교육과정의 합리적 설계와 효율적 운영을 위해 교원, 교육 전문가, 학부모 등이 참여하는 학교 교육과정 위원회를 구성⋅운영하며, 이 위원회는 학교장의 교육과정 운영 및 의사 결정에 관한 자문 역할을 담당한다. 단, 특성화 고등학교와 산업수요 맞춤형 고등학교의 경우에는 산업계 전문가가 참여할 수 있고, 통합교육이 이루어지는 학교의 경우에는 특수교사가 참여할 것을 권장한다."}, {"k": "i1", "s": "2) 학교는 학습 공동체 문화를 조성하고 동학년 모임, 교과별 모임, 현장 연구, 자체 연수 등을 통해서 교사들의 교육 활동 개선이 이루어지도록 한다."}, {"k": "i1", "s": "3) 학교는 학교 교육과정 설계⋅운영의 적절성과 효과성 등을 자체 평가하여 문제점과 개선점을 추출하고, 다음 학년도의 교육과정 설계⋅운영에 그 결과를 반영한다."}]}, {"h": "2. 교수⋅학습", "lines": [{"k": "gs", "s": "가. 학교는 학생들이 깊이 있는 학습을 통해 핵심역량을 함양할 수 있도록 교수⋅학습을 설계하여 운영한다."}, {"k": "i1", "s": "1) 단편적 지식의 암기를 지양하고 각 교과목의 핵심 아이디어를 중심으로 지식⋅이해, 과정⋅기능, 가치⋅태도의 내용 요소를 유기적으로 연계하며 학생의 발달 단계에 따라 학습 경험의 폭과 깊이를 확장할 수 있도록 수업을 설계한다."}, {"k": "i1", "s": "2) 교과 내 영역 간, 교과 간 내용 연계성을 고려하여 수업을 설계하고 지도함으로써 학생들이 융합적으로 사고하고 창의적으로 문제를 해결하는 능력을 함양할 수 있도록 한다."}, {"k": "i1", "s": "3) 학습 내용을 실생활 맥락 속에서 이해하고 적용하는 기회를 제공함으로써 학교에서의 학습이 학생의 삶에 의미 있는 학습 경험이 되도록 한다."}, {"k": "i1", "s": "4) 학생이 여러 교과의 고유한 탐구 방법을 익히고 자신의 학습 과정과 학습 전략을 점검하며 개선하는 기회를 제공하여 스스로 탐구하고 학습할 수 있는 자기주도 학습 능력을 함양할 수 있도록 한다."}, {"k": "i1", "s": "5) 교과의 깊이 있는 학습에 기반이 되는 언어⋅수리⋅디지털 기초소양을 모든 교과를 통해 함양할 수 있도록 수업을 설계한다."}, {"k": "gs", "s": "나. 학교는 학생들이 수업에 능동적으로 참여하고 학습의 즐거움을 경험할 수 있도록 교수⋅학습을 설계하여 운영한다."}, {"k": "i1", "s": "1) 학습 주제에서 다루는 탐구 질문에 관심과 호기심을 가지고 스스로 문제를 해결하는 학생 참여형 수업을 활성화하며, 토의⋅토론 학습을 통해 자신의 생각을 표현하는 기회를 가질 수 있도록 한다."}, {"k": "i1", "s": "2) 실험, 실습, 관찰, 조사, 견학 등의 체험 및 탐구 활동 경험이 충분히 이루어질 수 있도록 한다."}, {"k": "i1", "s": "3) 개별 학습 활동과 함께 소집단 협동 학습 활동을 통하여 협력적으로 문제를 해결하는 경험을 충분히 갖도록 한다."}, {"k": "gs", "s": "다. 교과의 특성과 학생의 능력, 적성, 진로를 고려하여 학습 활동과 방법을 다양화하고, 학교의 여건과 학생의 특성에 따라 다양한 학습 집단을 구성하여 학생 맞춤형 수업을 활성화한다."}, {"k": "i1", "s": "1) 학생의 선행 경험, 선행 지식, 오개념 등 학습의 출발점을 파악하고 학생의 특성을 고려하여 학습 소재, 자료, 활동을 다양화한다."}, {"k": "i1", "s": "2) 정보통신기술 매체를 활용하여 교수⋅학습 방법을 다양화하고, 학생 맞춤형 학습을 위해 지능정보기술을 활용할 수 있다."}, {"k": "i1", "s": "3) 다문화 가정 배경, 가족 구성, 장애 유무 등 학습자의 개인적⋅사회문화적 배경의 다양성을 이해하고 존중하며, 이를 수업에 반영할 때 편견과 고정 관념, 차별을 야기하지 않도록 유의한다."}, {"k": "i1", "s": "4) 학교는 학생 개개인의 학습 상황을 확인하여 학생의 학습 결손을 예방하도록 노력하며, 학습 결손이 발생한 경우 보충 학습 기회를 제공한다."}, {"k": "gs", "s": "라. 교사와 학생 간, 학생과 학생 간 상호 신뢰와 협력이 가능한 유연하고 안전한 교수⋅학습 환경을 지원하고, 디지털 기반 학습이 가능하도록 교육공간과 환경을 조성한다."}, {"k": "i1", "s": "1) 각 교과의 특성에 맞는 다양한 학습이 이루어질 수 있도록 교과 교실 운영을 활성화하며, 고등학교는 학점 기반 교육과정 운영을 위해 유연한 학습공간을 활용한다."}, {"k": "i1", "s": "2) 학교는 교과용 도서 이외에 시⋅도 교육청이나 학교 등에서 개발한 다양한 교수⋅학습 자료를 활용할 수 있다."}, {"k": "i1", "s": "3) 다양한 지능정보기술 및 도구를 활용하여 효율적인 학습을 지원할 수 있도록 디지털 학습 환경을 구축한다."}, {"k": "i1", "s": "4) 학교는 실험 실습 및 실기 지도 과정에서 학생의 안전사고를 예방하기 위해 시설⋅기구, 기계, 약품, 용구 사용의 안전에 유의한다."}, {"k": "i1", "s": "5) 특수교육 대상 학생 등 교육적 요구가 다양한 학생들을 위해 필요할 경우 의사소통 지원, 행동 지원, 보조공학 지원 등을 제공한다."}]}, {"h": "3. 평가", "lines": [{"k": "gs", "s": "가. 평가는 학생 개개인의 교육 목표 도달 정도를 확인하고, 학습의 부족한 부분을 보충하며, 교수⋅학습의 질을 개선하는 데 주안점을 둔다."}, {"k": "i1", "s": "1) 학교는 학생에게 평가 결과에 대한 적절한 정보를 제공하고 추수 지도를 실시하여 학생이 자신의 학습을 지속적으로 성찰하고 개선할 수 있도록 한다."}, {"k": "i1", "s": "2) 학교와 교사는 학생 평가 결과를 활용하여 수업의 질을 지속적으로 개선한다."}, {"k": "gs", "s": "나. 학교와 교사는 성취기준에 근거하여 교수⋅학습과 평가 활동이 일관성 있게 이루어지도록 한다."}, {"k": "i1", "s": "1) 학습의 결과만이 아니라 결과에 이르기까지의 학습 과정을 확인하고 환류하여, 학습자의 성공적인 학습과 사고 능력 함양을 지원한다."}, {"k": "i1", "s": "2) 학교는 학생의 인지적⋅정의적 측면에 대한 평가가 균형 있게 이루어질 수 있도록 하며, 학생이 자신의 학습 과정과 결과를 스스로 평가할 수 있는 기회를 제공한다."}, {"k": "i1", "s": "3) 학교는 교과목별 성취기준과 평가기준에 따라 성취수준을 설정하여 교수⋅학습 및 평가 계획에 반영한다."}, {"k": "i1", "s": "4) 학생에게 배울 기회를 주지 않은 내용과 기능은 평가하지 않는다."}, {"k": "gs", "s": "다. 학교는 교과목의 성격과 학습자 특성을 고려하여 적합한 평가 방법을 활용한다."}, {"k": "i1", "s": "1) 수행평가를 내실화하고 서술형과 논술형 평가의 비중을 확대한다."}, {"k": "i1", "s": "2) 정의적, 기능적 측면이나 실험⋅실습이 중시되는 평가에서는 교과목의 성격을 고려하여 타당하고 합리적인 기준과 척도를 마련하여 평가를 실시한다."}, {"k": "i1", "s": "3) 학교의 여건과 교육활동의 특성을 고려하여 다양한 지능정보기술을 활용함으로써 학생 맞춤형 평가를 활성화한다."}, {"k": "i1", "s": "4) 개별 학생의 발달 수준 및 특성을 고려하여 평가 계획을 조정할 수 있으며, 특수학급 및 일반학급에 재학하고 있는 특수교육 대상 학생을 위해 필요한 경우 평가 방법을 조정할 수 있다."}, {"k": "i1", "s": "5) 창의적 체험활동은 내용과 특성을 고려하여 평가의 주안점을 학교에서 결정하여 평가한다."}]}, {"h": "4. 모든 학생을 위한 교육기회의 제공", "lines": [{"k": "gs", "s": "가. 교육 활동 전반을 통하여 남녀의 역할, 학력과 직업, 장애, 종교, 이전 거주지, 인종, 민족, 언어 등에 관한 고정 관념이나 편견을 가지지 않도록 지도한다."}, {"k": "gs", "s": "나. 학습자의 개인적 특성이나 사회⋅문화적 배경에 의해 교육의 기회와 학습 경험에서 부당한 차별을 받거나 소외되지 않도록 한다."}, {"k": "gs", "s": "다. 학습 부진 학생, 특정 분야에서 탁월한 재능을 보이는 학생, 특수교육 대상 학생, 귀국 학생, 다문화 가정 학생 등이 학교에서 충실한 학습 경험을 누릴 수 있도록 필요한 지원을 한다."}, {"k": "gs", "s": "라. 특수교육 대상 학생을 위해 특수학급을 설치⋅운영하는 경우, 학생의 장애 특성 및 정도를 고려하여, 초⋅중등학교 교육과정을 조정하여 운영하거나 특수교육 교과용 도서 및 통합교육용 교수⋅학습 자료를 활용할 수 있다."}, {"k": "gs", "s": "마. 다문화 가정 학생을 위한 특별 학급을 설치⋅운영하는 경우, 다문화 가정 학생의 한국어 능력을 고려하여 초⋅중등학교 교육과정을 조정하여 운영하거나, 한국어 교육과정 및 교수⋅학습 자료를 활용할 수 있다. 한국어 교육과정은 학교의 특성, 학생⋅교사⋅학부모의 요구와 필요에 따라 주당 10시간 내외에서 운영할 수 있다."}, {"k": "gs", "s": "바. 학교가 종교 과목을 개설할 때는 종교 이외의 과목과 함께 복수로 과목을 편성하여 학생에게 선택의 기회를 주어야 한다. 다만, 학생의 학교 선택권이 허용되는 종립 학교의 경우 학생⋅학부모의 동의를 얻어 단수로 개설할 수 있다."}]}]}, {"id": "c3", "short": "Ⅲ 기본 사항", "name": "Ⅲ. 학교급별 교육과정 편성⋅운영의 기준 › 1. 기본 사항", "intro": ["이 장에서는 학교 교육과정을 편성하고 운영할 때 고려해야 할 주요 기준들을 학교급별로 제시한다.", "• ‘기본 사항’에서는 모든 학교급에 해당하는 학교 교육과정 편성⋅운영의 일반적인 기준을 제시한다.", "• 초⋅중⋅고 학교급별 기준에서는 ‘편제와 시간(학점) 배당 기준’과 ‘교육과정 편성⋅운영 기준’을 제시한다."], "secs": [{"h": "1. 기본 사항", "lines": [{"k": "gs", "s": "가. 특수교육 교육과정은 공통 교육과정 및 선택 중심 교육과정, 기본 교육과정으로 편성한다."}, {"k": "gs", "s": "나. 공통 교육과정은 초등학교 1학년부터 중학교 3학년까지, 학점 기반 선택 중심 교육과정은 고등학교 1학년부터 3학년까지 편성⋅운영한다."}, {"k": "gs", "s": "다. 기본 교육과정은 특수학교에 재학 중인 초등학교 1학년부터 고등학교 3학년까지의 학생을 대상으로 편성⋅운영한다."}, {"k": "gs", "s": "라. 특수학교는 특수교육 대상 학생의 교육적 요구와 학교의 실정을 고려하여 공통 교육과정 및 선택 중심 교육과정을 기본 교육과정과 병행하여 편성⋅운영할 수 있다."}, {"k": "gs", "s": "마. 학교는 학교 교육과정 편성⋅운영 계획을 바탕으로 학년(군)별 교육과정 및 교과(군)별 교육과정을 편성할 수 있다."}, {"k": "gs", "s": "바. 학년 간 상호 연계와 협력을 통해 학교 교육과정을 유연하게 편성⋅운영할 수 있도록 학년군을 설정한다. 다만 창의적 체험활동과 일상생활 활동은 학생의 교육적 요구에 따라 생활연령과 발달 수준을 고려하여 학년군을 통합하여 운영할 수 있다."}, {"k": "gs", "s": "사. 공통 교육과정의 교과는 교육 목적상의 근접성, 학문 탐구 대상 또는 방법상의 인접성, 생활양식에서의 연관성 등을 고려하여 교과(군)로 재분류한다."}, {"k": "gs", "s": "아. 고등학교 교과는 보통 교과, 전문 교과, 특수교육 전문 교과로 구분하며, 학생들의 기초소양 함양과 기본 학력을 보장하기 위하여 보통 교과에 공통 과목을 개설하여 모든 학생이 이수하도록 한다."}, {"k": "gs", "s": "자. 기본 교육과정의 교과는 특수교육 대상 학생의 자립과 사회 통합에 필요한 기초 학습, 생활 기능, 진로 및 직업 적응 등의 능력을 기르는 내용으로 구성한다."}, {"k": "gs", "s": "차. 학업 부담을 적정화하고 의미 있는 학습 활동이 이루어질 수 있도록 학기당 이수 교과목 수를 조정하여 집중이수를 실시할 수 있다."}, {"k": "gs", "s": "카. 학교는 학교급 간 전환기의 학생들이 상급 학교의 생활 및 학습을 준비하는 데 필요한 교육을 지원하기 위해 진로연계교육을 운영할 수 있다."}, {"k": "gs", "s": "타. 학교는 가정과 학교, 사회에서의 위험 상황을 알고 대처할 수 있도록 체험 중심의 안전교육을 관련 교과와 창의적 체험활동과 연계하여 운영한다."}, {"k": "gs", "s": "파. 기본 교육과정의 일상생활 활동 영역과 내용은 학생의 교육적 요구를 반영하여 학교가 정한다."}, {"k": "gs", "s": "하. 범교과 학습 주제는 교과와 창의적 체험활동 등 교육 활동 전반에 걸쳐 통합적으로 다루도록 하고, 지역사회 및 가정과 연계하여 지도한다."}, {"k": "box", "lines": ["안전⋅건강 교육, 인성 교육, 진로 교육, 민주시민 교육, 인권 교육, 다문화 교육, 통일 교육, 독도 교육, 경제⋅금융 교육, 환경⋅지속가능발전 교육"]}, {"k": "gs", "s": "거. 학교는 필요에 따라 계기 교육을 실시할 수 있으며, 이 경우 계기 교육 지침에 따른다."}, {"k": "gs", "s": "너. 학교는 필요에 따라 원격수업을 실시할 수 있으며, 이 경우 원격수업 운영 기준은 관련 법령과 지침에 따른다."}, {"k": "gs", "s": "더. 시⋅도 교육청과 학교는 필요에 따라 이 교육과정에 제시되어 있는 과목 외에 새로운 과목을 개설할 수 있다. 이 경우 시⋅도 교육감이 정하는 지침에 따라 사전에 필요한 절차를 거쳐야 한다."}, {"k": "gs", "s": "러. 기본 교육과정을 운영하는 특수학교는 장애 정도가 심한 학생의 교육적 요구를 반영하여 교과(군)별 50% 범위 내에서 시수를 감축하여 일상생활 활동으로 편성할 수 있다. 이 경우 시⋅도 교육감이 정하는 지침에 따라 사전에 필요한 절차를 거쳐야 한다."}, {"k": "gs", "s": "머. 시각장애 또는 청각장애 학생이 다른 장애가 함께 있는 경우 교육적 요구를 지원하는 별도의 교육 활동을 병행하거나 대체하여 편성⋅운영할 수 있다."}, {"k": "gs", "s": "버. 일반학급 및 특수학급에 배치된 특수교육 대상 학생의 교육과정은 다음과 같이 편성⋅운영한다."}, {"k": "i1", "s": "1) 편제와 시간 혹은 학점 배당은 해당 학년군의 교육과정을 따른다."}, {"k": "i1", "s": "2) 학생의 교육적 요구에 따라 초⋅중등학교 교육과정을 재구성하거나, 특수교육 교육과정에 따른 교과용 도서, 통합교육용 교수⋅학습 자료 등을 사용할 수 있다."}, {"k": "i1", "s": "3) 특수교육 교육과정의 교과(군) 내용과 연계하거나 대체하여 운영할 수 있다. 교과 내용을 대체할 경우 생활기능 및 진로와 직업교육, 현장 실습 등으로 운영할 수 있다."}, {"k": "i1", "s": "4) 특수교육 대상 학생의 교육과정 운영에 관한 사항은 학생의 교육적 요구를 반영하여 학교 교육과정 위원회에서 결정한다."}, {"k": "gs", "s": "서. 교과와 창의적 체험활동의 내용 배열은 반드시 따라야 할 학습 순서를 의미하는 것은 아니며, 학생의 관심과 요구, 학교의 실정과 교사의 필요, 계절 및 지역의 특성 등에 따라 각 교과목의 학년군별 목표 달성을 위해 지도 내용의 순서와 비중, 교과 내 또는 교과 간 연계 지도 방법 등을 조정하여 운영할 수 있다."}, {"k": "gs", "s": "어. 순회교육을 위한 교육과정 편성⋅운영 지침은 시⋅도 교육청에서 정하되, 순회교육 대상자의 배치 환경, 교육적 요구를 고려하여 교육과정을 편성⋅운영한다."}, {"k": "gs", "s": "저. 개별화교육계획은 학생의 교육적 요구에 따라 교과 또는 생활 지원이 필요한 영역을 중심으로 작성한다."}, {"k": "gs", "s": "처. 직업, 예술, 체육 계열 분야의 전문적인 교육을 목적으로 설립된 특수학교의 교육과정은 특성화 중학교, 일반 고등학교, 특수 목적 고등학교, 특성화 고등학교와 산업수요 맞춤형 고등학교에 준하여 정하되, 학생의 교육적 요구에 따라 기본 교육과정을 편성⋅운영할 수 있다. 이 경우 시⋅도 교육감이 정하는 지침에 따라 사전에 필요한 절차를 거쳐야 한다."}]}]}, {"id": "mid", "short": "Ⅲ 기본 · 중학교", "name": "Ⅲ. 3. 기본 교육과정 › 중학교", "intro": null, "secs": [{"h": "가. 편제와 시간 배당 기준", "lines": [{"k": "i1", "s": "1) 편제"}, {"k": "i2", "s": "가) 중학교 교육과정은 교과(군)와 창의적 체험활동, 일상생활 활동으로 편성한다."}, {"k": "i2", "s": "나) 교과(군)는 국어, 사회, 수학, 과학, 진로와 직업, 체육, 예술(음악/미술), 선택으로 한다."}, {"k": "i2", "s": "다) 선택 교과는 정보통신활용, 생활영어, 보건 등의 과목으로 한다."}, {"k": "i2", "s": "라) 창의적 체험활동은 자율⋅자치 활동, 동아리 활동, 진로 활동으로 한다."}, {"k": "i2", "s": "마) 일상생활 활동은 의사소통, 자립생활, 신체활동, 여가활동, 생활적응 등 생활 기술을 중심으로 편성⋅운영한다."}, {"k": "i1", "s": "2) 시간 배당 기준"}, {"k": "cap", "s": "<표 10>"}, {"k": "tbl", "rows": 13, "cols": 3, "cells": [{"r": 0, "c": 0, "rs": 1, "cs": 2, "s": "구 분"}, {"r": 0, "c": 2, "rs": 1, "cs": 1, "s": "1~3학년"}, {"r": 1, "c": 0, "rs": 8, "cs": 1, "s": "교과(군)"}, {"r": 1, "c": 1, "rs": 1, "cs": 1, "s": "국어"}, {"r": 1, "c": 2, "rs": 1, "cs": 1, "s": "374"}, {"r": 2, "c": 1, "rs": 1, "cs": 1, "s": "사회"}, {"r": 2, "c": 2, "rs": 1, "cs": 1, "s": "374"}, {"r": 3, "c": 1, "rs": 1, "cs": 1, "s": "수학"}, {"r": 3, "c": 2, "rs": 1, "cs": 1, "s": "306"}, {"r": 4, "c": 1, "rs": 1, "cs": 1, "s": "과학"}, {"r": 4, "c": 2, "rs": 1, "cs": 1, "s": "204"}, {"r": 5, "c": 1, "rs": 1, "cs": 1, "s": "진로와 직업"}, {"r": 5, "c": 2, "rs": 1, "cs": 1, "s": "476"}, {"r": 6, "c": 1, "rs": 1, "cs": 1, "s": "체육"}, {"r": 6, "c": 2, "rs": 1, "cs": 1, "s": "272"}, {"r": 7, "c": 1, "rs": 1, "cs": 1, "s": "예술(음악/미술)"}, {"r": 7, "c": 2, "rs": 1, "cs": 1, "s": "238"}, {"r": 8, "c": 1, "rs": 1, "cs": 1, "s": "선택"}, {"r": 8, "c": 2, "rs": 1, "cs": 1, "s": "170"}, {"r": 9, "c": 0, "rs": 1, "cs": 2, "s": "소계"}, {"r": 9, "c": 2, "rs": 1, "cs": 1, "s": "2,414"}, {"r": 10, "c": 0, "rs": 1, "cs": 2, "s": "창의적 체험활동"}, {"r": 10, "c": 2, "rs": 1, "cs": 1, "s": "408"}, {"r": 11, "c": 0, "rs": 1, "cs": 2, "s": "일상생활 활동"}, {"r": 11, "c": 2, "rs": 1, "cs": 1, "s": "544"}, {"r": 12, "c": 0, "rs": 1, "cs": 2, "s": "총 수업 시간 수"}, {"r": 12, "c": 2, "rs": 1, "cs": 1, "s": "3,366"}]}, {"k": "note", "s": "① 1시간 수업은 45분을 원칙으로 하되, 기후 및 계절, 학생의 발달 정도, 학습 내용의 성격, 학교 실정 등을 고려하여 탄력적으로 편성⋅운영할 수 있다."}, {"k": "note", "s": "② 교과(군)별, 창의적 체험활동, 일상생활 활동 시간 배당은 연간 34주를 기준으로 3년간의 기준 수업 시수를 나타낸 것이다."}, {"k": "note", "s": "③ 총 수업 시간 수는 3년간의 최소 수업 시수를 나타낸 것이다."}]}, {"h": "나. 교육과정 편성⋅운영 기준", "lines": [{"k": "i1", "s": "1) 학교는 학생이 3년간 이수해야 할 교과목을 학년별, 학기별로 편성하여 학생과 학부모에게 안내한다."}, {"k": "i1", "s": "2) 학교는 교과(군)의 이수 시기와 그에 따른 수업 시수를 자율적으로 편성⋅운영할 수 있다."}, {"k": "i1", "s": "3) 학교는 해당 학년군 교육과정을 적용하되, 필요한 경우 타 학년군의 교과 내용으로 대체하여 운영할 수 있다."}, {"k": "i1", "s": "4) 학교는 학교의 특성, 학생·교사·학부모의 요구 및 필요에 따라 자율적으로 교과(군)별, 창의적 체험활동, 일상생활 활동 간 50% 범위 내에서 시수를 증감하여 편성⋅운영할 수 있다. 단 체육, 예술(음악/미술) 교과는 기준 수업 시수를 감축하여 편성⋅운영할 수 없다."}, {"k": "i1", "s": "5) 학교는 학생의 학업 부담을 적정화하고 의미 있는 학습 활동이 이루어질 수 있도록 학기당 이수 교과목 수를 8개 이내로 편성한다. 단 체육, 예술(음악/미술) 교과는 이수 교과목 수 제한에서 제외하여 편성할 수 있다."}, {"k": "i1", "s": "6) 학교는 필요한 경우 새로운 선택 과목을 개설할 수 있다. 이 경우 시⋅도 교육감이 정하는 지침에 따라 사전에 필요한 절차를 거쳐야 한다."}, {"k": "i1", "s": "7) 학교는 창의적 체험활동의 영역을 학생들의 발달 수준, 학교의 여건 등을 고려하여 자율적으로 편성⋅운영한다."}, {"k": "i1", "s": "8) 학교는 필요한 경우 학생의 장애 특성 및 교육적 요구에 따른 교육 내용을 창의적 체험활동과 일상생활 활동으로 편성⋅운영할 수 있다."}, {"k": "i1", "s": "9) 학교는 학생들이 자신의 적성과 미래에 대해 탐색하고 학습의 즐거움을 경험할 수 있도록 자유학기를 편성⋅운영한다."}, {"k": "i2", "s": "가) 중학교 과정 중 한 학기는 자유학기로 운영하되, 해당 학기의 교과 및 창의적 체험활동을 자유학기 취지에 부합하도록 편성⋅운영한다."}, {"k": "i3", "s": "(1) 자유학기는 지역 및 학교 여건을 고려하여 자율적으로 학생 참여 중심의 주제선택 활동과 진로 탐색 활동을 운영한다."}, {"k": "i3", "s": "(2) 자유학기에는 협동 학습, 토의⋅토론 학습, 프로젝트 학습 등 학생 참여형 수업을 강화하고, 학생의 학습과 성장을 중시하는 다양한 평가 방법을 활용하되, 일제식 지필 평가는 지양한다."}, {"k": "i2", "s": "나) 학교는 상급 학교(학년)로 진학하기 전 학기나 학년의 일부 시간을 활용하여 학교급 간 연계 및 진로 교육을 강화하는 진로연계교육을 편성⋅운영할 수 있다."}, {"k": "i1", "s": "10) 학교는 학생들이 삶 속에서 스포츠 문화를 지속적으로 향유하여 건전한 심신 발달과 정서 함양이 이루어질 수 있도록 학교스포츠클럽 활동을 편성⋅운영한다."}, {"k": "i2", "s": "가) 학교스포츠클럽 활동은 창의적 체험활동의 동아리 활동으로 편성하고 학년별 연간 34시간 운영하며, 매 학기 편성하도록 한다."}, {"k": "i2", "s": "나) 학교스포츠클럽 활동의 종목과 내용은 학생들의 희망을 반영하여 학교가 결정하되, 다양한 종목을 개설하여 학생들의 선택권이 보장되도록 한다."}]}], "school": "중학교"}, {"id": "high", "short": "Ⅲ 기본 · 고등학교", "name": "Ⅲ. 3. 기본 교육과정 › 고등학교", "intro": null, "secs": [{"h": "가. 편제와 학점 배당 기준", "lines": [{"k": "i1", "s": "1) 편제"}, {"k": "i2", "s": "가) 고등학교 교육과정은 교과(군)와 창의적 체험활동, 일상생활 활동으로 편성한다."}, {"k": "i2", "s": "나) 교과(군)는 국어, 사회, 수학, 과학, 진로와 직업, 체육, 예술(음악/미술), 선택으로 한다."}, {"k": "i2", "s": "다) 선택 교과는 정보통신활용, 생활영어, 보건 등의 과목으로 한다."}, {"k": "i2", "s": "라) 창의적 체험활동은 자율⋅자치 활동, 동아리 활동, 진로 활동으로 한다."}, {"k": "i2", "s": "마) 일상생활 활동은 의사소통, 자립생활, 신체활동, 여가활동, 생활적응 등 생활 기술을 중심으로 편성⋅운영한다."}, {"k": "i1", "s": "2) 학점 배당 기준"}, {"k": "cap", "s": "<표 11>"}, {"k": "tbl", "rows": 13, "cols": 3, "cells": [{"r": 0, "c": 0, "rs": 1, "cs": 2, "s": "구 분"}, {"r": 0, "c": 2, "rs": 1, "cs": 1, "s": "1~3학년"}, {"r": 1, "c": 0, "rs": 8, "cs": 1, "s": "교과(군)"}, {"r": 1, "c": 1, "rs": 1, "cs": 1, "s": "국어"}, {"r": 1, "c": 2, "rs": 1, "cs": 1, "s": "20"}, {"r": 2, "c": 1, "rs": 1, "cs": 1, "s": "사회"}, {"r": 2, "c": 2, "rs": 1, "cs": 1, "s": "18"}, {"r": 3, "c": 1, "rs": 1, "cs": 1, "s": "수학"}, {"r": 3, "c": 2, "rs": 1, "cs": 1, "s": "14"}, {"r": 4, "c": 1, "rs": 1, "cs": 1, "s": "과학"}, {"r": 4, "c": 2, "rs": 1, "cs": 1, "s": "8"}, {"r": 5, "c": 1, "rs": 1, "cs": 1, "s": "진로와 직업"}, {"r": 5, "c": 2, "rs": 1, "cs": 1, "s": "36"}, {"r": 6, "c": 1, "rs": 1, "cs": 1, "s": "체육"}, {"r": 6, "c": 2, "rs": 1, "cs": 1, "s": "14"}, {"r": 7, "c": 1, "rs": 1, "cs": 1, "s": "예술(음악/미술)"}, {"r": 7, "c": 2, "rs": 1, "cs": 1, "s": "14"}, {"r": 8, "c": 1, "rs": 1, "cs": 1, "s": "선택"}, {"r": 8, "c": 2, "rs": 1, "cs": 1, "s": "10"}, {"r": 9, "c": 0, "rs": 1, "cs": 2, "s": "소계"}, {"r": 9, "c": 2, "rs": 1, "cs": 1, "s": "134"}, {"r": 10, "c": 0, "rs": 1, "cs": 2, "s": "창의적 체험활동"}, {"r": 10, "c": 2, "rs": 1, "cs": 1, "s": "26"}, {"r": 11, "c": 0, "rs": 1, "cs": 2, "s": "일상생활 활동"}, {"r": 11, "c": 2, "rs": 1, "cs": 1, "s": "32"}, {"r": 12, "c": 0, "rs": 1, "cs": 2, "s": "총 이수 학점"}, {"r": 12, "c": 2, "rs": 1, "cs": 1, "s": "192"}]}, {"k": "note", "s": "① 1학점은 50분을 기준으로 하여 16회를 이수하는 수업량이다."}, {"k": "note", "s": "② 1시간의 수업은 50분을 원칙으로 하되, 기후 및 계절, 학생의 발달 정도, 학습 내용의 성격, 학교 실정 등을 고려하여 탄력적으로 편성⋅운영할 수 있다."}, {"k": "note", "s": "③ 교과(군)별, 창의적 체험활동, 일상생활 활동 학점 배당은 연간 34주를 기준으로 3년간의 기준 이수 학점을 나타낸 것이다."}, {"k": "note", "s": "④ 총 이수 학점 수는 고등학교 졸업을 위해 3년간 이수해야 할 최소 이수 학점을 의미한다."}]}, {"h": "나. 교육과정 편성⋅운영 기준", "lines": [{"k": "i1", "s": "1) 고등학교 교육과정의 총 이수 학점은 192학점이며 교과(군) 134학점, 창의적 체험활동 26학점, 일상생활 활동 32학점으로 편성한다."}, {"k": "i1", "s": "2) 학교는 학생이 3년간 이수할 수 있는 과목을 학년별, 학기별로 편성하여 학생과 학부모에게 안내한다."}, {"k": "i1", "s": "3) 교과(군)의 이수 시기와 그에 따른 이수 학점은 학교가 자율적으로 편성⋅운영할 수 있다."}, {"k": "i1", "s": "4) 학교는 해당 학년군 교육과정을 적용하되, 필요한 경우 타 학년군의 교과 내용으로 대체하여 운영할 수 있다."}, {"k": "i1", "s": "5) 학교는 학교의 특성, 학생⋅교사⋅학부모의 요구 및 필요에 따라 자율적으로 교과(군)별, 창의적 체험활동, 일상생활 활동 간 50% 범위 내에서 시수를 증감하여 편성⋅운영할 수 있다. 단 체육, 예술(음악/미술) 교과는 기준 수업 시수를 감축하여 편성⋅운영할 수 없다."}, {"k": "i1", "s": "6) 학교는 학생들이 의미 있는 학습 활동이 이루어질 수 있도록 학기당 이수하는 학점을 적정하게 편성한다."}, {"k": "i1", "s": "7) 진로⋅직업 교육은 ‘진로와 직업’ 교과 외에도 선택 중심 교육과정의 전문 교과와 특수교육 전문 교과 중에서 학교의 여건에 맞는 것을 선택하여 편성할 수 있다."}, {"k": "i1", "s": "8) 학교는 필요한 경우 새로운 선택 과목을 개설할 수 있다. 이 경우 시⋅도 교육감이 정하는 지침에 따라 사전에 필요한 절차를 거쳐야 한다."}, {"k": "i1", "s": "9) 학교에서 개설하지 않은 선택 과목 이수를 희망하는 학생이 있을 경우 그 과목을 개설한 다른 특수학교 및 일반학교의 이수를 인정한다. 이와 관련된 구체적인 사항은 시･도 교육감이 정하는 지침에 따른다."}, {"k": "i1", "s": "10) 학교는 학생의 필요에 따라 지역사회 기관에서 이루어진 학교 밖 교육을 과목 또는 창의적 체험 활동으로 이수를 인정한다. 이와 관련된 구체적인 사항은 시⋅도 교육감이 정하는 지침에 따른다."}, {"k": "i1", "s": "11) 학교는 창의적 체험활동의 영역을 학생들의 발달 수준, 학교의 여건 등을 고려하여 자율적으로 편성⋅운영하고, 학생의 진로 및 적성과 연계하여 다양한 활동이 이루어질 수 있도록 한다."}, {"k": "i1", "s": "12) 학교는 필요한 경우 학생의 장애 특성 및 교육적 요구에 따른 교육 내용을 창의적 체험활동과 일상생활 활동으로 편성⋅운영할 수 있다."}, {"k": "i1", "s": "13) 학교는 교육과정을 특성화하기 위해 특정 교과를 중심으로 중점학교를 운영할 수 있다. 이 경우 창의적 체험활동, 일상생활 활동 학점의 50% 범위 내에서 감축하여 해당 교과(군)의 과목으로 편성하도록 권장하며, 이와 관련된 구체적인 사항은 시⋅도 교육감이 정하는 지침에 따라 사전에 필요한 절차를 거쳐야 한다."}, {"k": "i1", "s": "14) 학교는 ‘진로와 직업’ 교과의 교육과정 내용과 관련이 있는 현장 실습을 다양한 형태로 운영할 수 있으며, 이와 관련한 구체적인 사항은 시⋅도 교육감이 정하는 지침에 따른다."}, {"k": "i1", "s": "15) 학년을 달리하는 학생을 대상으로 복식 학급을 편성⋅운영하는 경우에는 교육 내용의 학년별 순서를 조정하거나 공통 주제를 중심으로 교육과정을 재구성하여 활용할 수 있다."}, {"k": "i1", "s": "16) 학교는 학교급 전환 시기에 학교급 간 연계 및 진로 교육을 강화하는 진로연계교육을 편성⋅운영할 수 있다."}]}], "school": "고등학교"}, {"id": "c4", "short": "Ⅳ 학교 교육과정 지원", "name": "Ⅳ. 학교 교육과정 지원", "intro": ["이 장에서는 학교 교육과정의 충실한 설계와 운영을 위해 국가와 시⋅도 교육청 수준에서 이루어져야 하는 행⋅재정적 지원 사항들을 유형별로 제시한다.", "• ‘교육과정의 질 관리’에서는 학교 교육과정의 질 관리와 개선을 위한 지원 사항을 제시한다.", "• ‘학습자 맞춤교육 강화’에서는 다양한 특성을 가진 학습자들의 학습을 지원하는 데 필요한 사항을 제시한다.", "• ‘학교의 교육 환경 조성’에서는 변화하는 교육 환경에 대응하여 학생들의 역량과 소양을 함양하는 데 필요한 지원 사항을 제시한다."], "secs": [{"h": "1. 교육과정의 질 관리", "lines": [{"k": "gh", "s": "가. 국가 수준의 지원"}, {"k": "i1", "s": "1) 이 교육과정의 질 관리를 위하여 주기적으로 학업 성취도 평가, 교육과정 편성⋅운영에 관한 평가, 학교와 교육 기관 평가를 실시하고 그 결과를 교육과정 개선에 활용한다."}, {"k": "i2", "s": "가) 교과별, 학년(군)별 학업 성취도 평가를 실시하고, 평가 결과는 학생의 학습 지원, 학력의 질 관리, 교육과정의 적절성 확보 및 개선 등에 활용한다."}, {"k": "i2", "s": "나) 학교의 교육과정 편성⋅운영과 교육청의 교육과정 지원 상황을 파악하기 위하여 학교와 교육청에 대한 평가를 주기적으로 실시한다."}, {"k": "i2", "s": "다) 교육과정에 대하여 조사, 분석 및 점검을 실시하고 그 결과를 교육과정 개선에 반영한다."}, {"k": "i1", "s": "2) 교육과정 편성⋅운영과 지원 체제의 적절성 및 실효성을 평가하기 위한 연구를 수행한다."}, {"k": "gh", "s": "나. 교육청 수준의 지원"}, {"k": "i1", "s": "1) 지역의 특수성, 교육의 실태, 학생⋅교원⋅주민의 요구와 필요 등을 반영하여 교육청 단위의 교육 중점을 설정하고, 학교 교육과정 개발을 위한 시⋅도 교육청 수준 교육과정 편성⋅운영 지침을 마련하여 안내한다."}, {"k": "i1", "s": "2) 시⋅도의 특성과 교육적 요구를 구현하기 위하여 시⋅도 교육청 교육과정 위원회를 조직하여 운영한다."}, {"k": "i2", "s": "가) 이 위원회는 교육과정 편성⋅운영에 관한 조사 연구와 자문 기능을 담당한다."}, {"k": "i2", "s": "나) 이 위원회에는 교원, 교육 행정가, 교육학 전문가, 교과 교육 전문가, 학부모, 지역사회 인사, 산업체 전문가 등이 참여할 수 있다."}, {"k": "i1", "s": "3) 학교 교육과정의 질 관리를 위해 각급 학교의 교육과정 편성⋅운영 실태를 정기적으로 파악하고, 교육과정 운영 지원 실태를 점검하여 효과적인 교육과정 운영과 개선에 필요한 지원을 한다."}, {"k": "i2", "s": "가) 학교 교육과정 편성⋅운영 체제의 적절성 및 실효성을 높이기 위하여 학업 성취도 평가, 학교 교육과정 평가 등을 실시하고 그 결과를 교육과정 개선에 활용한다."}, {"k": "i2", "s": "나) 교육청 수준의 학교 교육과정 지원에 대한 자체 평가와 교육과정 운영 지원 실태에 대한 점검을 실시하고 개선 방안을 마련한다."}, {"k": "i1", "s": "4) 특수학교는 학생의 통합교육을 위하여 지역사회 내 다양한 학교 및 기관과 교류하는 기회를 제공하도록 노력한다."}]}, {"h": "2. 학습자 맞춤교육 강화", "lines": [{"k": "gh", "s": "가. 국가 수준의 지원"}, {"k": "i1", "s": "1) 학교에서 학생의 성장과 성공적인 학습을 지원하는 평가가 원활히 이루어질 수 있도록 다양한 방안을 개발하여 학교에 제공한다."}, {"k": "i2", "s": "가) 학교가 교과 교육과정의 목표에 부합되는 평가를 실시할 수 있도록 교과별로 성취기준에 따른 평가기준을 개발⋅보급한다."}, {"k": "i2", "s": "나) 교과목별 평가 활동에 활용할 수 있는 다양한 평가 방법, 절차, 도구 등을 개발하여 학교에 제공한다."}, {"k": "i2", "s": "다) 특수교육 대상 학생의 교육적 요구를 고려한 평가조정에 관한 자료 등을 개발하여 학교에 제공한다."}, {"k": "i1", "s": "2) 특성화 고등학교와 산업수요 맞춤형 고등학교가 기준 학과별 국가직무능력표준이나 직무분석 결과에 기초하여 학교의 특성 및 학과별 인력 양성 유형을 고려하여 교육과정을 편성⋅운영할 수 있도록 지원한다."}, {"k": "i1", "s": "3) 학습 부진 학생, 느린 학습자, 다문화 가정 학생 등 다양한 특성을 가진 학생을 위해 필요한 지원 방안을 마련한다."}, {"k": "i1", "s": "4) 특수교육 대상 학생에 대한 정당한 편의 제공을 위해 필요한 교수⋅학습 자료, 교육 평가 방법 및 도구 등의 제반 사항을 지원한다."}, {"k": "gh", "s": "나. 교육청 수준의 지원"}, {"k": "i1", "s": "1) 지역 및 학교, 학생의 다양한 특성을 반영하여 학교 교육과정이 운영될 수 있도록 지원한다."}, {"k": "i2", "s": "가) 학교가 이 교육과정에 제시되어 있는 과목 외에 새로운 교과목을 개설⋅운영할 수 있도록 관련 지침을 마련한다."}, {"k": "i2", "s": "나) 통합운영학교 관련 규정 및 지침을 정비하고, 통합운영학교에 맞는 교육과정 운영이 이루어질 수 있도록 지원한다."}, {"k": "i2", "s": "다) 학교 밖 교육이 지역 및 학교의 여건, 학생의 희망을 고려하여 운영될 수 있도록 우수한 학교 밖 교육 자원을 발굴⋅공유하고, 질 관리에 힘쓴다."}, {"k": "i2", "s": "라) 개별 학교의 희망과 여건을 반영하여 필요한 경우 공동으로 교육과정을 운영할 수 있도록 지원한다."}, {"k": "i2", "s": "마) 지역사회와 학교의 여건에 따라 초등학교 저학년 학생을 학교에서 돌볼 수 있는 기능을 강화하고, 이에 대해 행⋅재정적 지원을 한다."}, {"k": "i2", "s": "바) 학교가 학생과 학부모의 요구에 따라 방과 후 또는 방학 중 활동을 운영할 수 있도록 행⋅재정적 지원을 한다."}, {"k": "i1", "s": "2) 학생의 진로 및 발달적 특성을 고려하여 자신의 진로를 스스로 설계해 갈 수 있도록 다양한 방안을 마련하여 지원한다."}, {"k": "i2", "s": "가) 학교급과 학생의 발달적 특성에 맞는 진로 활동 및 학교급 간 연계 교육을 강화하는 데 필요한 지원을 한다."}, {"k": "i2", "s": "나) 학교급 전환 시기 진로연계교육을 위한 자료를 개발⋅보급하고, 각 학교급 교육과정에 대한 교사의 이해 증진 및 학교급 간 협력 관계 구축을 위한 지원을 확대한다."}, {"k": "i2", "s": "다) 중학교 자유학기 운영을 지원하기 위해 각종 자료의 개발⋅보급, 교원의 연수, 지역사회와의 연계가 포함된 자유학기 지원 계획을 수립하여 추진한다."}, {"k": "i2", "s": "라) 고등학교 교육과정이 학점을 기반으로 내실 있게 운영될 수 있도록 각종 자료의 개발⋅보급, 교원의 연수, 학교 컨설팅, 최소 성취수준 보장, 지역사회와의 연계 등 지원 계획을 수립하여 추진한다."}, {"k": "i2", "s": "마) 인문학적 소양 및 통합적 읽기 능력 함양을 위해 독서 활동을 활성화하도록 다양한 지원을 한다."}, {"k": "i1", "s": "3) 학습자의 다양성을 존중하고 학습 소외 및 교육 격차를 방지할 수 있도록 맞춤형 교육을 지원한다."}, {"k": "i2", "s": "가) 지역 간, 학교 간 교육 격차를 완화할 수 있도록 농산어촌학교, 소규모학교에 대한 지원 체제를 마련한다."}, {"k": "i2", "s": "나) 모든 학생이 학습에서 소외되지 않도록 교육공동체가 함께 협력하여 학생 개개인의 필요와 요구에 맞는 맞춤형 교육 활동을 계획하고 실행할 수 있도록 지원한다."}, {"k": "i2", "s": "다) 전⋅입학, 귀국 등에 따라 공통 교육과정의 교과와 고등학교 공통 과목을 이수하지 못한 학생들이 해당 과목을 이수할 수 있도록 다양한 기회를 마련해 주고, 학생들이 공공성을 갖춘 지역사회 기관을 통해 이수한 과정을 인정해 주는 방안을 마련한다."}, {"k": "i2", "s": "라) 귀국자 및 다문화 가정 학생을 포함하는 다양한 배경의 학생들이 그들의 교육 경험의 특성과 배경에 의해 이 교육과정을 이수하는 데 어려움이 없도록 지원한다."}, {"k": "i2", "s": "마) 특정 분야에서 탁월한 재능을 보이는 학생, 학습 부진 학생, 특수교육 대상 학생들을 위한 교육 기회를 마련하고 지원한다."}, {"k": "i2", "s": "바) 통합교육 실행 및 개선을 위해 교사 간 협력 지원, 초⋅중학교 교육과정과 특수교육 교육과정을 연계할 수 있는 자료 개발 및 보급, 관련 연수나 컨설팅 등을 제공한다."}]}, {"h": "3. 학교의 교육 환경 조성", "lines": [{"k": "gh", "s": "가. 국가 수준의 지원"}, {"k": "i1", "s": "1) 교육과정 자율화⋅분권화를 바탕으로 교육 주체들이 각각의 역할과 책임을 충실하게 수행할 수 있는 협조 체제를 구축하고 지원한다."}, {"k": "i1", "s": "2) 시⋅도 교육청의 교육과정 지원 활동과 단위 학교의 교육과정 편성⋅운영 활동이 상호 유기적으로 이루어질 수 있도록 행⋅재정적 지원을 한다."}, {"k": "i1", "s": "3) 이 교육과정이 교육 현장에 정착될 수 있도록 교육청 수준의 교원 연수와 전국 단위의 교과 연구회 활동을 적극적으로 지원한다."}, {"k": "i1", "s": "4) 디지털 교육 환경 변화에 부합하는 미래형 교수⋅학습 방법과 평가체제 구축을 위해 교원의 에듀테크 활용 역량 함양을 지원한다."}, {"k": "i1", "s": "5) 학교 교육과정이 원활히 운영될 수 있도록 학교 시설 및 교원 수급 계획을 마련하여 제시한다."}, {"k": "gh", "s": "나. 교육청 수준의 지원"}, {"k": "i1", "s": "1) 학교가 이 교육과정에 근거하여 학교 교육과정을 편성⋅운영할 수 있도록 다음의 사항을 지원한다."}, {"k": "i2", "s": "가) 학교 교육과정 편성⋅운영을 위해서 교육 시설, 설비, 자료 등을 정비하고 확충하는 데 필요한 행⋅재정적 지원을 한다."}, {"k": "i2", "s": "나) 복식 학급 운영 등 소규모 학교의 정상적인 교육과정 운영을 지원하기 위해 교원의 배치, 학생의 교육받을 기회 확충 등에 필요한 행⋅재정적 지원을 한다."}, {"k": "i2", "s": "다) 수준별 수업을 효율적으로 운영하도록 지원하며, 기초학력 향상과 학습 결손 보충이 가능하도록 보충 수업을 운영하는 데 필요한 행⋅재정적 지원을 한다."}, {"k": "i2", "s": "라) 학교 교육활동 전반에 걸쳐 종합적인 안전교육 계획을 수립하고 사고 예방을 위한 행⋅재정적 지원을 한다."}, {"k": "i2", "s": "마) 고등학교에서 학생의 과목 선택권을 보장할 수 있도록 교원 수급, 시설 확보, 유연한 학습 공간 조성, 프로그램 개발 등 필요한 행⋅재정적 지원을 한다."}, {"k": "i2", "s": "바) 특성화 고등학교와 산업수요 맞춤형 고등학교가 산업체와 협력하여 특성화된 교육과정과 실습 과목을 편성⋅운영하는 경우, 학생의 현장 실습과 전문교과 실습이 안전하고 내실 있게 운영될 수 있도록 행⋅재정적 지원을 한다."}, {"k": "i1", "s": "2) 학교가 새 학년도 시작에 앞서 교육과정 편성⋅운영에 관한 계획을 수립할 수 있도록 교육과정 편성⋅운영 자료를 개발⋅보급하고, 교원의 전보를 적기에 시행한다."}, {"k": "i1", "s": "3) 교과와 창의적 체험활동 등에 필요한 교과용 도서의 개발, 인정, 보급을 위해 노력한다."}, {"k": "i1", "s": "4) 학교가 지역사회의 관계 기관과 적극적으로 연계⋅협력해서 교과, 창의적 체험활동, 학교스포츠클럽활동, 자유학기 등을 내실 있게 운영할 수 있도록 지원하며, 관내 학교가 활용할 수 있는 우수한 지역 자원을 발굴하여 안내한다."}, {"k": "i1", "s": "5) 학교 교육과정의 효과적 운영을 위하여 학생의 배정, 교원의 수급 및 순회, 학교 간 시설과 설비의 공동 활용, 자료의 공동 개발과 활용에 관하여 학교 간 및 시⋅도 교육(지원)청 간의 협조 체제를 구축한다."}, {"k": "i1", "s": "6) 단위 학교의 교육과정 편성⋅운영 및 교수⋅학습, 평가를 지원할 수 있도록 교원 연수, 교육과정 컨설팅, 연구학교 운영 및 연구회 활동 지원 등에 대한 계획을 수립하여 시행한다."}, {"k": "i2", "s": "가) 교원의 학교 교육과정 편성⋅운영 능력과 교과 및 창의적 체험활동에 대한 교수⋅학습, 평가 역량을 제고하기 위하여 교원에 대한 연수 계획을 수립하여 시행한다."}, {"k": "i2", "s": "나) 학교 교육과정의 효율적인 편성⋅운영을 지원하기 위해 교육과정 컨설팅 지원단 등 지원 기구를 운영하며 교육과정 편성⋅운영을 위한 각종 자료를 개발하여 보급한다."}, {"k": "i2", "s": "다) 학교 교육과정 편성⋅운영의 개선과 수업 개선을 위해 연구학교를 운영하고 연구 교사제 및 교과별 연구회 활동 등을 적극적으로 지원한다."}, {"k": "i1", "s": "7) 온⋅오프라인 연계를 통한 효과적인 교수⋅학습과 평가가 이루어질 수 있도록 하며, 지능정보기술을 활용한 맞춤형 수업과 평가가 가능하도록 지원한다."}, {"k": "i2", "s": "가) 원격수업을 효과적으로 지원하기 위해 학교의 원격수업 기반 구축, 교원의 원격수업 역량 강화 등에 필요한 행⋅재정적 지원을 한다."}, {"k": "i2", "s": "나) 수업 설계⋅운영과 평가에서 다양한 디지털 플랫폼과 기술 및 도구를 효율적으로 활용할 수 있도록 시설⋅설비와 기자재 확충을 지원한다."}]}]}]};
const CUCH=CUR.chapters, cuCh=id=>CUCH.find(c=>c.id===id);

const cuNorm=s=>String(s).replace(/[\s,]/g,"").replace(/[·・.⋅ㆍ‧･]/g,"ㆍ");
const CU_LCLS={gh:"ch",gs:"cgs",p:"cp",i1:"ci1",i2:"ci2",i3:"ci3",note:"cnote",cap:"ccap",dot:"cdot",sub:"ch"};
const CU_NUM=/\d[\d,]*\s?(?:%|개|학점|시간|분|회|주|년간)/g;
function cuMarkNums(s){return esc(s).replace(CU_NUM,m=>`<b class="kn">${m}</b>`);}
function cuRowLabel(t,c){const h=t.cells.filter(x=>x.r===c.r&&x.c<c.c).map(x=>x.s).filter(s=>s!=="교과(군)");return h.join(" ")||"칸";}
function cuTable(t,quiz){
  const grid=[];for(let r=0;r<t.rows;r++)grid.push([]);
  t.cells.forEach(c=>{grid[c.r].push(c);});
  return `<div class="tblwrap"><table class="ltbl ctbl"><tbody>${grid.map((row,ri)=>`<tr>${row.sort((a,b)=>a.c-b.c).map(c=>{
    const isNum=/^[\d,]+$/.test(c.s),tag=ri===0||!isNum?"th":"td";
    const span=`${c.rs>1?` rowspan="${c.rs}"`:""}${c.cs>1?` colspan="${c.cs}"`:""}`;
    const cls=c.s==="교과(군)"?' class="vert"':(isNum?' class="num"':"");
    let inner=esc(c.s);
    if(quiz&&quiz.has(c.r+"-"+c.c)){
      const key=c.r+"-"+c.c,v=S.cu.tvals[key]||"",ok=cuNorm(v)===cuNorm(c.s);
      inner=S.cu.treveal?`<span class="bl show">${esc(c.s)}</span>`:S.cu.tgraded?(ok?`<span class="bl okv">${esc(c.s)}</span>`:`<span class="bl wrongv">${v.trim()?`<s>${esc(v)}</s> `:""}${esc(c.s)}</span>`)
        :`<input class="cb tq" inputmode="numeric" data-tq="${key}" value="${esc(v)}" aria-label="${esc(cuRowLabel(t,c))} 빈칸" autocomplete="off">`;
    }
    return `<${tag}${span}${cls}>${inner}</${tag}>`;}).join("")}</tr>`).join("")}</tbody></table></div>`;
}
const cuBox=lines=>`<div class="cbox">${lines.map(s=>`<p>${esc(s)}</p>`).join("")}</div>`;
function cuLines(lines){
  return lines.map(l=>l.k==="tbl"?cuTable(l):l.k==="box"?cuBox(l.lines):`<p class="${CU_LCLS[l.k]||""}">${l.k==="gh"||l.k==="sub"?esc(l.s):cuMarkNums(l.s)}</p>`).join("");
}
function cuChSelect(id,key){return `<label for="${id}" class="vh">단원 선택</label><select id="${id}" class="cuch" data-cuch="${key}">${CUCH.map(c=>`<option value="${c.id}" ${S.cu[key]===c.id?"selected":""}>${esc(c.short)}</option>`).join("")}</select>`;}

/* 교육과정 소리로 듣기 */
function cuSpeak(s){
  return s.replace(/[‘’“”「」]/g,"").replace(/[⋅‧·]/g," ").replace(/^<표 (\d+)>$/,"표 $1.").replace(/^[•⦁]\s*/,"")
    .replace(/^([①-⑳])\s*/,(m,c)=>(c.charCodeAt(0)-0x245F)+", ")
    .replace(/^\((\d+)\)\s*/,"$1, ").replace(/^(\d+)\)\s*/,"$1, ").replace(/^([가-하])\)\s*/,"$1, ")
    .replace(/(\d),(\d{3})/g,"$1$2").replace(/~/g," ~ ").trim();
}
function cuTableUtt(t){
  const out=[];for(let r=1;r<t.rows;r++){const cs=t.cells.filter(c=>c.r===r).sort((a,b)=>a.c-b.c).map(c=>c.s).filter(x=>x!=="교과(군)");if(cs.length)out.push(cuSpeak(cs.join(" ")));}
  return out;
}
function cuTtsItems(id){
  const C=cuCh(id),items=[];
  if(C.intro)items.push({no:"intro",title:"단원 안내",el:"cuart-intro",utt:["단원 안내.",...C.intro.map(cuSpeak)]});
  C.secs.forEach((sec,k)=>{const utt=[];if(sec.h)utt.push(cuSpeak(sec.h)+".");
    sec.lines.forEach(l=>{if(l.k==="tbl")utt.push(...cuTableUtt(l));else if(l.k==="box")utt.push(...l.lines.map(cuSpeak));else if(l.s)utt.push(cuSpeak(l.s));});
    items.push({no:"s"+k,title:sec.h||C.short,el:"cuart-"+k,utt});});
  return items;
}
function cuTtsStart(id,no){
  if(!TTS_OK)return;ttsCancel();
  const items=cuTtsItems(id);Object.assign(TT,{subj:"curr",label:"교육과정",on:true,paused:false,doc:id,queue:items,ai:Math.max(0,items.findIndex(a=>a.no===no)),li:0});
  ttsSpeak();renderTtsBar();
}
function cuTypeLines(sec){const out=[];sec.lines.forEach(l=>{if(l.k==="tbl"||l.k==="cap")return;if(l.k==="box")out.push(...l.lines);else out.push(l.s);});return out;}

  if(S.cu.mode==="type"){

/* ===== 따라 쓰기 (타자 연습) ===== */
const TY={key:null,lines:[],labels:[],li:0,start:null,stats:[],done:false};
const tyNormCh=c=>/[ㆍ·⋅‧･.]/.test(c)?"·":c;   // 가운뎃점 종류는 같은 글자로 봄
function tyClean(line){
  return String(line).replace(/<[^>]*>/g,"").replace(/\[[^\]]*\]/g,"").replace(/\([一-鿿豈-﫿]+\)/g,"")
    .replace(/[「」“”‘’『』]/g,"").replace(/\s+/g," ").trim();
}
function tySplitLabel(s){const m=s.match(/^([①-⑳]|\d+의\d+\.|\d+\.|\d+\)|[가-하]\.|[가-하]\)|\(\d+\)|[•⦁∙－-])\s*/);return m?[m[1],s.slice(m[0].length)]:["",s];}
function tyJamo(ch){const c=ch.charCodeAt(0);if(c<0xAC00||c>0xD7A3)return 1;const i=c-0xAC00,jung=Math.floor(i/28)%21,jong=i%28;
  const dv=[9,10,11,14,15,16,19].includes(jung)?2:1,dj=[3,5,6,9,10,11,12,13,14,15,18].includes(jong)?2:(jong?1:0);return 1+dv+dj;}
function tySet(key,rawLines){
  if(TY.key===key)return;
  const L=[],lab=[];rawLines.forEach(r=>{const t=tyClean(r);if(!t)return;const [a,b]=tySplitLabel(t);if(b.trim()){L.push(b.trim());lab.push(a);}});
  Object.assign(TY,{key,lines:L,labels:lab,li:0,start:null,stats:[],done:false});
}
const tyCore=c=>/[가-힣ㄱ-ㅎㅏ-ㅣA-Za-z0-9]/.test(c);   // 글자·숫자만 채점, 특수문자와 띄어쓰기는 채점하지 않음
function tyCmp(target,val){ // 글자별 상태: ok / no / cur(조합 중일 수 있는 마지막 글자) / todo, 그리고 다음에 쓸 위치
  const v=[...val].filter(tyCore),T=[...target],out=[];let k=0,caret=-1;
  T.forEach((c,i)=>{
    if(!tyCore(c)){out.push((k>0&&k<=v.length)||(k===0&&v.length>0)?"ok":"todo");return;}
    if(k<v.length){const ok=v[k].toLowerCase()===c.toLowerCase();out.push(ok?"ok":(k===v.length-1?"cur":"no"));}
    else{out.push("todo");if(caret<0)caret=i;}
    k++;
  });
  return {st:out,caret,done:k<=v.length&&out.every(x=>x==="ok"),need:k,have:v.length,right:out.filter((x,i)=>tyCore(T[i])&&x==="ok").length};
}
function tyLineHTML(target,val){const r=tyCmp(target,val);return [...target].map((c,i)=>`<span class="t-${r.st[i]}${i===r.caret?" caret":""}">${c===" "?"&nbsp;":esc(c)}</span>`).join("")+(r.caret<0?`<span class="caret end">&nbsp;</span>`:"");}
function tySummary(){
  const typed=TY.stats.reduce((n,s)=>n+s.len,0),right=TY.stats.reduce((n,s)=>n+s.ok,0),jamo=TY.stats.reduce((n,s)=>n+s.jamo,0),ms=TY.stats.reduce((n,s)=>n+s.ms,0);
  return {acc:typed?Math.round(right/typed*100):0,speed:ms?Math.round(jamo/(ms/60000)):0};
}
function typingHTML(title){
  if(!TY.lines.length)return `<p class="src">따라 쓸 문장이 없어요.</p>`;
  if(TY.done){const s=tySummary();return `<article class="lart tydone"><header><b>${esc(title)}</b><span class="src">끝까지 썼어요</span></header>
    <div class="tystats"><div><b>${s.speed}</b><small>타/분</small></div><div><b>${s.acc}%</b><small>정확도</small></div><div><b>${TY.lines.length}</b><small>줄</small></div></div>
    <button class="btn ghost" id="tyAgain">처음부터 다시 쓰기</button></article>`;}
  const t=TY.lines[TY.li],s=tySummary();
  return `<article class="lart tycard"><header><b>${esc(title)}</b><span class="src">줄 ${TY.li+1} / ${TY.lines.length}</span></header>
    <div class="tytarget" id="tyTarget">${TY.labels[TY.li]?`<span class="tylab">${esc(TY.labels[TY.li])}</span>`:""}${tyLineHTML(t,"")}</div>
    <label for="tyIn" class="vh">위 문장을 따라 쓰기</label>
    <textarea id="tyIn" class="tyin" rows="2" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="여기에 위 문장을 그대로 써 보세요"></textarea>
    <div class="tymeta"><span id="tyLive">${TY.stats.length?`지금까지 ${s.speed}타/분 · 정확도 ${s.acc}%`:"입력을 시작하면 시간을 재요"}</span><button class="btn ghost tyskip" id="tySkip">건너뛰기</button></div>
  </article>
  <p class="src">줄 끝까지 맞게 쓰면 다음 줄로 넘어가요. 틀린 글자는 빨갛게 보여요. 한글·영어·숫자만 채점하고, 문장부호 같은 특수문자와 띄어쓰기는 빼먹거나 다르게 써도 틀린 것으로 치지 않아요. ①, 1., 가. 같은 번호와 개정 표시는 쓰지 않아도 돼요.</p>`;
}
function wireTyping(onRerender){
  const inp=document.getElementById("tyIn"),tgt=document.getElementById("tyTarget");
  const again=document.getElementById("tyAgain");if(again)again.onclick=()=>{Object.assign(TY,{li:0,start:null,stats:[],done:false});onRerender();};
  const skip=document.getElementById("tySkip");if(skip)skip.onclick=()=>{TY.start=null;if(TY.li<TY.lines.length-1)TY.li++;else TY.done=true;onRerender(true);};
  if(!inp)return;
  const lab=TY.labels[TY.li]?`<span class="tylab">${esc(TY.labels[TY.li])}</span>`:"";
  const finishLine=()=>{const t=TY.lines[TY.li],v=inp.value.replace(/\n/g,"");const r=tyCmp(t,v);
    TY.stats.push({len:r.need,ok:r.right,jamo:[...t].filter(tyCore).reduce((n,c)=>n+tyJamo(c),0),ms:Date.now()-(TY.start||Date.now())});
    TY.start=null;if(TY.li<TY.lines.length-1)TY.li++;else TY.done=true;onRerender(true);};
  inp.addEventListener("input",()=>{
    const t=TY.lines[TY.li];let v=inp.value;
    if(v.includes("\n")){inp.value=v=v.replace(/\n/g,"");const r0=tyCmp(t,v);if(r0.have>=r0.need-1){finishLine();return;}}
    if(!TY.start&&v)TY.start=Date.now();
    tgt.innerHTML=lab+tyLineHTML(t,v);
    if(tyCmp(t,v).done)setTimeout(()=>{if(inp.value.replace(/\n/g,"")===v)finishLine();},250);
  });
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();const r=tyCmp(TY.lines[TY.li],inp.value);if(r.have>=r.need-1)finishLine();}});
}

function dex(){

  <div class="bar"><span>자음 ${CONS.length} · 모음 ${VOWS.length} · 지숫자 ${NUMS.length} · 알파벳 ${LETTERS.length}</span>

  <section class="sect"><h3>지숫자</h3><div class="grid">${NUMS.map(n=>{const k="n"+n;return `<button class="tile ${S.hide?"hide":""} ${S.shown[k]?"show":""}" data-j="${k}" aria-label="${S.hide&&!S.shown[k]?"가려진 숫자 보기":fmtN(n)}">${imgN(n)}<b>${fmtN(n)}</b></button>`;}).join("")}</div></section>

}

const KEYQ = {"areas":[{"area":"의사소통장애","qs":[{"q":"후두에서 성대가 진동하여 말소리의 음원(소리의 바탕)을 만들어 내는 과정은?","o":["호흡","발성","공명","조음"],"a":1,"e":"말 산출은 호흡(에너지) → 발성(성대 진동) → 공명(소리 울림) → 조음(입 안에서 말소리 만들기)으로 이어져요."},{"q":"언어의 구성요소 중 '문장 안에서 단어를 배열하는 규칙'을 다루는 것은?","o":["음운론","형태론","구문론","화용론"],"a":2,"e":"구문론은 단어 배열과 문장 구조, 형태론은 단어를 만드는 규칙, 화용론은 상황에 맞게 쓰는 규칙이에요."},{"q":"의미를 지닌 가장 작은 언어 단위는?","o":["음소","음절","형태소","낱말"],"a":2,"e":"음소는 뜻을 구별하는 소리 단위일 뿐 그 자체로 의미가 없어요. 의미를 가진 최소 단위가 형태소예요."},{"q":"대화 상대와 상황에 맞게 언어를 사용하는 능력(차례 지키기, 주제 유지 등)과 관련된 언어 영역은?","o":["의미론","구문론","화용론","음운론"],"a":2,"e":"화용론은 실제 맥락에서 언어를 사용하는 규칙이에요. 의사소통 기능, 대화 기술, 전제 능력 등이 포함돼요."},{"q":"입 안에서 공기 흐름을 완전히 막았다가 한꺼번에 터뜨리며 내는 소리(예: ㅂ, ㄷ, ㄱ)는?","o":["마찰음","파찰음","파열음","유음"],"a":2,"e":"파열음은 '막음 → 터뜨림'. 마찰음은 좁은 틈으로 마찰(ㅅ, ㅆ), 파찰음은 막았다가 마찰로 풀어요(ㅈ, ㅊ)."},{"q":"연구개가 내려가 공기가 코로 빠져나가면서 나는 말소리는?","o":["비음","유음","마찰음","파열음"],"a":0,"e":"국어의 비음은 ㅁ, ㄴ, ㅇ(받침)이에요."},{"q":"말소리를 만드는 운동 능력보다, 언어 안에서 음소를 구분하고 조직하는 규칙(체계)에 어려움이 있는 경우는?","o":["조음장애","음운장애","운동말장애","유창성장애"],"a":1,"e":"조음장애는 소리를 만드는 '말 운동' 쪽, 음운장애는 소리 체계에 대한 '언어 지식' 쪽 문제로 구분해요."},{"q":"아동이 '사과'를 [타과]처럼, 목표 음소 자리에 다른 음소를 넣어 발음하는 조음 오류 유형은?","o":["생략","첨가","대치","왜곡"],"a":2,"e":"목표음이 다른 음소로 바뀌면 대치예요. 왜곡은 목표음과 비슷하지만 표준 음소로 분류하기 어려운 소리예요."},{"q":"오류를 보이는 음소에 대해 시각·청각·촉각 단서를 주었을 때, 목표음과 비슷하게 따라 할 수 있는 능력은?","o":["말 명료도","자극반응도","말 용인도","오류 자질"],"a":1,"e":"자극반응도가 높은 음소는 치료 효과가 빨리 나타날 가능성이 높아 치료 목표를 정할 때 참고해요."},{"q":"듣는 사람이 화자의 말을 얼마나 알아들을 수 있는지를 나타내는 지표는?","o":["말 명료도","말 용인도","자극반응도","평균발화길이"],"a":0,"e":"명료도는 '알아듣는 정도', 용인도는 말이 얼마나 자연스럽고 듣기 편한지에 대한 청자의 주관적 판단이에요."},{"q":"목표음을 정확히 발음하는 '핵심 단어'와 목표음이 들어간 '훈련 단어'를 짝지어 연습해, 정확한 발음을 넓혀 가는 조음 치료 기법은?","o":["조음점 지시법","짝자극 기법","최소대립쌍 접근","주기법"],"a":1,"e":"짝자극 기법은 이미 바르게 내는 핵심 단어의 정확성을 훈련 단어로 전이시키는 방법이에요."},{"q":"'공-콩', '달-딸'처럼 음소 하나만 다른 낱말 쌍으로 소리 차이가 뜻 차이를 만든다는 것을 깨닫게 하는 음운 치료 접근은?","o":["짝자극 기법","최소대립쌍 접근","전통적 치료기법","조음점 지시법"],"a":1,"e":"최소대립쌍 접근은 음운장애 아동이 음소 대조를 인식하도록 돕는 대표적인 언어학적 접근이에요."},{"q":"말더듬의 핵심행동 중, 소리가 나오지 않은 채 조음 자세가 굳어 말이 멈추 이","말 명료도"],"a":0,"e":"MLU는 발화 하나에 평균 몇 개의 형태소(낱말)가 들어 있는지 보여 줘요. 문법 발달 정도를 보는 대표 지표예요."}]},{"area":"정서⋅행동장애","qs":[{"q":"교사가 먼저 학생을 순위 매기고, 평정척도로 거른 뒤, 관찰로 최종 확인하는 다단계 선별 절차는?","o":["SSBD(체계적 행동장애 선별)","CBCL","K-WISC","BASC"],"a":0,"e":"SSBD는 '교사 순위화 → 평정척도 → 직접 관찰'의 3단계로 내재화·외현화 문제 학생을 체계적으로 걸러 내요."},{"q":"부모가 자녀의 문제행동을 평정하고, 내재화·외현화 문제와 증후군 척도 점수를 제공하는 ASEBA의 대표 검사는?","o":["CBCL","SSBD","K-ABC","PEP"],"a":0,"e":"CBCL(아동·청소년 행동평가척도)은 부모용이며, 같은 체계에 교사용(TRF)·자기보고용(YSR)이 있어요."},{"q":"우울·불안·위축처럼 문제가 개인의 내면으로 향하는 행동 유형을 차원적 분류에서 무엇이라 하나요?","o":["외현화","내재화","공존장애","품행장애"],"a":1,"e":"교육적(차원적) 분류는 행동을 내재화(과잉통제)와 외현화(통제 결여) 차원으로 나눠요."},{"q":"한 개인에게 두 가지 이상의 장애가 동시에 나타나는 것을 무엇이라 하나요?","o":["공존장애(동반장애)","이중진단 오류","전환장애","감별진단"],"a":0,"e":"예: ADHD와 학습장애, 품행장애와 우울장애가 함께 나타나는 경우예요."},{"q":"Thomas와 Chess의 기질 유형 중, 새로운 상황에 처음엔 느리게 반응하지만 시간이 지나면 적응하는 유형은?","o":["순한 기질","까다로운 기질","더딘 기질","혼합 기질"],"a":2,"e":"순한(easy), 까다로운(difficult), 더딘(slow-to-warm-up) 기질로 나눠요."},{"q":"부모와 떨어질 때 크게 울지만 다시 만나면 접촉을 원하면서도 화를 내며 밀어내는 애착 유형은?","o":["안정 애착","회피 애착","저항(양가) 애착","혼란 애착"],"a":2,"e":"저항(양가) 애착은 재회 때 접근과 저항이 함께 나타나요."},{"q":"문제행동의 원인을 무의식적 갈등과 초기 경험에서 찾는 개념적 모델은?","o":["행동주의 모델","정신역동 모델","생태학적 모델","생물학적 모델"],"a":1,"e":"정신역동 모델은 무의식, 방어기제, 초기 발달 경험을 중시해요."},{"q":"Ellis의 합리적 정서행동치료(REBT)에서 문제의 정서·행동을 직접 일으킨다고 보는 것은?","o":["선행사건(A)","비합리적 신념(B)","결과(C)","논박(D)"],"a":1,"e":"사건(A) 자체가 아니라 그 사건에 대한 비합리적 신념(B)이 정서·행동 결과(C)를 만든다고 보고, 이를 논박(D)해요."},{"q":"학생의 행동을 개인 특성만이 아니라 가족·학교·지역사회 등 여러 체계와의 상호작용으로 이해하는 모델은?","o":["생태학적 모델","인지주의 모델","정신역동 모델","생물학적 모델"],"a":0,"e":"Bronfenbrenner의 미시·중간·외·거시·시간체계로 환경을 설명해요."},{"q":"성공과 실패의 원인을 '능력, 노력, 과제 난이도, 운' 등으로 설명하는 인지적 개념은?","o":["귀인","자기효능감","학습된 무기력","인지삼제"],"a":0,"e":"실패를 통제 불가능한 원인(능력 부족 등)으로 귀인하면 무기력으로 이어질 수 있어 '노력' 귀인으로 바꾸는 귀인 재훈련을 해요."},{"q":"말할 수 있는 능력이 있는데도 학교처럼 특정 사회적 상황에서는 일관되게 말하지 않는 불안장애는?","o":["사회불안장애","선택적 함구증","분리불안장애","범불안장애"],"a":1,"e":"선택적 함구증은 가정 등에서는 말하지만 특정 상황에서 말하지 않는 것이 1개월 이상 지속되는 경우예요."},{"q":"불안을 일으키는 상황을 약한 것부터 위계로 만들고, 이완 상태에서 /* 모드: heart = 하트 3개, 10문제 / free = 하트 없이 스테이지의 모든 문제를 한 번씩 */
const keyOf=x=>typeof x==="string"?x:x.w;
function buildQueue(st,n){
  const items=st.words||st.pool;
  const seen=new Set(saved.seen[st.id]||[]);
  const unseen=shuffle(items.filter(x=>!seen.has(keyOf(x)))), rest=shuffle(items.filter(x=>seen.has(keyOf(x))));
  const all=unseen.concat(rest);
  return n?all.slice(0,n):all;
}
function markSeen(st,x){
  const items=st.words||st.pool;
  const list=saved.seen[st.id]||[];const k=keyOf(x);
  if(!list.includes(k))list.push(k);
  saved.seen[st.id]=list.length>=items.length?[]:list;   // 다 보면 처음부터 다시
  save();
}
function startGame(id,mode="heart"){
  const st=STAGES.find(s=>s.id===id);
  const qs=buildQueue(st,mode==="heart"?ROUND:0);
  S.game={st,mode,qs,i:0,lives:LIVES,right:0,wrong:0,combo:0,best:0,answered:null,sel:null,input:"",opts:null,done:false,anim:""};
  makeOpts();S.view="play";render();scrollTo(0,0);
}
function makeOpts(){
  const g=S.game;if(g.st.type==="word"||g.st.type==="dots"){g.opts=null;return;}
  const a=g.qs[g.i];
  if(g.st.kind==="br"){if(g.st.type==="write"){g.opts=null;return;}const ck=x=>BR[x].c.join("|");const used=new Set([ck(a)]),labs=new Set([label(g.st,a)]);const ds=[];for(const x of shuffle(g.st.pool)){if(ds.length>=3)break;if(used.has(ck(x))||labs.has(label(g.st,x)))continue;used.add(ck(x));labs.add(label(g.st,x));ds.push(x);}g.opts=shuffle([a,...ds]);return;}
  if(g.st.kind==="num"&&g.st.type==="reverse"){const BIG=["100","1000","10000"];const same=g.st.pool.filter(x=>x!==a&&BIG.includes(x)===BIG.includes(a));const other=g.st.pool.filter(x=>x!==a&&BIG.includes(x)!==BIG.includes(a));g.opts=shuffle([a,...shuffle(same).slice(0,3),...shuffle(other)].slice(0,4));return;}
  const pool=g.st.kind==="num"||g.st.kind==="en"?g.st.pool:g.st.type==="reverse"?(CONS.includes(a)?CONS:VOWS):g.st.pool;
  g.opts=shuffle([a,...shuffle(pool.filter(x=>x!==a)).slice(0,3)]);
}
function check(){
  const g=S.game,a=g.qs[g.i];
  let ok;
  if(g.st.type==="dots"){const v=(app.querySelector("#win")||{}).value||"";if(!v.trim())return;g.input=v.trim();ok=parseDots(g.input).join("-")===a.s[0].join("-");}
  else if(g.st.type==="word"){const v=(app.querySelector("#win")||{}).value||"";if(!v.trim())return;g.input=v.trim();ok=norm(g.input)===norm(a.w);}
  else if(g.st.type==="write"){if(!g.sel)return;ok=g.sel===BR[a].c[0];}
  else{if(!g.sel)return;ok=g.st.kind==="br"?BR[g.sel].c.join("|")===BR[a].c.join("|"):g.sel===a;}
  g.answered={ok};markSeen(g.st,a);
  if(ok){g.right++;g.combo++;g.best=Math.max(g.best,g.combo);g.anim="pop";}
  else{g.wrong++;g.combo=0;g.anim="shake";if(g.mode==="heart")g.lives--;}
  render();
}
const isLast=g=>(g.mode==="heart"&&g.lives<=0)||g.i>=g.qs.length-1;

function finish(){

}

  g.anim="";
  const $=s=>app.querySelector(s);
  $("#quit").onclick=()=>{S.view="room";S.tab="stage";render();};
  app.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{if(b.dataset.mode!==g.mode)startGame(g.st.id,b.dataset.mode);});
  const sf=$("#stopFree");if(sf)sf.onclick=()=>{g.i=Math.max(0,g.i-1);finish();};
  app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{g.sel=b.dataset.o;render();});
  app.querySelectorAll("[data-wdot]").forEach(b=>b.onclick=()=>{const s=new Set((g.sel||"").split("").filter(Boolean));const n=b.dataset.wdot;s.has(n)?s.delete(n):s.add(n);g.sel=sortDots([...s].join(""));render();});
  const w=$("#win");
  if(w){w.oninput=()=>{g.input=w.value;const c=$("#check");if(c)c.disabled=!w.value.trim();};
        w.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();check();}};}
  app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const inp=$("#win");if(!inp)return;const k=b.dataset.k;
    inp.value=k==="⌫"?inp.value.slice(0,-1):inp.value+k;g.input=inp.value;const c=$("#check");if(c)c.disabled=!inp.value.trim();});
  const c=$("#check");if(c)c.onclick=check;
  const nq=$("#nextQ");if(nq){nq.onclick=nextQ;nq.focus();}
}
function result(){
  setBottom(false);
  const g=S.game,answered=Math.max(1,g.right+g.wrong);
  const free=g.mode==="free";
  const msg=free?(g.right+g.wrong>=g.qs.length?"모든 문제를 풀었어요":"여기까지 풀었어요")
    :g.lives<=0?"하트를 모두 썼어요":g.stars===3?"완벽해요!":g.stars===2?"잘했어요!":g.stars===1?"조금만 더!":"다시 도전해 봐요";
  app.innerHTML=`
  <section class="result pop">
    <span class="sub-txt">${g.st.lv?g.st.lv+" · ":""}${g.st.name} · ${free?"자유 모드":"하트 모드"}</span>
    ${free?`<span class="freebadge">${IC.inf}</span>`:starRow(g.stars,"bigstars")}
    <h2 class="${free||g.stars?"":"fail"}">${msg}</h2>
    ${g.newBest?`<span class="newbest">새 최고 기록</span>`:""}
    <div class="tiles">
      <div class="tile3 g"><small>맞힌 문제</small><b>${g.right}</b></div>
      <div class="tile3 b"><small>정답률</small><b>${Math.round(g.right/answered*100)}%</b></div>
      <div class="tile3 o"><small>${free?"틀린 문제":"최대 연속"}</small><b>${free?g.wrong:g.best}</b></div>
    </div>
    <div class="row2"><button class="btn ghost" id="toList">목록으로</button><button class="btn" id="again">다시 하기</button></div>
    ${free?`<button class="linkbtn" id="tryHeart">하트 모드로 별 받으러 가기</button>`:""}
  </section>`;
  app.querySelector("#toList").onclick=()=>{S.view="room";S.tab="stage";render();};
  app.querySelector("#again").onclick=()=>startGame(g.st.id,g.mode);
  const th=app.querySelector("#tryHeart");if(th)th.onclick=()=>startGame(g.st.id,"heart");
}

render();
</script>

if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
</script>
