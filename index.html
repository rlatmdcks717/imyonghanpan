<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#58CC02">
<meta name="color-scheme" content="only light">
<script>try{var t=localStorage.getItem("imyong_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t;}catch(e){}</script>
<meta name="description" content="책을 펼치기 어려운 날에도 한 문제부터 시작하는 특수 임용 공부">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-32.png?v=935be1" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=935be1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="임용한판">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>임용한판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: bright single-theme learning game — title → subjects → zigzag stage path with bottom nav → lesson with bottom check sheet → result */
:root{
  --bg:#FFFFFF; --ink:#3C3C3C; --muted:#777777; --faint:#AFAFAF; --line:#E5E5E5; --wash:#F7F7F7;
  --green:#58CC02; --green-d:#58A700; --green-l:#D7FFB8;
  --blue:#1CB0F6;  --blue-d:#1899D6;  --blue-l:#DDF4FF;
  --red:#FF4B4B;   --red-d:#EA2B2B;   --red-l:#FFDFE0;
  --gold:#FFC800;  --gold-d:#E5A800;
  --orange:#FF9600;--orange-d:#E07F00;
  --purple:#CE82FF;--purple-d:#A568CC;
  --pink:#FF7EB6;--pink-d:#E0609A;
  --teal:#2EC4B6;--teal-d:#1FA295;
  --photo:#FFFFFF; --line2:#D0D0D0;
  --f-display:"Jua","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:only light;
}
html{height:100%}
body{min-height:100%}
*{box-sizing:border-box}
html{touch-action:manipulation} /* 더블탭 확대만 막고 핀치줌은 그대로 둠 */
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:14px 40px}
body.has-bottom .wrap{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:10px}
svg.i{width:1em;height:1em;vertical-align:-.13em;flex:none}

/* buttons */
.btn{--c:var(--green);--d:var(--green-d);border:0;border-radius:16px;background:var(--c);color:#fff;box-shadow:0 4px 0 var(--d);font-weight:700;font-size:16px;letter-spacing:.04em;padding:14px 20px;transition:transform .06s,box-shadow .06s;width:100%}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--d)}
.btn.blue{--c:var(--blue);--d:var(--blue-d)}
.btn.red{--c:var(--red);--d:var(--red-d)}
.btn.ghost{background:var(--bg);color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn:disabled{background:var(--line);color:var(--faint);box-shadow:0 4px 0 var(--line2);cursor:default}
.icon-btn{border:0;background:none;color:var(--faint);width:40px;height:40px;display:grid;place-items:center;font-size:24px;border-radius:12px}
.icon-btn:hover{background:var(--wash)}

/* top bar */
.top{display:flex;align-items:center;gap:10px;min-height:44px}
.top .t{flex:1;font-family:var(--f-display);font-size:22px;color:var(--ink)}
.stat-chip{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;color:var(--gold-d)}
.stat-chip svg{color:var(--gold)}

/* title */
.ts{min-height:calc(100dvh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center}
.logo{display:flex;flex-direction:column;align-items:center}
.logo .small{font-family:var(--f-display);font-size:28px;background:var(--gold);color:#4A3600;padding:2px 18px;border-radius:14px;box-shadow:0 4px 0 var(--gold-d);transform:rotate(-4deg)}
.logo .main{font-family:var(--f-display);font-size:clamp(68px,22vw,108px);line-height:1;color:var(--green);text-shadow:0 6px 0 var(--green-d);margin-top:12px}
.tagline{color:var(--muted);font-size:16px;line-height:1.65;font-weight:500}
.ts .btn{max-width:320px;font-size:18px;padding:15px}
/* 진입 화면은 한 화면에 딱 맞으므로 스크롤·당겨짐(바운스)을 막음. 화면이 너무 낮으면 버튼이 잘리지 않게 풀어 줌 */
body.on-title{overflow:hidden;overscroll-behavior:none}
@media (max-height:520px){body.on-title{overflow:auto;overscroll-behavior:auto}}

.credits{position:fixed;inset:0;z-index:50;background:#0F1A14;color:#F1F7EE;overflow-y:auto;display:flex;flex-direction:column;align-items:center;cursor:pointer;animation:cfade .35s ease}
@keyframes cfade{from{opacity:0}to{opacity:1}}
.credits .roll{width:min(420px,88vw);text-align:center;padding:clamp(40px,7vh,64px) 0 clamp(20px,4vh,40px);margin:auto 0;cursor:default}
.credits .ctitle{font-family:var(--f-display);font-size:clamp(38px,7vh,52px);color:var(--green);text-shadow:0 4px 0 var(--green-d);margin:0 0 6px}
.credits .csub{color:#A9C2A8;font-size:14px;line-height:1.6;margin:0 0 clamp(6px,2vh,18px)}
.credits dl{margin:0;display:flex;flex-direction:column;gap:4px}
.credits dt{font-size:11px;letter-spacing:.2em;color:#7FA07C;text-transform:uppercase;margin-top:clamp(10px,2.4vh,20px);font-weight:700}
.credits dt.nocap{text-transform:none;letter-spacing:.12em;font-size:12.5px}
.credits dd{margin:0;font-family:var(--f-display);font-size:clamp(18px,3vh,22px);line-height:1.35}
.credits dd.thx{display:flex;flex-direction:column;align-items:center;gap:clamp(22px,3.6vh,32px);margin-top:10px}
.credits .tg{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%}
.credits .tg small{font-family:var(--f-body);font-size:12.5px;color:#A9C2A8;font-weight:700;letter-spacing:.04em;margin-bottom:4px}
.credits .tp{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 22px}
.credits .tp span{display:flex;flex-direction:column;align-items:center}
.credits .tp i{font-family:var(--f-body);font-style:normal;font-size:13px;color:#8FB38C}
.credits .tg.many .tp{gap:8px 0;width:100%}
.credits .tg.many .tp{max-width:300px;margin:0 auto;justify-content:flex-start}
.credits .tg.many .tp span{flex:0 0 50%;min-width:0}
.credits .tg.many .tp i{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.credits .tg.many b{font-size:17px}
.credits .tg.many i{font-size:12px}
.credits dd.hdl{font-family:var(--f-body);font-size:13px;color:#8FB38C;margin-top:-2px}
.credits dd.many{font-family:var(--f-body);font-size:16px;font-weight:600}
.credits dd.small{font-family:var(--f-body);font-size:13px;color:#C9DCC7}
.credits dd.empty{font-family:var(--f-body);font-size:14px;color:#6E8A6C;font-style:italic}
.credits .cmeta{margin-top:clamp(14px,3vh,26px);padding-top:clamp(10px,2vh,16px);border-top:1px solid rgba(255,255,255,.1);font-size:12.5px;line-height:1.8;color:#9FB89D}
.credits .cmeta b{color:#F1F7EE;font-weight:700}
.credits .cend{margin-top:clamp(10px,2.4vh,22px);font-size:15px;line-height:1.7;color:#C9DCC7}
@media (max-height:640px){.credits .csub,.credits .cend{display:none}.credits .roll{padding-top:52px}}
.credits .cclose{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;border:0;background:rgba(255,255,255,.12);color:#fff;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;cursor:pointer}
.logo .main{cursor:default;-webkit-tap-highlight-color:transparent;user-select:none}
/* subjects */
.h-big{font-family:var(--f-display);font-size:26px;line-height:1.2}
.sub-txt{color:var(--muted);font-size:15px}
.subjects{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.subj{--c:var(--green);--d:var(--green-d);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;min-height:136px;text-align:center;background:var(--bg);border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:14px 16px}
.subj:active:not(.off){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.subj .g{position:relative;flex:none;width:52px;height:52px;border-radius:14px;background:var(--c);box-shadow:0 4px 0 var(--d);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:26px}
.subj b{display:block;font-size:18px;font-weight:700;line-height:1.25;word-break:keep-all}
.subj small{display:block;font-size:13px;color:var(--muted);margin-top:-6px}
.subj .arrow{margin-left:auto;color:var(--faint);font-size:20px}
.subj.off{cursor:default}
.subj.off .g{background:var(--line);box-shadow:0 4px 0 var(--line2);color:var(--faint)}
.subj .g svg{width:30px;height:30px}
.subj .g .lk{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:2px solid var(--line);display:grid;place-items:center;color:var(--faint)}
.subj .g .lk svg{width:12px;height:12px}
.subj.off b{color:var(--faint)}
.note{font-size:13px;color:var(--faint);text-align:center}

/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line);display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.bnav .in{display:flex;gap:6px;width:100%;max-width:560px}
.bnav button{flex:1;border:2px solid transparent;background:none;border-radius:14px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--faint)}
.bnav button svg{font-size:24px}
.bnav button[aria-selected="true"]{border-color:var(--blue);background:var(--blue-l);color:var(--blue)}

/* stage path */
.unit{--c:var(--green);--d:var(--green-d);background:var(--c);color:#fff;border-radius:16px;padding:14px 18px;box-shadow:0 4px 0 var(--d);display:flex;flex-direction:column}
.unit small{font-size:13px;font-weight:700;opacity:.85;letter-spacing:.04em}
.unit b{font-family:var(--f-display);font-weight:400;font-size:22px}
.unit.locked{--c:var(--line);--d:var(--line2);color:var(--faint)}
.path{display:flex;flex-direction:column;align-items:center;gap:22px;padding-block:8px 6px}
.node{--c:var(--green);--d:var(--green-d);display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:0}
.node .disc{width:76px;height:70px;border-radius:50%;background:var(--c);box-shadow:0 7px 0 var(--d);display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:30px;transition:transform .06s,box-shadow .06s;position:relative}
.node:active:not(.lock) .disc{transform:translateY(6px);box-shadow:0 1px 0 var(--d)}
.node .disc img{width:46px;height:46px;border-radius:50%;background:var(--photo)}
.node .name{font-weight:700;font-size:14px;color:var(--ink)}
.node .stars{display:flex;gap:1px;font-size:16px;color:var(--line)}
.node .stars .on{color:var(--gold)}
.node.lock{cursor:default}
.node.lock .disc{background:var(--line);box-shadow:0 7px 0 var(--line2);color:var(--faint);font-size:26px}
.node.lock .name{color:var(--faint)}
.node.done .disc::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:4px solid var(--gold);opacity:.9}
.hint{font-size:13px;color:var(--faint);text-align:center}

/* stage list */
.group-h{font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--ink);margin-top:4px}
.stages{display:flex;flex-direction:column;gap:12px}
.stage{--c:var(--green);--d:var(--green-d);display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--bg);border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:12px 14px}
.stage:active:not(.lock){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.stage .badge{flex:none;width:56px;height:56px;border-radius:16px;background:var(--c);box-shadow:0 4px 0 var(--d);display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:26px;overflow:hidden}
.stage .badge.photo{background:var(--photo);border:3px solid var(--c);box-shadow:0 4px 0 var(--d)}
.stage .badge img{width:100%;height:100%;object-fit:contain}
.stage .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.stage .txt b{font-size:17px;font-weight:700;line-height:1.3}
.stage .txt small{color:var(--muted);font-size:13px;line-height:1.35}
.stage .lv{align-self:flex-start;font-size:11px;font-weight:700;color:var(--d);background:color-mix(in srgb,var(--c) 15%,#fff);border-radius:6px;padding:0 6px;margin-bottom:2px}
.stage .stars{display:flex;gap:1px;font-size:18px;color:var(--line);flex:none}
.stage .stars .on{color:var(--gold)}
.stage.lock{cursor:default}
.stage.lock .badge{background:var(--line);box-shadow:0 4px 0 var(--line2);color:var(--faint)}
.stage.lock b{color:var(--faint)}
.stage.lock .lv{color:var(--faint);background:var(--wash)}

.stage.cat{padding:16px}
.stage.cat .badge{width:64px;height:64px}
.stage.cat .txt b{font-size:19px}
.stage .arrow{color:var(--faint);font-size:20px;flex:none}
.catbar{display:flex;align-items:center;gap:8px;margin-top:6px}
.catbar .meter{flex:1;height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.catbar .meter i{display:block;height:100%;background:var(--c);border-radius:999px}
.catbar .cnt{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:700;color:var(--gold-d);font-variant-numeric:tabular-nums}
.catbar .cnt svg{color:var(--gold)}
.crumb{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-bottom-width:4px;background:var(--bg);border-radius:14px;padding:6px 14px 6px 10px;font-family:var(--f-display);font-size:19px;color:var(--ink)}
.crumb svg{color:var(--faint)}
/* lesson */
.ltop{display:flex;align-items:center;gap:12px}
.prog{flex:1;height:16px;background:var(--line);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:999px;position:relative;transition:width .35s}
.prog i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.lives{display:flex;align-items:center;gap:4px;color:var(--red);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.lives svg{font-size:24px}
.combo{display:inline-flex;align-items:center;gap:4px;color:var(--orange);font-weight:700;font-size:14px}
.ask{font-family:var(--f-display);font-size:26px;line-height:1.3;word-break:keep-all}
.big{align-self:center;width:min(200px,62%);aspect-ratio:1;border-radius:18px;border:2px solid var(--line);border-bottom-width:4px;background:var(--photo);display:block}
.bigchar.long{font-size:52px;width:auto;padding-inline:20px;max-width:100%}
.bigchar.xl{white-space:normal;font-size:clamp(30px,9vw,44px);height:auto;min-height:110px;padding:18px 20px;text-align:center;line-height:1.25;word-break:keep-all}
.opt.small{font-size:22px}
.bigchar{align-self:center;font-family:var(--f-display);font-size:90px;line-height:1;color:var(--ink);border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;min-width:150px;width:auto;max-width:100%;padding-inline:16px;white-space:nowrap;height:150px;display:grid;place-items:center}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{border:2px solid var(--line);border-bottom-width:4px;background:var(--bg);border-radius:16px;padding:14px;font-family:var(--f-display);font-size:32px;color:var(--ink);transition:background .1s}
.opt:hover:not(:disabled){background:var(--wash)}
.opt.img{padding:8px}
.opt.img img{width:100%;aspect-ratio:1;display:block}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-l);color:var(--blue-d)}
.opt.right{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.opt.wrong{border-color:var(--red);background:var(--red-l);color:var(--red-d)}
.opt:disabled{cursor:default}
.word{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.syl{display:flex;gap:2px;padding:6px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--photo)}
.syl img{width:56px;height:56px;display:block}
.answer-in{width:100%;font-family:var(--f-display);font-size:24px;padding:14px;border:2px solid var(--line);border-radius:16px;background:var(--wash);color:var(--ink);text-align:center}
.answer-in:focus{border-color:var(--blue);outline:none;background:var(--bg)}

.modebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.modes{display:inline-flex;gap:4px;background:var(--wash);border:2px solid var(--line);border-radius:14px;padding:3px}
.modes button{border:0;background:none;border-radius:10px;padding:5px 10px;font-size:13px;font-weight:700;color:var(--faint);display:inline-flex;align-items:center;gap:4px}
.modes button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.modes button[data-mode="heart"][aria-pressed="true"] svg{color:var(--red)}
.modes button[data-mode="free"][aria-pressed="true"] svg{color:var(--blue)}
.modehint{font-size:12px;color:var(--faint);margin-top:-10px}
.count{font-weight:700;font-size:15px;color:var(--blue);font-variant-numeric:tabular-nums;white-space:nowrap}
.linkbtn{border:0;background:none;color:var(--blue);font-weight:700;font-size:14px;padding:4px 2px}
.freebadge{width:84px;height:84px;border-radius:50%;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;font-size:48px}
.answer-in.mono,.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.06em}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keypad button{border:2px solid var(--line);border-bottom-width:4px;background:var(--bg);border-radius:12px;padding:10px 0;font-weight:700;font-size:20px;color:var(--ink)}
.keypad button:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
/* bottom sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;border-top:2px solid var(--line);background:var(--bg);padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:6}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheet.ok{background:var(--green-l);border-color:transparent}
.sheet.no{background:var(--red-l);border-color:transparent}
.sheet .v{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:24px}
.sheet .v .ic{width:36px;height:36px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:20px}
.sheet.ok .v{color:var(--green-d)} .sheet.no .v{color:var(--red-d)}
.sheet .detail{font-weight:700;font-size:15px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.sheet .detail .bwrap{background:var(--bg);border-radius:8px;padding:6px 8px}
.sheet.ok .detail{color:var(--green-d)} .sheet.no .detail{color:var(--red-d)}
.sheet .jamo{font-weight:500;letter-spacing:.06em;opacity:.85}
.pop{animation:pop .3s ease} .shake{animation:shake .35s ease}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.sheet-up{animation:up .2s ease-out}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}

/* result */
.result{min-height:calc(100dvh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.bigstars{display:flex;gap:6px;font-size:58px;color:var(--line)}
.bigstars .on{color:var(--gold);filter:drop-shadow(0 4px 0 var(--gold-d))}
.result h2{font-family:var(--f-display);font-weight:400;font-size:32px;color:var(--gold-d)}
.result h2.fail{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tile3{--c:var(--gold);border:2px solid var(--c);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;background:var(--c)}
.tile3 small{color:#fff;font-weight:700;font-size:12px;padding:4px}
.tile3 b{background:var(--bg);border-radius:13px;padding:10px 4px;font-size:22px;font-weight:700;color:var(--c);font-variant-numeric:tabular-nums}
.tile3.g{--c:var(--green)} .tile3.b{--c:var(--blue)} .tile3.o{--c:var(--orange)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.newbest{font-weight:700;color:var(--blue);background:var(--blue-l);padding:4px 12px;border-radius:999px;font-size:14px}

/* 도감 */
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--muted);flex-wrap:wrap;font-weight:500}
.switch{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--ink);cursor:pointer}
.switch input{appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .15s}
.switch input::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked{background:var(--blue)} .switch input:checked::after{left:22px}
.sect{display:flex;flex-direction:column;gap:10px}
.sect h3{font-family:var(--f-display);font-weight:400;font-size:21px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.tile{border:2px solid var(--line);border-bottom-width:4px;background:var(--bg);border-radius:14px;padding:6px 6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tile img{width:100%;aspect-ratio:1;border-radius:9px;display:block}
.tile b{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.3;min-height:1.3em}
.tile.hide b{color:transparent;background:var(--wash);border-radius:6px;width:60%}
.tile.hide.show b{color:var(--blue);background:none}
.src{font-size:12px;color:var(--faint)}
.src a{color:var(--blue)}

/* 더 배우기 */
.link{display:flex;align-items:center;gap:14px;background:var(--bg);border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:14px 16px;text-decoration:none}
.link .g{flex:none;width:46px;height:46px;border-radius:12px;background:var(--blue);box-shadow:0 4px 0 var(--blue-d);display:grid;place-items:center;color:#fff;font-size:20px}
.link b{font-size:17px;font-weight:700;display:block}
.link span{font-size:13px;color:var(--muted);display:block}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--wash);color:var(--ink)}
.search input:focus{border-color:var(--blue);outline:none;background:var(--bg)}
.search .btn{width:auto;padding-inline:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips a{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:6px 14px;text-decoration:none;font-weight:700;font-size:15px}

/* braille */
.bc{--dd:var(--d,10px);display:inline-grid;grid-template-rows:repeat(3,var(--dd));grid-template-columns:repeat(2,var(--dd));grid-auto-flow:column;gap:calc(var(--dd)*.4) calc(var(--dd)*.5);vertical-align:middle}
.bc i{border-radius:50%;border:max(1.5px,calc(var(--dd)*.12)) solid #C4C4C4;background:var(--bg)}
.bc i.on{background:var(--ink);border-color:var(--ink)}
.bcs{display:inline-flex;gap:calc(var(--d,10px)*1.1);align-items:center}
.bwrap{display:inline-flex;align-items:center;justify-content:center;--d:12px}
.bwrap.big{--d:26px;align-self:center;padding:24px 28px;border:2px solid var(--line);border-bottom-width:4px;border-radius:18px}
.bwrap.sm{--d:9px}
.opt.img .bwrap{--d:15px;padding:14px 0;width:100%}
.stage .badge .bwrap{--d:9px}
.stage.cat .badge .bwrap{--d:10px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.btile{--d:11px;border:2px solid var(--line);border-bottom-width:4px;background:var(--bg);border-radius:14px;padding:12px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.btile b{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.2;text-align:center}
.btile small{font-size:11px;color:var(--faint);text-align:center;line-height:1.3}
.btile.hide b{color:transparent;background:var(--wash);border-radius:6px;min-width:60%}
.btile.hide.show b{color:var(--purple-d);background:none}
.chips.jump a{font-size:13px;padding:4px 10px}
.paper.bigp{--d:14px;justify-content:center;padding:20px 14px;border-style:solid;background:var(--bg)}
.paper.bigp .bcs{flex-wrap:wrap;justify-content:center;row-gap:18px;max-width:100%}
.paper{--d:12px;display:flex;flex-wrap:wrap;gap:6px;min-height:80px;align-items:center;padding:12px;border:2px dashed var(--line);border-radius:16px;background:var(--wash)}
.pcell{border:2px solid transparent;background:var(--bg);border-radius:10px;padding:8px 9px}
.pcell.sel{border-color:var(--blue);background:var(--blue-l)}
.writer{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.wside{flex:1;min-width:170px;display:flex;flex-direction:column;gap:8px}
.dots6{display:grid;grid-template-columns:repeat(2,64px);gap:12px 16px;padding:16px 20px;border:2px solid var(--line);border-bottom-width:4px;border-radius:20px;flex:none}
.dots6.ingame{align-self:center}
.dot{width:64px;height:64px;border-radius:50%;border:3px solid #CFCFCF;background:var(--bg);font-weight:700;font-size:16px;color:var(--faint);transition:background .1s}
.dot.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dot.should{box-shadow:0 0 0 4px var(--green)}
.dot:disabled{cursor:default}
.dtxt{font-weight:700;font-size:17px}
.cands{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cands .src{width:100%}
.cand{display:inline-flex;align-items:baseline;gap:6px;border:2px solid var(--line);border-radius:12px;padding:4px 10px;font-family:var(--f-display);font-size:19px}
.cand em{font-style:normal;font-family:var(--f-body);font-size:11px;font-weight:700;color:var(--purple-d)}
@media (hover:none){.kbd{display:none}}
/* law */
mark{background:linear-gradient(transparent 38%,var(--hl) 38%,var(--hl) 92%,transparent 92%);color:inherit;padding:0 1px;border-radius:2px}
.keyrow{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;font-weight:700}
.key{display:inline-flex;align-items:center;gap:5px}.key i{width:16px;height:12px;border-radius:3px;display:inline-block}
.legend{border:2px solid var(--line);border-radius:16px;padding:10px 14px}
.legend summary{font-weight:700;cursor:pointer}
.legend[open] summary{margin-bottom:10px}
.lchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.lchip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;color:var(--ink)}
.lchip i{width:14px;height:14px;border-radius:4px;display:inline-block}
.lchip[aria-pressed="false"]{color:var(--faint);text-decoration:line-through}
.lchip[aria-pressed="false"] i{opacity:.25}
.legend .btn{padding:8px;font-size:14px}
.lart{border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;line-height:1.75;font-size:15.5px}
.lart header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.lart header b{font-size:16px}
.lart p{margin:0}
.lart p.hang{margin-top:2px}
.lart p.ho{padding-left:1.2em;text-indent:-1.2em;margin-left:1em}
.lart.del{opacity:.6}
.lnote{font-size:12px;color:var(--faint)}
.lnote.blk{display:block}
.fbadge{font-size:12px;font-weight:700;color:var(--orange-d);background:#FFF0DB;border-radius:999px;padding:2px 10px;border:0}
.btnlike{cursor:pointer}
.nextver{border-top:2px dashed var(--line);margin-top:6px;padding-top:8px;display:flex;flex-direction:column;gap:6px}
.lbtop{display:flex;flex-direction:column;gap:10px}
.lbtop select{font:inherit;font-size:16px;padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);max-width:100%}
input.bl{font:inherit;font-size:15px;border:0;border-bottom:2px solid var(--blue);background:var(--blue-l);border-radius:6px 6px 0 0;padding:0 4px;margin:0 2px;max-width:100%;color:var(--ink)}
input.bl:focus{outline:2px solid var(--blue);outline-offset:1px}
input.bl.ok{border-color:var(--green);background:var(--green-l);color:var(--green-d);font-weight:700}
input.bl.no{border-color:var(--red);background:var(--red-l);color:var(--red-d);text-decoration:line-through}
span.bl.ans{font-weight:700;color:var(--green-d);font-size:14px;margin-right:2px}
span.bl.show{font-weight:700;color:var(--blue-d);background:var(--blue-l);border-radius:4px;padding:0 3px}
input.bl.act{background:var(--hl);border-bottom-color:rgba(0,0,0,.35)}
span.bl.act{background:var(--hl);color:var(--ink)}
span.bl.okv{font-weight:700;color:var(--green-d);background:var(--green-l);border-radius:4px;padding:0 3px}
span.bl.wrongv{font-weight:700;color:var(--red-d);background:var(--red-l);border-radius:4px;padding:0 3px}
span.bl.wrongv s{font-weight:500;opacity:.7}
.seg{display:inline-flex;gap:4px;background:var(--wash);border:2px solid var(--line);border-radius:14px;padding:3px;align-self:flex-start}
.seg button{border:0;background:none;border-radius:10px;padding:6px 14px;font-size:14px;font-weight:700;color:var(--faint)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.lbscore{border-radius:14px;padding:12px 16px;background:var(--red-l);color:var(--red-d);font-weight:700}
.lbscore.ok{background:var(--green-l);color:var(--green-d)}
.docseg{align-self:stretch;display:flex}.docseg button{flex:1;font-size:15px;padding:8px}
.lart h4{margin:8px 0 0;font-size:15.5px}
.lart p.ho.sub{margin-left:2.2em}
.tblwrap{overflow-x:auto}
.ltbl{border-collapse:collapse;width:100%;font-size:14px;line-height:1.6;min-width:320px}
.ltbl th,.ltbl td{border:1.5px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
.ltbl thead th{background:var(--wash);text-align:center}
.ltbl th{font-weight:700;background:var(--wash)}
.ltbl th.vert{width:4.5em;text-align:center}
.cmpnav{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;color:var(--muted);font-size:14px}
.cmpnav .btn{width:auto;padding:8px 14px;font-size:14px}
.cmpgrid{display:flex;flex-direction:column;gap:14px}
.ccol{border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;overflow:hidden;min-width:0}
.ccol h3{margin:0;padding:8px 14px;font-family:var(--f-display);font-weight:400;font-size:19px;color:#fff}
.c-law h3{background:var(--orange)} .c-dec h3{background:var(--blue)} .c-rul h3{background:var(--purple)}
.carti{padding:12px 14px;display:flex;flex-direction:column;gap:6px;line-height:1.75;font-size:15px;border-top:2px dashed var(--line)}
.ccol h3+.carti{border-top:0}
.carti p{margin:0}.carti p.ho{padding-left:1.2em;text-indent:-1.2em;margin-left:1em}
.ccol>.src{padding:12px 14px}
.bylbtn{width:auto;align-self:flex-start;padding:6px 14px;font-size:14px}
.carti .lart.byl{border-width:2px;margin-top:6px}
body.wide .wrap{max-width:1200px}
@media (min-width:900px){body.wide .cmpgrid{display:grid;grid-template-columns:repeat(3,1fr);align-items:start}}
.qblank{display:inline-block;min-width:4em;border-bottom:3px solid var(--ink);margin:0 4px;text-align:center;color:var(--green-d)}
.lqstat{display:flex;gap:8px;flex-wrap:wrap}.lqstat span{border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px}
.tchip{font-size:12px;font-weight:700;color:var(--purple-d);background:#F3E8FF;border-radius:999px;padding:3px 10px}
.oxbtn{font-size:40px}
.mclist{display:flex;flex-direction:column;gap:10px}
.mcopt{font-family:var(--f-body);font-size:16px;font-weight:700;text-align:left;display:flex;gap:10px;align-items:center}
.mcopt span{color:var(--faint)}
.lqfb{border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;line-height:1.6}
.lqfb.ok{background:var(--green-l)} .lqfb.ok>b{color:var(--green-d)}
.lqfb.no{background:var(--red-l)} .lqfb.no>b{color:var(--red-d)}
.lqfb p{margin:0}
.lqquote{background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:14.5px;line-height:1.7}
.lqrev{border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.lqrev p{margin:0}.lqrev .ok{color:var(--green-d);font-weight:700}
.listen{margin-left:auto;display:inline-flex;align-items:center;gap:4px;border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;color:var(--blue-d)}
.lart.speaking{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
#ttsbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:7;display:flex;justify-content:center;padding:0 10px 8px;pointer-events:none}
#ttsbar .in{pointer-events:auto;width:100%;max-width:560px;display:flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border-radius:16px;padding:8px 8px 8px 14px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#ttsbar .tnow{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
#ttsbar .tnow small{font-size:11px;opacity:.7}
#ttsbar .tnow b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ttsbar .tmsg{flex:1;font-size:14px}
#ttsbar .tb{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:10px;min-width:38px;height:38px;font-size:18px;font-weight:700;display:grid;place-items:center;padding:0 8px}
#ttsbar .tb.main{background:var(--blue)}
#ttsbar .tb.rate{font-size:13px}
.ttsno{display:flex;gap:10px;align-items:flex-start;background:#FFF4D6;border:2px solid #FFD66B;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5;color:#5A4300}
.ttsno svg{flex:none;width:20px;height:20px;margin-top:2px}
.vpick{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--ink-2,#555)}
.vpick select{flex:1;min-width:0;font:inherit;font-weight:500;padding:8px 10px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
body.has-tts .wrap{padding-bottom:calc(190px + env(safe-area-inset-bottom,0px))}
/* 특수교육학 준비 중 */
.soon{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:28px 18px;border:2px dashed var(--line);border-radius:20px;background:var(--wash)}
.soonic{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;background:var(--sc,var(--pink));color:#fff;box-shadow:0 5px 0 var(--sd,var(--pink-d))}
.soonic .i{width:40px;height:40px}
.soon .pill{align-self:center}
.soon .sub-txt{max-width:30em;word-break:keep-all}
.soonchips,.soonyears{display:flex;flex-wrap:wrap;gap:8px}
.soonchips span,.soonyears span{display:inline-flex;align-items:center;gap:5px;border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-size:14px;font-weight:700;color:var(--faint);background:var(--bg)}
.soonchips .i,.soonyears .i{width:14px;height:14px}
.spareas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sparea{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:10px 12px;background:var(--bg);font:inherit;color:var(--ink);text-align:left}
.sparea b{font-size:16px}
.sparea span{font-size:13px;color:var(--pink-d);font-weight:700}
.sparea small{color:var(--muted);font-weight:500}
.spnum{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--wash);border:2px solid var(--line);font-weight:700;font-size:17px;color:var(--ink);flex:none}
.spq b{word-break:keep-all}
.spq b em{font-style:normal;font-size:12px;color:var(--muted);font-weight:500;margin-left:4px}
.spq small.also{color:var(--pink-d)}
.spchips{display:flex;flex-wrap:wrap;gap:6px}
.spchips span{border:2px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;color:var(--muted)}
.spchips span.on{border-color:var(--pink);color:var(--pink-d);background:#FFF0F7}
.splist{display:flex;flex-direction:column;gap:10px}
.spcard{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:12px 14px;background:var(--bg);text-align:left;font:inherit;color:var(--ink)}
.spcard>span:nth-child(2){flex:1;min-width:0}
.spcard b{display:block;font-size:17px}.spcard small{display:block;font-size:13px;color:var(--muted)}
.spcard .i{width:18px;height:18px;color:var(--faint)}
.spic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--pink);color:#fff;box-shadow:0 3px 0 var(--pink-d)}
.spic .i{width:22px!important;height:22px!important;color:#fff!important}
.sphead{display:flex;flex-direction:column;gap:10px}
.spback{display:none} /* 화면 안 뒤로 버튼 대신 왼쪽 위 ‹ 버튼이 한 단계씩 돌아감 */
.sptools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.sppages{display:flex;flex-direction:column;gap:10px;align-self:stretch;width:100%;min-width:0}
.sppage{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;width:100%;min-width:0}
.spimg{position:relative;display:block;width:100%}
.sppage img{display:block;width:100%;height:auto}
.sppages.big .sppage{overflow-x:auto}
.sppages.big .spimg{width:170%;max-width:none}
.sphl{position:absolute;background:rgba(255,214,0,.42);mix-blend-mode:multiply;border-radius:3px;pointer-events:none}
.sphlbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.sphlbar span{display:inline-flex;align-items:center;gap:6px}
.sphlbar span i{width:22px;height:12px;border-radius:3px;background:rgba(255,214,0,.6);display:inline-block}
.spzoomtip{font-size:13px;color:var(--muted)}
.lawstrip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.lawstrip button{flex:none;border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:4px 10px;font:inherit;font-size:13px;font-weight:700;color:var(--muted)}
.lawstrip button.on{border-color:var(--orange);background:#FFF3E0;color:var(--orange-d)}
.lawstrip button.del{opacity:.5}
.lawnav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.lawnav span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lawswipe{touch-action:pan-y;overflow-x:clip;overflow-y:visible}
.lawswipe.inR .lawone{animation:lawInR .22s ease}
.lawswipe.inL .lawone{animation:lawInL .22s ease}
@keyframes lawInR{from{transform:translateX(28px);opacity:.3}to{transform:none;opacity:1}}
@keyframes lawInL{from{transform:translateX(-28px);opacity:.3}to{transform:none;opacity:1}}
.lawtitle{margin:0;font-size:15px;color:var(--muted)}
.lawtools h3{font-size:18px}
.lawhits{display:flex;flex-direction:column;gap:8px}
.lawhit{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:10px 12px;background:var(--bg);font:inherit;color:var(--ink);text-align:left}
.lawhit small{font-size:13px;color:var(--muted)}
/* 따라 쓰기 */
.modeseg{align-self:flex-start}
.tycard,.tydone{gap:12px}
.tytarget{font-size:18px;line-height:1.9;word-break:break-all;background:var(--wash);border-radius:12px;padding:12px 14px;letter-spacing:.01em}
.tytarget .tylab{display:inline-block;margin-right:6px;color:var(--muted);font-weight:700}
.tytarget .t-todo{color:#9A9A9A}
.tytarget .t-ok{color:var(--green-d)}
.tytarget .t-no{color:var(--red-d);background:var(--red-l);border-radius:3px}
.tytarget .t-cur{color:var(--blue-d)}
.tytarget .caret{box-shadow:inset 0 -3px 0 var(--blue)}
.tyin{font:inherit;font-size:18px;line-height:1.6;width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;resize:none;background:var(--bg);color:var(--ink)}
.tyin:focus{outline:none;border-color:var(--blue)}
.tymeta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.tyskip{width:auto;flex:none;min-height:0;padding:6px 14px;font-size:13px;box-shadow:0 2px 0 var(--line)}
.tystats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.tystats div{border:2px solid var(--line);border-radius:12px;padding:10px 4px}
.tystats b{display:block;font-family:var(--f-display);font-size:26px;color:var(--blue-d)}
.tystats small{color:var(--muted);font-size:12px}
/* 교육과정 */
.cart p{margin:0}
.cart p.ch{font-weight:700;margin-top:8px}
.cart p.ch:first-child{margin-top:0}
.cart p.cp{margin-top:2px}
.cart p.cgs{padding-left:1.6em;text-indent:-1.6em;margin-top:4px}
.cart p.ci1{padding-left:1.6em;text-indent:-1.6em;margin-top:3px}
.cart p.cgs~p.ci1{padding-left:2.9em}
.cart p.ci2{padding-left:2.9em;text-indent:-1.7em}
.cart p.cgs~p.ci2{padding-left:4.2em}
.cart p.ci3{padding-left:4.2em;text-indent:-1.9em;font-size:15px}
.cart p.cdot{padding-left:3em;text-indent:-1em}
.cart p.cnote{padding-left:1.2em;text-indent:-1.2em;font-size:14.5px;color:var(--muted)}
.cart .tblwrap{margin:8px 0}
.cart b.kn{color:var(--blue-d);font-weight:700}
.cbox{border:2px dashed var(--line);border-radius:14px;padding:12px 14px;background:var(--wash);font-size:14.5px;line-height:1.7;display:flex;flex-direction:column;gap:4px}
.cbox p{margin:0}
.cbwrap{border:0;padding:0;gap:6px}.cbwrap header{justify-content:space-between}
.cuhd{justify-content:flex-end;margin-bottom:-4px}
.cart .cbox{margin:6px 0}
.ctbl{min-width:0}
.ctbl td.num{text-align:right;font-variant-numeric:tabular-nums;width:6.5em}
.ctbl th.vert{width:3.6em}
input.cb{font:inherit;font-size:15px;border:0;border-bottom:2px solid var(--blue);background:var(--blue-l);border-radius:6px 6px 0 0;padding:0 4px;margin:0 2px;max-width:100%;color:var(--ink);text-indent:0}
input.cb:focus{outline:2px solid var(--blue);outline-offset:1px}
input.cb.tq{width:5em;text-align:right;margin:0}
/* 개념 카드 */
.card{border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.qtext{font-size:19px;font-weight:700;line-height:1.5}
.ans{border-top:2px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.blank{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--ink);margin-inline:2px}
.hl{color:var(--green-d)}
.pill{align-self:flex-start;font-size:12px;font-weight:700;background:var(--gold);color:#4A3600;padding:3px 10px;border-radius:999px}
.verdict{font-family:var(--f-display);font-size:20px}
.verdict.ok{color:var(--green-d)} .verdict.no{color:var(--red-d)}
.vh{position:absolute;left:-9999px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* ===== 특수교육학 키워드 문제 ===== */
.kqarea .best{font-size:12px;color:var(--green-d);font-weight:700}
.kqtop{display:flex;align-items:center;gap:10px}
.kqtop .prog{flex:1}
.kqtop .cnt{font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap}
.kqcard{border:2px solid var(--line);border-radius:18px;padding:18px 16px;background:var(--bg)}
.kqcard .tag{font-size:12.5px;font-weight:700;color:var(--pink-d)}
.kqcard h3{font-size:18.5px;line-height:1.55;margin-top:6px;word-break:keep-all;font-weight:700}
.kqopts{display:flex;flex-direction:column;gap:10px}
.kqopt{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:12px 14px;background:var(--bg);font:inherit;font-size:16.5px;color:var(--ink);width:100%}
.kqopt .n{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.kqopt:not(:disabled):active{transform:translateY(2px);border-bottom-width:2px}
.kqopt.ok{border-color:var(--green);background:var(--green-l);color:var(--green-d);font-weight:700}
.kqopt.ok .n{border-color:var(--green);background:var(--green);color:#fff}
.kqopt.no{border-color:var(--red);background:var(--red-l);color:var(--red-d)}
.kqopt.no .n{border-color:var(--red);background:var(--red);color:#fff}
.kqopt:disabled{cursor:default}
.kqexp{border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.6;background:var(--wash);border:2px solid var(--line)}
.kqexp b{display:block;margin-bottom:4px;font-size:16px}
.kqexp.ok b{color:var(--green-d)} .kqexp.no b{color:var(--red-d)}
.kqscore{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;padding:10px 0}
.kqscore .kqbig{font-family:var(--f-display);font-size:48px;color:var(--green)}
.kqwrong{display:flex;flex-direction:column;gap:8px}
.kqwrong div{border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.5}
.kqwrong div em{font-style:normal;font-weight:700;color:var(--green-d)}

.moderow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sqlisten{flex:none;width:44px;height:44px;border:0;border-radius:12px;background:var(--blue);box-shadow:0 3px 0 var(--blue-d);color:#fff;display:grid;place-items:center;padding:0}
.sqlisten svg{width:22px;height:22px}
.sqlisten:active{transform:translateY(3px);box-shadow:none}
/* ===== 다크모드 (오른쪽 위 해/달 버튼으로 전환) ===== */
.themebtn{flex:none;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;padding:0;box-shadow:0 3px 0 var(--line)}
.themebtn:active{transform:translateY(3px);box-shadow:none}
.themebtn svg{width:22px;height:22px}
.themebtn.fixed{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:20}
:root[data-theme="dark"]{
  --bg:#131F24; --ink:#EEF3F5; --muted:#A6B4BB; --faint:#71838C; --line:#37464F; --wash:#1C2B33; --line2:#26343B;
  --green-l:#1E3818; --blue-l:#0E3045; --red-l:#43201F;
  color-scheme:dark;
}
:root[data-theme="dark"] .themebtn{color:#FFD43B}
:root[data-theme="dark"] mark{background:var(--hl);color:#1A1A1A;border-radius:4px;padding:0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
:root[data-theme="dark"] input.bl.act{color:#1A1A1A}
:root[data-theme="dark"] .fbadge,:root[data-theme="dark"] .lawstrip button.on{background:#3A2A12}
:root[data-theme="dark"] .tchip{background:#31204A;color:#D9B3FF}
:root[data-theme="dark"] .spchips span.on{background:#3F1D2E;color:#FF9CC8}
:root[data-theme="dark"] #ttsbar .in{background:#22333B}
:root[data-theme="dark"] .ttsno{background:#352C10;border-color:#7A6420;color:#FFE7A0}
:root[data-theme="dark"] .tytarget .t-todo{color:#6F8089}
:root[data-theme="dark"] .sppage{border-color:#37464F}
:root[data-theme="dark"] .stage .lv{background:color-mix(in srgb,var(--c) 22%,var(--bg))}
</style>

const LAW = [{"no": "제1장", "title": "총칙", "arts": [{"no": "제1조", "title": "목적", "lines": ["이 법은 「교육기본법」 제18조에 따라 국가 및 지방자치단체가 장애인 및 특별한 교육적 요구가 있는 사람에게 통합된 교육환경을 제공하고 생애주기에 따라 장애유형 ㆍ장애정도의 특성을 고려한 교육을 실시하여 이들이 자아실현과 사회통합을 하는데 기여함을 목적으로 한다."]}, {"no": "제2조", "title": "정의", "lines": ["이 법에서 사용하는 용어의 정의는 다음과 같다. <개정 2012. 3. 21., 2021. 3. 23., 2021. 12. 28., 2024. 2. 27.>", "1. “특수교육”이란 특수교육대상자의 교육적 요구를 충족시키기 위하여 특성에 적합한 교육과정 및 제2호에 따른 특수교육 관련서비스 제공을 통하여 이루어지는 교육을 말한다.", "2. “특수교육 관련서비스”란 특수교육대상자의 교육을 효율적으로 실시하기 위하여 필요한 인적ㆍ물적 자원을 제공하는 서비스로서 상담지원ㆍ가족지원ㆍ치료지원ㆍ지원인력배치ㆍ보조공학기기지원ㆍ학습보조기기지원ㆍ통학지원 및 정보접근지원 등을 말한다.", "3. “특수교육대상자”란 제15조에 따라 특수교육이 필요한 사람으로 선정된 사람을 말한다.", "4. “특수교육교원”이란 「초ㆍ중등교육법」 제2조제4호에 따른 특수학교 교원자격증을 가진 사람으로서 특수교육대상자의 교육을 담당하는 교원을 말한다.", "5. “보호자”란 친권자ㆍ후견인, 그 밖의 사람으로서 특수교육대상자를 사실상 보호하는 사람을 말한다.", "6. “통합교육”이란 특수교육대상자가 일반학교에서 장애유형ㆍ장애정도에 따라 차별을 받지 아니하고 또래와 함께 개개인의 교육적 요구에 적합한 교육을 받는 것을 말한다.", "7. “개별화교육”이란 각급학교의 장이 특수교육대상자 개인의 능력을 계발하기 위하여 장애유형 및 장애특성에 적합한 교육목표ㆍ교육방법ㆍ교육내용ㆍ특수교육 관련서비스 등이 포함된 계획을 수립하여 실시하는 교육을 말한다.", "8. “순회교육”이란 특수교육교원 및 특수교육 관련서비스 담당 인력이 각급학교나 의료기관, 가정 또는 복지시설(장애인복지시설, 아동복지시설 등을 말한다. 이하 같다) 등에 있는 특수교육대상자를 직접 방문하여 실시하는 교육을 말한다.", "9. “진로 및 직업교육”이란 특수교육대상자의 학교에서 사회 등으로의 원활한 이동을 위하여 관련 기관의 협력을 통하여 직업재활훈련ㆍ 자립생활훈련 등을 실시하는 것을 말한다.", "10. “특수교육기관”이란 특수교육대상자에게 유치원ㆍ초등학교ㆍ중학교 또는 고등학교(전공과를 포함한다. 이하 같다)의 과정을 교육하는 특수학교 및 특수학급을 말한다.", "11. “특수학급”이란 특수교육대상자의 통합교육을 실시하기 위하여 일반학교에 설치된 학급을 말한다.", "11의2. “통합학급”이란 특수교육대상자와 또래 일반학생이 함께 편성된 학급을 말한다.", "12. “각급학교”란 「유아교육법」 제2조제2호에 따른 유치원 및 「초ㆍ중등교육법」 제2조에 따른 학교를 말한다."]}, {"no": "제3조", "title": "의무교육 등", "lines": ["① 특수교육대상자에 대하여는 「교육기본법」 제8조에도 불구하고 유치원ㆍ초등학교ㆍ중학교 및 고등학교 과정의 교육은 의무교육으로 하고, 제24조에 따른 전공과와 만 3세미만의 장애영아교육은 무상으로 한다.", "② 만 3세부터 만 17세까지의 특수교육대상자는 제1항에 따른 의무교육을 받을 권리를 가진다. 다만, 출석일수의 부족 등으로 인하여 진급 또는 졸업을 하지 못하거나, 제19조제3항에 따라 취학의무를 유예하거나 면제받은 사람이 다시 취학할 때의 그 학년이 취학의무를 면제 또는 유예받지 아니하고 계속 취학하였을 때의 학년과 차이가 있는 경우에는 그 해당 연수(年數)를 더한 연령까지 의무교육을 받을 권리를 가진다. <개정 2021. 3. 23.>", "③ 제1항에 따른 의무교육 및 무상교육에 드는 비용은 대통령령으로 정하는 바에 따라 국가 또는 지방자치단체가 부담한다."]}, {"no": "제4조", "title": "차별의 금지", "lines": ["① 각급학교의 장 또는 대학(「고등교육법」 제2조에 따른 학교를 말한다. 이하 같다)의 장은 특수교육대상자가 그 학교에 입학하고자 하는 경우에는 그가 지닌 장애를 이유로 입학의 지원을 거부하거나 입학전형 합격자의 입학을 거부하는 등 교육 기회의 부여에서 차별을 하여서는 아니 된다. <개정 2021. 3. 23.>", "② 국가, 지방자치단체, 각급학교의 장 또는 대학의 장은 다음 각 호의 사항에 관하여 장애인의 특성을 고려한 교육시행을 목적으로 함이 명백한 경우 외에는 특수교육대상자 및 보호자를 차별하여서는 아니 된다. <개정 2018. 2. 21.>", "1. 제28조에 따른 특수교육 관련서비스 제공에서의 차별", "2. 수업, 학생자치활동, 그 밖의 교내외 활동에 대한 참여 배제", "3. 개별화교육지원팀에의 참여 등 보호자 참여에서의 차별", "4. 대학의 입학전형절차에서 장애로 인하여 필요한 수험편의의 내용을 조사ㆍ확인하기 위한 경우 외에 별도의 면접이나 신체검사를 요구하는 등 입학전형 과정에서의 차별", "5. 입학ㆍ전학 및 기숙사 입소 과정에서 비장애학생에게 요구하지 아니하는 보증인 또는 서약서 제출을 요구", "6. 학생 생활지도에서의 「장애인차별금지 및 권리구제 등에 관한 법률」 제4조의 차별"]}]}, {"no": "제2장", "title": "국가 및 지방자치단체의 임무", "arts": [{"no": "제5조", "title": "국가 및 지방자치단체의 임무", "lines": ["① 국가 및 지방자치단체는 특수교육대상자에게 적절한 교육을 제공하기 위하여 다음 각 호의 업무를 수행하여야 한다. <개정 2016. 5. 29., 2017. 12. 19.>", "1. 장애인에 대한 특수교육종합계획의 수립", "2. 특수교육대상자의 조기발견", "3. 특수교육대상자의 취학지도", "4. 특수교육의 내용, 방법 및 지원체제의 연구ㆍ개선", "5. 특수교육교원의 양성 및 연수", "6. 특수교육기관 배치계획의 수립", "7. 특수교육기관의 설치ㆍ운영 및 시설ㆍ설비의 확충ㆍ정비", "8. 특수교육에 필요한 교재ㆍ교구의 연구ㆍ개발 및 보급", "9. 특수교육대상자에 대한 진로 및 직업교육 방안의 강구", "10. 장애인에 대한 고등교육 방안의 강구", "11. 특수교육대상자에 대한 특수교육 관련서비스 지원방안의 강구", "12. 그 밖에 특수교육의 발전을 위하여 필요하다고 인정하는 사항", "② 국가 및 지방자치단체는 제1항의 업무를 수행하는데 드는 경비를 예산의 범위 안에서 우선적으로 지급하여야 한다.", "③ 국가는 제1항의 업무 추진이 부진하거나 제2항의 예산조치가 부족하다고 인정되는 지방자치단체에 대하여는 예산의 확충 등 필요한 조치를 하도록 권고하여야 한다.", "④ 교육부장관은 제1항의 업무를 효율적으로 수행하기 위하여 문화체육관광부장관ㆍ보건복지부장관ㆍ고용노동부장관ㆍ성평등가족부장관 등 관계 중앙행정기관 간에 협조체제를 구축하여야 한다. <개정 2008. 2. 29., 2010. 6. 4., 2013. 3. 23., 2016. 2. 3., 2025. 10. 1.>"]}, {"no": "제6조", "title": "특수교육기관의 설립 및 위탁교육", "lines": ["① 국가 및 지방자치단체는 특수교육대상자의 취학편의를 고려하여 특수교육기관을 지역별 및 장애영역별로 균형 있게 설치ㆍ운영하여야 한다.", "② 교육부장관 및 교육감은 특정 분야의 인재 양성을 목적으로 하는 교육을 전문적으로 실시하는 특수학교(이하 “특성화특수학교”라 한다)를 지정ㆍ고시할 수 있다. 이 경우 특성화특수학교의 지정 절차는 교육부령으로 정한다. <신설 2024. 12. 20.>", "③ 특성화특수학교의 장은 제17조에도 불구하고 특수교육대상자의 지원을 받아 특수교육대상자를 선발할 수 있다. 이 경우 특성화특수학교의 장은 필기시험에 의한 전형을 실시하여서는 아니 된다. <신설 2024. 12. 20.>", "④ 국가 및 지방자치단체는 국립 또는 공립의 특수교육기관이 부족하거나 특수교육대상자의 의무교육 또는 무상교육을 위하여 필요한 경우에는 사립의 특수교육기관에 그 교육을 위탁할 수 있다. <개정 2024. 12. 20.>", "⑤ 제4항에 따라 특수교육을 위탁한 경우에는 해당 특수교육기관의 교육여건이 국립 또는 공립 특수교육기관의 수준에 미달하지 아니하도록 지원하여야 한다. <개정 2024. 12. 20.>", "⑥ 제4항에 따른 위탁교육ㆍ제5항에 따른 지원 또는 비용부담 등에 관하여 필요한 사항은 대통령령으로 정한다. <개정 2024. 12. 20.>"]}, {"no": "제7조", "title": "위탁교육기관의 변경신청", "lines": ["① 제6조제4항에 따라 교육을 위탁받은 사립의 특수교육기관에 취학하고 있는 특수교육대상자 또는 그의 보호자는 해당 특수교육기관의 교육활동이 매우 불량하거나 특수교육대상자의 특성에 맞지 아니하여 특수교육대상자의 교육에 현저한 지장을 주고 있다고 판단되는 때에는 교육장 또는 교육감에게 그 사유를 구체적으로 명시하여 취학하고 있는 교육기관 외의 교육기관에 취학할 수 있도록 교육기관 변경을 신청할 수 있다. <개정 2024. 12. 20.>", "② 제1항에 따른 변경신청을 받은 교육장 또는 교육감은 신청 접수일부터 30일 이내에 제10조제1항에 따른 시ㆍ군ㆍ구특수교육운영위원회 또는 시ㆍ도특수교육운영위원회를 열어 신청인ㆍ해당 학교의 장 등 이해관계인의 의견을 들은 후 변경 여부를 결정ㆍ통보하여야 한다."]}, {"no": "제8조", "title": "교원의 자질향상", "lines": ["① 국가 및 지방자치단체는 특수교육교원의 자질향상을 위한 교육 및 연수를 정기적으로 실시하여야 한다.", "② 국가 및 지방자치단체는 특수교육대상자의 통합교육을 지원하기 위하여 일반학교의 교원에 대하여 특수교육 관련 교육 및 연수를 정기적으로 실시하여야 한다.", "③ 제1항과 제2항에 따른 교육 및 연수 과정에는 특수교육대상자 인권의 존중에 관한 내용이 포함되어야 한다. <신설 2013. 12. 30.>", "④ 제1항과 제2항에 따른 교육 및 연수에 필요한 사항은 대통령령으로 정한다. <개정 2013. 12. 30.>"]}, {"no": "제9조", "title": "특수교육대상자의 권리와 의무의 안내", "lines": ["국가 및 지방자치단체는 제15조제1항 각 호의 장애를 가지고 있는 사람을 알게 되거나 제15조에 따라 특수교육대상자를 선정한 경우에는 2주일 이내에 보호자에게 해당 사실과 의무교육 또는 무상교육을 받을 권리 및 보호자의 권리ㆍ책임 등을 통보하여야 한다. <개정 2021. 3. 23.>"]}, {"no": "제10조", "title": "특수교육운영위원회", "lines": ["① 제5조에 따른 국가 및 지방자치단체의 업무수행에 관한 주요 사항을 심의하기 위하여 교육부장관 소속으로 중앙특수교육운영위원회를, 교육감 소속으로 시ㆍ도특수교육운영위원회를, 교육장 소속으로 시ㆍ군ㆍ구특수교육운영위원회를 각각 둔다. <개정 2008. 2. 29., 2013. 3. 23.>", "② 제1항에 따른 중앙특수교육운영위원회의 구성ㆍ운영 등에 관하여 필요한 사항은 대통령령으로, 시ㆍ도특수교육운영위원회 및 시ㆍ군ㆍ구특수교육운영위원회의 구성ㆍ운영 등에 관하여는 특별시ㆍ광역시ㆍ특별자치시ㆍ도 및 특별자치도(이하 “시ㆍ도”라 한다)의 교육규칙으로 각각 정한다. <개정 2019. 12. 10.>"]}, {"no": "제11조", "title": "특수교육지원센터의 설치ㆍ운영", "lines": ["① 교육감은 특수교육대상자의 조기발견, 특수교육대상자의 진단ㆍ평가, 정보관리, 특수교육 연수, 교수ㆍ학습활동의 지원, 특수교육 관련서비스 지원, 순회교육 등을 담당하는 특수교육지원센터를 시ㆍ도 교육청 및 모든 하급교육행정기관에 설치ㆍ운영하여야 한다. <개정 2019. 12. 10.>", "② 제1항에 따른 특수교육지원센터는 시ㆍ도 교육청, 하급교육행정기관이나 특수학교, 특수학급이 설치된 일반 초ㆍ중ㆍ고등학교 또는 관할 지역의 관공서(장애인복지관을 포함한다) 등 특수교육대상자를 비롯한 지역주민의 접근이 편리한 곳에 설치하여야 한다. <개정 2019. 12. 10.>", "③ 특수교육지원센터의 설치ㆍ운영 등에 필요한 사항은 대통령령으로 정한다. <개정 2019. 12. 10.>"]}, {"no": "제12조", "title": "특수교육에 관한 연차보고서", "lines": ["① 교육부장관은 특수교육의 주요 현황과 정책에 관한 보고서를 매년 정기국회 개회 전까지 국회에 제출하여야 한다. <개정 2019. 12. 10., 2021. 12. 28.>", "② 제1항에 따른 보고서에는 제13조제3항에 따른 특수교육대상자의 인권침해 실태조사 결과가 포함되어야 한다. <신설 2019. 12. 10.>"], "next": {"date": "2027. 1. 8.", "title": "특수교육에 관한 연차보고서", "lines": ["① 교육부장관은 특수교육의 주요 현황과 정책에 관한 보고서를 매년 정기국회 개회 전까지 국회에 제출하여야 한다. <개정 2019. 12. 10., 2021. 12. 28.>", "② 교육감은 매년 특수교육 운영계획을 수립하여 교육부장관에게 제출하여야 한다. 이 경우 제27조에 따른 특수학교의 학급 및 각급학교의 특수학급 설치에 관한 연차별 계획을 포함하여야 한다. <신설 2026. 7. 7.>", "③ 제1항에 따른 보고서에는 제2항에 따른 특수교육 운영계획과 제13조제3항에 따른 특수교육대상자의 인권침해 실태조사 결과가 포함되어야 한다. <신설 2019. 12. 10., 2026. 7. 7.>"]}}, {"no": "제13조", "title": "특수교육 실태조사", "lines": ["① 교육부장관은 특수교육대상자의 배치계획ㆍ특수교육교원의 수급계획 등 특수교육정책의 수립을 위한 실태조사를 3년마다 실시하고 그 결과를 공표하여야 한다. <개정 2008. 2. 29., 2013. 3. 23., 2015. 12. 22.>", "② 교육부장관은 대학에 취학하는 장애학생의 교육여건을 개선하기 위하여 장애학생의 교육복지 실태조사를 3년마다 실시하고 그 결과를 공표하여야 한다. <개정 2008. 2. 29., 2013. 3. 23., 2015. 12. 22., 2022. 10. 18.>", "③ 교육감은 특수교육대상자의 인권보호를 위하여 인권침해 실태에 관한 조사를 대통령령으로 정하는 바에 따라 매년 실시하여 그 결과를 교육부장관에게 보고하여야 한다. <신설 2019. 12. 10.>", "④ 교육부장관 및 교육감은 제1항부터 제3항까지의 규정에 따른 실태조사를 위하여 필요한 경우 관계 중앙행정기관의 장, 지방자치단체의 장 및 「공공기관의 운영에 관한 법률」에 따른 공공기관의 장, 대학의 장, 그 밖의 관련 법인 또는 단체의 장에 대하여 자료의 제출 또는 의견의 진술을 요청할 수 있다. 이 경우 요청을 받은 자는 정당한 사유가 없으면 이에 협조하여야 한다. <신설 2015. 12. 22., 2019. 12. 10.>", "⑤ 제1항부터 제3항까지의 규정에 따른 조사의 내용과 방법, 그 밖에 조사에 필요한 사항은 대통령령으로 정한다. <개정 2015. 12. 22., 2019. 12. 10.>"], "next": {"date": "2027. 1. 1.", "title": "특수교육 실태조사ㆍ평가", "lines": ["① 교육부장관은 특수교육대상자의 배치계획ㆍ특수교육교원의 수급계획 등 특수교육정책의 수립을 위한 실태조사를 3년마다 실시하고 그 결과를 공표하여야 한다. <개정 2008. 2. 29., 2013. 3. 23., 2015. 12. 22.>", "② 교육부장관은 대학에 취학하는 장애학생의 교육여건을 개선하기 위하여 장애학생의 교육복지 실태조사를 3년마다 실시하고 그 결과를 평가하여 공표하여야 한다. <개정 2008. 2. 29., 2013. 3. 23., 2015. 12. 22., 2022. 10. 18., 2026. 6. 2.>", "③ 교육감은 특수교육대상자의 인권보호를 위하여 인권침해 실태에 관한 조사를 대통령령으로 정하는 바에 따라 매년 실시하여 그 결과를 교육부장관에게 보고하여야 한다. <신설 2019. 12. 10.>", "④ 교육부장관 및 교육감은 제1항부터 제3항까지에 따른 실태조사 또는 평가를 위하여 필요한 경우 관계 중앙행정기관의 장, 지방자치단체의 장 및 「공공기관의 운영에 관한 법률」에 따른 공공기관의 장, 대학의 장, 그 밖의 관련 법인 또는 단체의 장에 대하여 자료의 제출 또는 의견의 진술을 요청할 수 있다. 이 경우 요청을 받은 자는 정당한 사유가 없으면 이에 협조하여야 한다. <신설 2015. 12. 22., 2019. 12. 10., 2026. 6. 2.>", "⑤ 제1항부터 제3항까지에 따른 조사 또는 평가의 내용과 방법, 그 밖에 조사 또는 평가에 필요한 사항은 대통령령으로 정한다. <개정 2015. 12. 22., 2019. 12. 10., 2026. 6. 2.>", "[제목개정 2026. 6. 2.]"]}}, {"no": "제13조의2", "title": "인권침해 사건 신고시스템의 구축ㆍ운영 등", "lines": ["① 특수교육대상자에 대한 인권침해 현장을 보거나 그 사실을 알게 된 자는 학교 등 관계 기관에 이를 즉시 신고하여야 한다.", "② 교육감은 특수교육대상자에 대한 인권침해 사건의 신속한 신고 및 발견을 위하여 신고시스템을 구축ㆍ운영하여야 한다.", "③ 교육감은 제2항에 따른 신고시스템을 통하여 인권침해 사건을 접수한 때에는 소속 공무원으로 하여금 해당 인권침해 사건을 조사하게 할 수 있다. 이 경우 조사의 방법ㆍ절차 등은 대통령령으로 정한다.", "④ 교육감은 제3항에 따른 인권침해 사건 조사 결과를 교육부장관에게 보고하여야 한다.", "[본조신설 2019. 12. 10.]"]}]}, {"no": "제3장", "title": "특수교육대상자의 선정 및 학교배치 등", "arts": [{"no": "제14조", "title": "장애의 조기발견 등", "lines": ["① 교육장 또는 교육감은 영유아의 장애 및 장애 가능성을 조기에 발견하기 위하여 지역주민과 관련 기관을 대상으로 홍보를 실시하고, 해당 지역 내 보건소와 병원 또는 의원(醫院)에서 선별검사를 무상으로 실시하여야 한다.", "② 교육장 또는 교육감은 제1항에 따른 선별검사를 효율적으로 실시하기 위하여 지방자치단체 및 보건소와 병ㆍ의원 간에 긴밀한 협조체제를 구축하여야 한다.", "③ 보호자 또는 각급학교의 장은 제15조제1항 각 호에 따른 장애를 가지고 있거나 장애를 가지고 있다고 의심되는 영유아 및 학생을 발견한 때에는 교육장 또는 교육감에게 진단ㆍ평가를 의뢰하여야 한다. 다만, 각급학교의 장이 진단ㆍ평가를 의뢰하는 경우에는 보호자의 사전 동의를 받아야 한다.", "④ 교육장 또는 교육감은 제3항에 따라 진단ㆍ평가를 의뢰받은 경우 즉시 특수교육지원센터에 회부하여 진단ㆍ평가를 실시하고, 그 진단ㆍ평가의 결과를 해당 영유아 및 학생의 보호자에게 통보하여야 한다.", "⑤ 제1항의 선별검사의 절차와 내용, 그 밖에 검사에 필요한 사항과 제3항의 사전 동의 절차 및 제4항에 따른 통보 절차에 필요한 사항은 대통령령으로 정한다."]}, {"no": "제15조", "title": "특수교육대상자의 선정", "lines": ["① 교육장 또는 교육감은 다음 각 호의 어느 하나에 해당하는 사람 중 특수교육이 필요한 사람으로 진단ㆍ평가된 사람을 특수교육대상자로 선정한다. <개정 2016. 2. 3., 2021. 3. 23., 2021. 12. 28.>", "1. 시각장애", "2. 청각장애", "3. 지적장애", "4. 지체장애", "5. 정서ㆍ행동장애", "6. 자폐성장애(이와 관련된 장애를 포함한다)", "7. 의사소통장애", "8. 학습장애", "9. 건강장애", "10. 발달지체", "11. 그 밖에 두 가지 이상의 장애가 있는 경우 등 대통령령으로 정하는 장애", "② 교육장 또는 교육감이 제1항에 따라 특수교육대상자를 선정할 때에는 제16조제1항에 따른 진단ㆍ평가결과를 기초로 하여 고등학교 과정은 교육감이 시ㆍ도특수교육운영위원회의 심사를 거쳐, 중학교 과정 이하의 각급학교는 교육장이 시ㆍ군ㆍ구특수교육운영위원회의 심사를 거쳐 이를 결정한다."]}, {"no": "제16조", "title": "특수교육대상자의 선정절차 및 교육지원 내용의 결정", "lines": ["① 특수교육지원센터는 진단ㆍ평가가 회부된 후 30일 이내에 진단ㆍ평가를 시행하여야 한다.", "② 특수교육지원센터는 제1항에 따른 진단ㆍ평가를 통하여 특수교육대상자로의 선정 여부 및 필요한 교육지원 내용에 대한 최종의견을 작성하여 교육장 또는 교육감에게 보고하여야 한다.", "③ 교육장 또는 교육감은 특수교육지원센터로부터 최종의견을 통지받은 때부터 2주일 이내에 특수교육대상자로의 선정 여부 및 제공할 교육지원 내용을 결정하여 부모 등 보호자에게 서면으로 통지하여야 한다. 교육지원 내용에는 특수교육, 진로 및 직업교육, 특수교육 관련서비스 등 구체적인 내용이 포함되어야 한다.", "④ 제1항에 따른 진단ㆍ평가의 과정에서는 부모 등 보호자의 의견진술의 기회가 충분히 보장되어야 한다."]}, {"no": "제17조", "title": "특수교육대상자의 배치 및 교육", "lines": ["① 교육장 또는 교육감은 제15조에 따라 특수교육대상자로 선정된 사람을 해당 특수교육운영위원회의 심사를 거쳐 다음 각 호의 어느 하나에 배치하여 교육하여야 한다. <개정 2021. 3. 23.>", "1. 일반학교의 일반학급", "2. 일반학교의 특수학급", "3. 특수학교", "② 교육장 또는 교육감은 제1항에 따라 특수교육대상자를 배치할 때에는 특수교육대상자의 장애정도ㆍ능력ㆍ보호자의 의견 등을 종합적으로 판단하여 거주지에서 가장 가까운 곳에 배치하여야 한다.", "③ 교육감이 관할 구역 내에 거주하는 특수교육대상자를 다른 시ㆍ도에 소재하는 각급학교 등에 배치하고자 할 때에는 해당 시ㆍ도 교육감(국립학교의 경우에는 해당 학교의 장을 말한다)과 협의하여야 한다.", "④ 제3항에 따라 특수교육대상자의 배치를 요구받은 교육감 또는 국립학교의 장은 대통령령으로 정하는 특별한 사유가 없으면 그 요구를 따라야 한다. <개정 2021. 3. 23.>", "⑤ 제1항부터 제4항까지의 규정에 따른 특수교육대상자의 배치 등에 관하여 필요한 사항은 대통령령으로 정한다."]}]}, {"no": "제4장", "title": "영유아 및 초ㆍ중등교육", "arts": [{"no": "제18조", "title": "장애영아의 교육지원", "lines": ["① 만 3세 미만의 장애영아의 보호자는 조기교육이 필요한 경우 교육장에게 교육을 요구할 수 있다.", "② 제1항에 따른 요구를 받은 교육장은 특수교육지원센터의 진단ㆍ평가결과를 기초로 만 3세 미만의 장애영아를 특수학교의 유치원과정, 영아학급 또는 특수교육지원센터에 배치할 수 있다.", "③ 제2항에 따라 배치된 장애영아가 의료기관, 복지시설 또는 가정 등에 있을 경우에는 특수교육교원 및 특수교육 관련서비스 담당 인력 등으로 하여금 순회교육을 제공하도록 할 수 있다.", "④ 국가 및 지방자치단체는 장애영아를 위한 교육여건을 개선하고 설비를 정비하기 위하여 노력하여야 한다.", "⑤ 그 밖에 장애영아의 교육지원에 필요한 사항은 대통령령으로 정한다."]}, {"no": "제19조", "title": "보호자의 의무 등", "lines": ["① 특수교육대상자의 보호자는 그 보호하는 자녀에 대하여 제3조제1항에 따른 의무교육의 기회를 보호하고 존중하여야 한다.", "② 부득이한 사유로 취학이 불가능한 의무교육대상자에 대하여는 대통령령으로 정하는 바에 따라 제1항에 따른 취학의무를 면제하거나 유예할 수 있다. 다만, 만 3세부터 만 5세까지의 특수교육대상자가 「영유아보육법」에 따라 설치된 어린이집 중 대통령령으로 정하는 일정한 교육 요건을 갖춘 어린이집을 이용하는 경우에는 제1항에서 정하는 유치원 의무교육을 받고 있는 것으로 본다. <개정 2011. 6. 7.>", "③ 제2항에 따라 취학의무를 면제 또는 유예 받은 사람이 다시 취학하고자 하는 경우에는 대통령령으로 정하는 바에 따라 취학하게 할 수 있다. <개정 2021. 3. 23.>"]}, {"no": "제20조", "title": "교육과정의 운영 등", "lines": ["① 특수교육기관의 유치원ㆍ초등학교ㆍ중학교ㆍ고등학교과정의 교육과정은 장애의 유형 및 정도를 고려하여 국가교육위원회가 정하고, 영아교육과정과 전공과의 교육과정은 교육감의 승인을 받아 학교장이 정한다. <개정 2008. 2. 29., 2013. 3. 23., 2019. 12. 10., 2021. 7. 20.>", "② 특수교육기관의 장 및 특수교육대상자가 배치된 일반학교의 장은 제1항에 따른 교육과정의 범위 안에서 특수교육대상자 개인의 장애유형과 정도, 연령, 현재 및 미래의 교육요구 등을 고려하여 교육과정의 내용을 조정하여 운영할 수 있다. <개정 2019. 12. 10.>", "③ 특수학교의 장은 교육감의 승인을 받아 유치원ㆍ초등학교ㆍ중학교ㆍ고등학교과정을 통합하여 운영할 수 있다."]}, {"no": "제21조", "title": "통합교육", "lines": ["① 교육감은 특수교육대상자가 일반학교에서 또래와 함께 교육받을 수 있도록 시책을 수립ㆍ시행하여야 한다.", "② 각급학교의 장은 교육에 관한 각종 시책을 시행하는 경우 특수교육대상자가 통합교육을 원활히 받을 수 있도록 하여야 한다.", "③ 특수교육대상자가 배치된 일반학교의 장은 일반교육교원 및 특수교육교원의 협력을 통하여 차별의 예방, 교육과정의 조정, 제28조에 따른 지원인력의 배치, 교구ㆍ학습보조기ㆍ보조공학기기의 지원 및 교원연수 등을 포함한 통합교육계획을 수립ㆍ시행하여야 한다.", "④ 일반학교의 장은 제3항에 따라 통합교육을 실시하는 경우에는 제27조의 기준에 따라 특수학급을 설치ㆍ운영하고, 대통령령으로 정하는 시설ㆍ설비 및 교재ㆍ교구를 갖추어야 한다.", "⑤ 교육부장관 및 교육감은 특수교육대상자의 통합학급 교육활동을 지원하기 위하여 대통령령으로 정하는 바에 따라 특수교육교원을 둘 수 있다.", "[전문개정 2024. 2. 27.]"]}, {"no": "제22조", "title": "개별화교육", "lines": ["① 각급학교의 장은 특수교육대상자의 교육적 요구에 적합한 교육을 제공하기 위하여 보호자, 특수교육교원, 일반교육교원, 진로 및 직업교육 담당 교원, 특수교육 관련서비스 담당 인력 등으로 개별화교육지원팀을 구성한다.", "② 개별화교육지원팀은 매 학기 마다 특수교육대상자에 대한 개별화교육계획을 작성하여야 한다.", "③ 특수교육대상자가 다른 학교로 전학할 경우 또는 상급학교로 진학할 경우에는 전출학교는 전입학교에 개별화교육계획을 14일 이내에 송부하여야 한다.", "④ 특수교육교원은 제1항부터 제3항까지의 규정에 따른 업무를 수행하기 위하여 각 업무를 지원하고 조정한다.", "⑤ 제1항에 따른 개별화교육지원팀의 구성, 제2항에 따른 개별화교육계획의 수립ㆍ실시 등에 관하여 필요한 사항은 교육부령으로 정한다. <개정 2008. 2. 29., 2013. 3. 23.>"]}, {"no": "제23조", "title": "진로 및 직업교육의 지원", "lines": ["① 중학교 과정 이상의 각급학교의 장은 특수교육대상자의 특성 및 요구에 따른 진로 및 직업교육을 지원하기 위하여 직업평가ㆍ직업교육ㆍ고용지원ㆍ사후관리 등의 직업재활훈련 및 일상생활적응훈련ㆍ사회적응훈련 등의 자립생활훈련을 실시하고, 대통령령으로 정하는 자격이 있는 진로 및 직업교육을 담당하는 전문인력을 두어야 한다.", "② 중학교 과정 이상의 각급학교의 장은 대통령령으로 정하는 기준에 따라 진로 및 직업교육의 실시에 필요한 시설ㆍ설비를 마련하여야 한다.", "③ 특수교육지원센터는 특수교육대상자에게 효과적인 진로 및 직업교육을 지원하기 위하여 대통령령으로 정하는 바에 따라 관련 기관과의 협의체를 구성하여야 한다."]}, {"no": "제24조", "title": "전공과의 설치ㆍ운영", "lines": ["① 특수교육기관에는 고등학교 과정을 졸업한 특수교육대상자에게 진로 및 직업교육을 제공하기 위하여 수업연한 1년 이상의 전공과를 설치ㆍ운영할 수 있다.", "② 교육부장관 및 교육감은 지역별 또는 장애유형별로 전공과를 설치할 교육기관을 지정할 수 있다. <개정 2008. 2. 29., 2013. 3. 23.>", "③ 전공과를 설치한 각급학교는 「학점인정 등에 관한 법률」 제7조에 따라 학점인정을 받을 수 있다.", "④ 제1항 및 제2항에 따른 전공과의 시설ㆍ설비 기준, 전공과의 운영 및 담당 인력의 배치 기준 등에 관하여 필요한 사항은 대통령령으로 정한다."]}, {"no": "제25조", "title": "순회교육 등", "lines": ["① 교육장 또는 교육감은 일반학교에서 통합교육을 받고 있는 특수교육대상자를 지원하기 위하여 일반학교 및 특수교육지원센터에 특수교육교원 및 특수교육 관련서비스 담당 인력을 배치하여 순회교육을 실시하여야 한다.", "② 교육부장관 또는 교육감은 장ㆍ단기 결석이 불가피한 특수교육대상자의 교육을 위하여 필요한 경우 순회교육 또는 원격수업을 실시하여야 한다. <개정 2020. 10. 20.>", "③ 교육부장관 또는 교육감은 이동이나 운동기능의 심한 장애로 인하여 각급학교에서 교육을 받기 곤란하거나 불가능하여 복지시설ㆍ의료기관 또는 가정 등에 거주하는 특수교육대상자의 교육을 위하여 필요한 경우 순회교육을 실시하여야 한다. <개정 2020. 10. 20.>", "④ 교육장 또는 교육감은 제3항에 따른 순회교육의 실시를 위하여 의료기관 및 복지시설 등에 학급을 설치ㆍ운영하고 이에 필요한 담당 교원을 배치하는 등 필요한 조치를 강구하며, 학생들이 원만히 학교로 복귀할 수 있도록 심리적ㆍ정서적 지원을 하여야 한다. <신설 2015. 12. 22., 2021. 12. 28.>", "⑤ 국가 및 지방자치단체는 제4항에 따라 학급이 설치ㆍ운영 중인 의료기관 및 복지시설 등에 대하여 국립 또는 공립 특수교육기관 수준의 교육이 이루어질 수 있도록 대통령령으로 정하는 바에 따라 행정적ㆍ재정적 지원을 하여야 한다. <신설 2015. 12. 22., 2021. 12. 28.>", "⑥ 제1항부터 제4항까지의 규정에 따른 순회교육의 수업일수 등 순회교육의 운영과 제2항에 따른 원격수업의 운영에 필요한 사항은 대통령령으로 정한다. <개정 2015. 12. 22., 2020. 10. 20.>"]}, {"no": "제26조", "title": "방과후 과정을 운영하는 유치원 과정의 교육기관", "lines": ["①「유아교육법」 제2조제6호에 따른 방과후 과정을 운영하는 유치원 과정의 교육기관에 특수교육대상자가 배치되는 경우 해당 각급학교의 장은 특수교육대상자에 대한 방과후 과정 운영을 담당할 인력을 학급당 1인 이상 추가로 배치할 수 있다. <개정 2012. 3. 21.>", "② 제1항에 따른 방과후 과정 담당 인력의 자격기준, 운영방법 등에 관하여 필요한 사항은 대통령령으로 정한다. <개정 2012. 3. 21.>", "[제목개정 2012. 3. 21.]"]}, {"no": "제27조", "title": "특수학교의 학급 및 각급학교의 특수학급 설치 기준", "lines": ["① 특수학교와 각급학교의 장은 다음 각 호의 기준에 따라 학급 및 특수학급을 설치하여야 한다.", "1. 유치원 과정의 경우 : 특수교육대상자가 1인 이상 4인 이하인 경우 1학급을 설치하고, 4인을 초과하는 경우 2개 이상의 학급을 설치한다.", "2. 초등학교ㆍ중학교 과정의 경우 : 특수교육대상자가 1인 이상 6인 이하인 경우 1학급을 설치하고, 6인을 초과하는 경우 2개 이상의 학급을 설치한다.", "3. 고등학교 과정의 경우 : 특수교육대상자가 1인 이상 7인 이하인 경우 1학급을 설치하고, 7인을 초과하는 경우 2개 이상의 학급을 설치한다.", "② 교육감은 제1항에도 불구하고 두 가지 이상의 장애를 지니면서 장애의 정도가 심한 특수교육대상자가 배치된 학급의 경우에는 2분의 1의 범위에서 학급 설치 기준을 하향 조정할 수 있으며, 순회교육의 경우 장애의 정도와 유형에 따라 학급 설치 기준을 하향 조정할 수 있다. <개정 2021. 12. 28.>", "③ 특수학교와 특수학급에 두는 특수교육교원의 배치기준은 대통령령으로 정한다."]}, {"no": "제28조", "title": "특수교육 관련서비스", "lines": ["① 교육감은 특수교육대상자와 그 가족에 대하여 가족상담, 부모교육 등 가족지원을 제공하여야 한다. <개정 2019. 12. 10.>", "② 교육감은 특수교육대상자에게 필요한 경우 물리치료, 작업치료 등 치료지원을 제공하여야 한다. 이 경우 특수교육대상자의 장애유형과 장애정도를 고려한 맞춤형 치료지원이 제공될 수 있도록 하여야 한다. <개정 2021. 3. 23., 2021. 12. 28.>", "③ 교육감은 각급학교의 장이 특수교육대상자를 위하여 필요한 경우 지원인력을 제공할 수 있도록 지원하여야 한다. <개정 2021. 12. 28.>", "④ 각급학교의 장은 특수교육대상자의 교육을 위하여 필요한 장애인용 각종 교구, 각종 학습보조기, 보조공학기기 등의 설비를 제공하여야 한다.", "⑤ 각급학교의 장은 특수교육대상자의 취학 편의를 위하여 통학차량 지원, 통학비 지원, 통학 지원인력의 배치 등 통학 지원 대책을 마련하여야 한다. <개정 2021. 12. 28.>", "⑥ 각급학교의 장은 특수교육대상자의 생활지도 및 보호를 위하여 기숙사를 설치ㆍ운영할 수 있다. 기숙사를 설치ㆍ운영하는 특수학교에는 특수교육대상자의 생활지도 및 보호를 위하여 교육부령으로 정하는 자격이 있는 생활지도원을 두는 외에 간호사 또는 간호조무사를 두어야 한다. <개정 2008. 2. 29., 2013. 3. 23., 2013. 4. 5.>", "⑦ 제6항의 생활지도원과 간호사 또는 간호조무사의 배치기준은 국립학교의 경우 교육부령으로, 공립 및 사립 학교의 경우에는 시ㆍ도 교육규칙으로 각각 정한다. <신설 2013. 4. 5.>", "⑧ 각급학교의 장은 각급학교에서 제공하는 각종 정보(교육기관에서 운영하는 인터넷 홈페이지를 포함한다)를 특수교육대상자에게 제공하는 경우 특수교육대상자의 장애유형에 적합한 방식으로 제공하여야 한다. <개정 2013. 4. 5.>", "⑨ 교육감(국립학교의 경우에는 해당 학교의 장을 말한다)은 「의료법」 제3조에 따른 의료기관과 협의하여 해당 의료기관에 소속된 같은 법 제2조에 따른 의료인으로 하여금 학교 내에서 특수교육대상자에게 의료적 지원을 제공하도록 할 수 있다. 이 경우 의료인이 제공하는 의료적 지원의 구체적 범위는 대통령령으로 정한다. <신설 2024. 2. 27.>", "⑩ 제1항부터 제9항까지의 규정에 따른 특수교육 관련서비스의 제공을 위하여 필요한 사항은 대통령령으로 정한다. <개정 2013. 4. 5., 2024. 2. 27.>"]}, {"no": "제28조의2", "title": "특수교육대상자 행동중재 지원 등", "lines": ["① 교육부장관 및 교육감은 특수학교와 특수교육지원센터에 특수교육대상자에 대한 행동중재계획의 수립ㆍ실행ㆍ평가 등을 담당하는 행동중재전문가를 둔다.", "② 교육부장관 및 교육감은 특수학교와 특수교육지원센터에 행동중재전문가를 지원하는 전문인력을 둘 수 있다.", "③ 교육감은 특수교육대상자에 대한 행동중재를 효율적으로 지원하기 위하여 특수교육지원센터에 행동중재지원팀을 둘 수 있다.", "④ 제1항에 따른 행동중재전문가의 자격 및 업무 범위, 제2항에 따른 전문인력의 자격, 제3항에 따른 행동중재지원팀의 구성ㆍ운영 등에 필요한 사항은 대통령령으로 정한다.", "[본조신설 2026. 6. 2.]"], "futureOnly": "2027. 6. 3."}]}, {"no": "제5장", "title": "고등교육", "arts": [{"no": "제29조", "title": "특별지원위원회", "lines": ["① 대학의 장은 다음 각 호의 사항을 심의ㆍ결정하기 위하여 특별지원위원회(이하 “특별지원위원회”라 한다)를 설치ㆍ운영하여야 한다. <개정 2022. 10. 18.>", "1. 대학의 장애학생 지원을 위한 계획", "2. 심사청구 사건에 대한 심사ㆍ결정", "3. 그 밖에 장애학생 지원을 위하여 대통령령으로 정하는 사항", "② 특별지원위원회의 위원은 장애에 대한 이해와 경험이 풍부한 사람, 관계 교직원 또는 재학 중인 장애학생 중에서 대통령령으로 정하는 바에 따라 대학의 장이 임명한다. <신설 2022. 10. 18.>", "③ 특별지원위원회의 설치ㆍ운영 등에 관하여 필요한 사항은 대통령령으로 정한다. <개정 2022. 10. 18.>"]}, {"no": "제30조", "title": "장애학생지원센터", "lines": ["① 대학의 장은 장애학생의 교육 및 생활에 관한 지원을 총괄ㆍ담당하는 장애학생지원센터를 설치ㆍ운영하여야 한다. 다만, 장애학생이 재학하고 있지 아니하거나 대통령령으로 정하는 바에 따라 장애학생 수가 일정 인원 이하인 소규모 대학 등은 장애학생 지원부서를 둠으로써 이를 갈음할 수 있다. <개정 2021. 3. 23., 2022. 10. 18.>", "② 장애학생지원센터(제1항에 따라 장애학생 지원부서로 갈음하는 경우에는 이를 말한다. 이하 같다)는 다음 각 호의 업무를 담당한다. <개정 2021. 3. 23., 2021. 12. 28., 2022. 10. 18.>", "1. 장애학생을 위한 각종 지원에 관한 사항", "2. 제31조에서 정하는 편의제공에 관한 사항", "2의2. 「장애인복지법」 제25조제2항에 따른 대학 내 장애인 인식개선교육 실시에 관한 사항", "3. 교직원ㆍ지원인력 등에 대한 교육에 관한 사항", "4. 장애학생 교육복지의 실태조사에 관한 사항", "5. 그 밖에 대학의 장이 회의에 부치는 사항", "③ 장애학생지원센터의 장은 장애인 인권에 대하여 전문적인 지식과 경험이 있는 사람으로서 대통령령으로 정하는 자격을 갖추어야 한다. <신설 2022. 10. 18.>", "④ 장애학생지원센터의 설치ㆍ운영에 관하여 필요한 사항은 대통령령으로 정한다. <개정 2022. 10. 18.>"]}, {"no": "제30조의2", "title": "개인별 교육지원계획", "lines": ["① 장애학생지원센터의 장은 장애학생의 개인별 수요를 조사하여 그 결과를 특별지원위원회에 보고하여야 한다.", "② 장애학생지원센터의 장은 제1항의 보고사항을 반영하여 매 학기마다 장애학생에 대한 개인별 교육지원계획을 작성하여 대학의 장에게 보고하여야 한다.", "③ 대학의 장은 제2항에 따른 개인별 교육지원계획에 따라 장애학생을 지원하여야 한다.", "④ 장애학생의 개인별 수요 조사 및 교육지원계획 수립에 관하여 필요한 사항은 대통령령으로 정한다.", "[본조신설 2022. 10. 18.]"]}, {"no": "제31조", "title": "편의제공 등", "lines": ["① 대학의 장은 해당 학교에 재학 중인 장애학생의 교육활동의 편의를 위하여 다음 각 호의 수단을 적극적으로 강구하고 제공하여야 한다. <개정 2021. 12. 28., 2022. 10. 18.>", "1. 각종 학습보조기기 및 보조공학기기 등의 물적 지원", "2. 교육지원인력 배치 등의 인적 지원", "3. 취학편의 지원", "4. 정보접근 지원", "5. 「장애인ㆍ노인ㆍ임산부 등의 편의증진보장에 관한 법률」 제2조제2호에 따른 편의시설 설치 지원", "6. 그 밖에 장애학생의 교육활동에 필요한 것으로서 특별지원위원회에서 정하는 사항에 대한 지원", "② 대학의 장은 해당 학교의 입학전형절차에서 장애수험생의 수험의 편의를 위하여 「장애인차별금지 및 권리구제 등에 관한 법률」 제14조제1항 각 호의 수단 중 수험편의에 필요한 수단을 적극적으로 강구하고 제공하여야 한다. <신설 2015. 12. 22.>", "③ 국가 및 지방자치단체는 제1항 및 제2항에 따라 필요한 경비를 예산의 범위 안에서 지원하여야 한다. <개정 2015. 12. 22.>", "④ 대학의 장은 제1항제4호에 따른 정보접근 지원을 위하여 수업 중 활용하는 영상물에 장애학생을 위한 화면해설, 폐쇄자막 또는 수어통역 등 대통령령으로 정하는 편의를 제공하여야 한다. <신설 2021. 12. 28.>"]}, {"no": "제32조", "title": "학칙 등의 작성", "lines": ["대학의 장은 이 법에서 정하는 장애학생의 지원 등에 관하여 다음 각 호에 해당하는 내용을 학칙에 규정하여야 한다. <개정 2021. 12. 28.>", "1. 장애학생의 학습지원에 관한 사항", "2. 장애학생의 입학시험을 포함한 입학전형 관리에 관한 사항", "3. 수업 중 활용하는 영상물에 장애학생의 정보접근 지원을 위한 편의제공에 관한 사항", "4. 그 밖에 장애학생의 교육활동 편의를 위하여 필요한 사항"]}, {"no": "제33조", "title": "장애인고등교육지원센터", "lines": ["① 교육부장관은 대학에 재학하는 장애학생에 대한 통합적 지원을 위하여 장애인고등교육지원센터(이하 “고등교육센터”라 한다)를 설치하거나 지정하여야 한다.", "② 고등교육센터는 다음 각 호의 업무를 수행한다.", "1. 장애학생 고등교육 관련 연구ㆍ분석", "2. 장애학생 고등교육 지원 관련 자료 개발ㆍ보급", "3. 장애학생의 진로ㆍ취업 지원", "4. 장애학생 지원에 대한 교직원 등 연수 지원", "5. 제13조에 따른 장애학생 교육복지 실태조사 운영 및 컨설팅", "6. 제30조에 따른 장애학생지원센터 운영 지원", "7. 그 밖에 장애학생 고등교육 지원을 위하여 필요한 사업", "③ 국가는 제1항 및 제2항에 따른 고등교육센터의 설치ㆍ지정 및 운영에 필요한 경비를 지원할 수 있다.", "④ 고등교육센터의 설치ㆍ지정 및 운영 등에 필요한 사항은 대통령령으로 정한다.", "[본조신설 2022. 10. 18.]"]}, {"no": "제34조", "title": "", "lines": ["삭제 <2016. 5. 29.>"]}]}, {"no": "제6장", "title": "보칙 및 벌칙", "arts": [{"no": "제35조", "title": "대학의 심사청구 등", "lines": ["① 장애학생 및 그 보호자는 대학에 이 법에 따른 각종 지원조치를 제공할 것을 서면으로 신청할 수 있다.", "② 대학의 장은 제1항에 따른 신청에 대하여 2주 이내에 지원 여부 및 그 사유를 신청자에게 서면으로 통지하여야 한다.", "③ 장애학생 및 그 보호자는 제1항에 따른 신청에 대한 대학의 결정(부작위 및 거부를 포함한다)과 이 법을 위반하는 대학의 장 또는 교직원의 행위에 대하여 특별지원위원회에 심사청구를 할 수 있다.", "④ 특별지원위원회는 제3항의 심사청구에 관하여 2주 이내에 결정을 하여야 한다.", "⑤ 제3항에 따른 심사에서는 청구인에게 의견진술 기회를 주어야 한다.", "⑥ 대학의 장, 교직원, 그 밖의 관계자는 제4항에 따른 결정에 따라야 한다.", "⑦ 그 밖에 특별지원위원회에 대한 심사청구에 관하여 필요한 사항은 대통령령으로 정한다."]}, {"no": "제36조", "title": "고등학교 과정 이하의 심사청구", "lines": ["① 특수교육대상자 또는 그 보호자는 다음 각 호의 어느 하나에 해당하는 교육장, 교육감 또는 각급학교의 장의 조치에 대하여 이의가 있을 때에는 해당 시ㆍ군ㆍ구특수교육운영위원회 또는 시ㆍ도특수교육운영위원회에 심사청구를 할 수 있다.", "1. 제15조제1항에 따른 특수교육대상자의 선정", "2. 제16조제3항에 따른 교육지원 내용의 결정 사항", "3. 제17조제1항에 따른 학교에의 배치", "4. 제4조를 위반하는 부당한 차별", "② 제17조제1항에 따라 특수교육대상자를 배치받은 각급학교의 장은 이에 따를 수 없는 특별한 사유가 있거나 배치받은 특수교육대상자가 3개월 이상 학교생활에의 적응에 상당한 어려움이 있는 경우에는 해당 시ㆍ군ㆍ구특수교육운영위원회 또는 시ㆍ도특수교육운영위원회에 심사청구를 할 수 있다. <개정 2021. 3. 23.>", "③ 시ㆍ군ㆍ구특수교육운영위원회 또는 시ㆍ도특수교육운영위원회는 제1항과 제2항의 심사청구를 받은 때에는 이를 심사하여 30일 이내에 그 결정을 청구인에게 통보하여야 한다.", "④ 제3항의 심사에서는 청구인에게 의견진술의 기회를 주어야 한다.", "⑤ 교육장, 교육감, 각급학교의 const LAW_TERMS=["특수교육 관련서비스","개별화교육계획","통합교육계획","진로 및 직업교육","직업재활훈련","자립생활훈련","의무교육","무상","진단ㆍ평가","선별검사","순회교육","원격수업","전공과","가족지원","치료지원","지원인력","기숙사","생활지도원","간호사 또는 간호조무사","통학 지원","학습보조기","보조공학기기","서면","행정심판","심사청구","의견진술","대통령령","교육부령","교육규칙","실태조사","인권침해","최종의견","조기발견","취학지도","특수교육종합계획","특성화특수학교","정보접근","화면해설","폐쇄자막","수어통역","편의제공","개인별 교육지원계획","학칙","통합학급","특수학급","특수학교","일반학급","장애영아","거주지에서 가장 가까운 곳","행동중재전문가"];
const NUM_RE="만 \\d+세(?:부터 만 \\d+세)?|만 \\d+세미만|\\d+년마다|\\d+년 이상|\\d+주일 이내|\\d+주 이내|\\d+일 이내|\\d+개월 이상|\\d+인 이상 \\d+인 이하|\\d+인을 초과|\\d+분의 \\d+|\\d+년 이하|\\d+천만원 이하|\\d+만원 이하|매 학기|매년";
const BLANK_RE=new RegExp(`(${ACTORS.map(a=>a.re).join("|")})|(${NUM_RE})|(${LAW_TERMS.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")})`,"g");

const lawNote=s=>s.replace(/(<(?:개정|신설|전문개정|제목개정|본조신설)[^>]*>|\[[^\]]*(?:개정|신설|이동)[^\]]*\])/g,"\u0000$1\u0001");
function lawLineHTML(text,hl){
  // 개정 표시는 회색 작은 글씨, 나머지는 형광펜
  return lawNote(text).split(/(\u0000[^\u0001]*\u0001)/).map(part=>{
    if(part.startsWith("\u0000"))return `<span class="lnote">${esc(part.slice(1,-1))}</span>`;
    let out="",last=0;ACTOR_RE.lastIndex=0;let m;
    while((m=ACTOR_RE.exec(part))){
      const gi=m.slice(1).findIndex(Boolean);const ac=ACTORS[gi];
      out+=esc(part.slice(last,m.index));
      out+=hl&&S.lawOn[ac.id]!==false?`<mark style="--hl:${ac.col}" title="${ac.name}">${esc(m[0])}</mark>`:esc(m[0]);
      last=m.index+m[0].length;
    }
    return out+esc(part.slice(last));
  }).join("");
}
const lineCls=l=>/^[①-⑳]/.test(l)?"hang":/^\d+(의\d+)?\./.test(l)?"ho":/^\[/.test(l)?"lnote blk":"";
function artBody(v,hl){
  return v.lines.map((l,i)=>i===0?(l?`<p>${lawLineHTML(l,hl)}</p>`:""):`<p class="${lineCls(l)}">${lawLineHTML(l,hl)}</p>`).join("");
}


/* ----- 소리로 듣기 (브라우저 기본 음성 읽기, Web Speech API) ----- */
const TTS_OK=typeof window!=="undefined"&&"speechSynthesis" in window&&"SpeechSynthesisUtterance" in window;
const TT={on:false,paused:false,doc:null,subj:"law",label:"",queue:[],ai:0,li:0,rate:1,voice:null};
function vScore(x){const n=x.name;return (/natural|online|neural/i.test(n)?100:0)+(/premium|enhanced|고품질|향상/i.test(n)?80:0)+(/google/i.test(n)?40:0)+(/sun-?hi|injoon|yuna|heami|hyunsu|seoyeon|jimin/i.test(n)?20:0)+(x.localService===false?10:0);}
function koVoices(){if(!TTS_OK)return[];return speechSynthesis.getVoices().filter(x=>/^ko/i.test(x.lang)).sort((a,b)=>vScore(b)-vScore(a));}
function ttsVoice(){const v=koVoices();return v[0]||null;}
function voiceLabel(x){let n=x.name.replace(/^Microsoft\s+/i,"").replace(/\s*-\s*Korean.*$/i,"").replace(/\s*\(Korean.*\)/i,"");return n+(vScore(x)>=80?" · 자연스러운 목소리":"");}
function fillVoices(){const sel=document.getElementById("voiceSel");if(!sel)return;const v=koVoices();
  if(!v.length){sel.parentElement.innerHTML='<span class="src">이 기기에는 한국어 목소리가 없어요.</span>';return;}
  sel.innerHTML=v.map((x,i)=>`<option value="${i}" ${TT.voice&&x.name===TT.voice.name?"selected":""}>${esc(voiceLabel(x))}</option>`).join("");
  sel.onchange=()=>{TT.voice=v[+sel.value];try{localStorage.setItem("imyong_voice",TT.voice.name);}catch(e){}if(TT.on&&!TT.paused){ttsCancel();ttsSpeak();}};}
if(TTS_OK){try{speechSynthesis.onvoiceschanged=()=>{TT.voice=ttsVoice();fillVoices();};TT.voice=ttsVoice();}catch(e){}}
function speakable(line){
  let s=line.replace(/<[^>]*>/g,"").replace(/\[[^\]]*\]/g,"")
    .replace(/\([一-鿿豈-﫿]+\)/g,"")
    .replace(/[「」“”‘’]/g,"").replace(/ㆍ/g,", ");
  s=s.replace(/^([①-⑳])\s*/,(m,c)=>"제"+(c.charCodeAt(0)-0x245F)+"항. ")
     .replace(/^(\d+)의(\d+)\.\s*/,"제$1호의$2. ").replace(/^(\d+)\.\s*/,"제$1호. ")
     .replace(/^([가-하])\.\s*/,"$1목. ");
  return s.trim();
}
function artUtterances(a){
  if(a.utt)return a.utt;
  const out=[`${a.no.replace(/의(\d+)$/,"의 $1")}${a.title?", "+a.title:""}.`];
  a.lines.forEach(l=>{const s=speakable(l);if(s)out.push(s);});
  return out;
}
function ttsArts(doc){return DOCS[doc].data.flatMap(c=>c.arts).filter(a=>!/^삭제/.test(a.lines[0]));}
function ttsCancel(){TT.gen=(TT.gen||0)+1;if(TTS_OK)speechSynthesis.cancel();}
function ttsStart(doc,no){
  if(!TTS_OK)return;
  ttsCancel();
  const arts=ttsArts(doc);TT.subj="law";TT.label=DOCS[doc].label;TT.on=true;TT.paused=false;TT.doc=doc;TT.queue=arts;TT.ai=Math.max(0,arts.findIndex(a=>a.no===no));TT.li=0;
  ttsSpeak();renderTtsBar();
}
function ttsSpeak(){
  if(!TT.on)return;
  const a=TT.queue[TT.ai];if(!a){ttsStop();return;}
  const lines=artUtterances(a);
  if(TT.li>=lines.length){TT.ai++;TT.li=0;ttsMark();return ttsSpeak();}
  const u=new SpeechSynthesisUtterance(lines[TT.li]);
  u.lang="ko-KR";u.rate=TT.rate;if(TT.voice)u.voice=TT.voice;
  const g=TT.gen;
  u.onend=()=>{if(g!==TT.gen||!TT.on||TT.paused)return;TT.li++;ttsSpeak();};
  u.onerror=e=>{if(g!==TT.gen||e.error==="interrupted"||e.error==="canceled")return;TT.on=false;renderTtsBar(`소리를 낼 수 없어요 (${e.error||"오류"})`);};
  speechSynthesis.speak(u);ttsMark();
}
function ttsPause(){if(!TT.on)return;TT.paused=!TT.paused;if(TT.paused)ttsCancel();else ttsSpeak();renderTtsBar();}
function ttsStop(){TT.on=false;TT.paused=false;ttsCancel();ttsMark();renderTtsBar();}
function ttsJump(d){if(!TT.on)return;ttsCancel();TT.ai=Math.min(Math.max(0,TT.ai+d),TT.queue.length-1);TT.li=0;TT.paused=false;ttsSpeak();renderTtsBar();}
function ttsRate(){const R=[0.8,1,1.2,1.5];TT.rate=R[(R.indexOf(TT.rate)+1)%R.length];if(TT.on&&!TT.paused){ttsCancel();ttsSpeak();}renderTtsBar();}
function ttsMark(){
  document.querySelectorAll(".lart.speaking").forEach(e=>e.classList.remove("speaking"));
  if(!TT.on)return;
  if(TT.subj==="law"&&(S.tab!=="read"||S.lawDoc!==TT.doc))return;
  if(TT.subj==="law"&&!S.lawQ.trim()&&S.lawMode!=="type"){const a0=TT.queue[TT.ai];if(a0){const chs=lawChs(TT.doc),pos=lawPos(TT.doc),cur=chs[pos.k]&&chs[pos.k].arts[pos.a];
    if(!cur||cur.no!==a0.no){chs.forEach((c,k)=>c.arts.forEach((a,i)=>{if(a.no===a0.no)Object.assign(pos,{k,a:i});}));render();return;}}}
  if(TT.subj==="curr"&&(S.tab!=="cread"||S.cu.ch!==TT.doc))return;
  const a=TT.queue[TT.ai];if(!a)return;const el=document.getElementById(a.el||("art-"+TT.doc+"-"+a.no));
  if(el){el.classList.add("speaking");if(TT.li===0){const r=el.getBoundingClientRect();if(r.top<60||r.top>innerHeight*0.6)scrollTo({top:r.top+scrollY-70,behavior:"smooth"});}}
}
function renderTtsBar(msg){
  let bar=document.getElementById("ttsbar");
  const show=S.view==="room"&&S.subject===TT.subj&&(TT.on||msg);
  if(!show){if(bar)bar.remove();document.body.classList.remove("has-tts");return;}
  if(!bar){bar=document.createElement("div");bar.id="ttsbar";document.body.appendChild(bar);}
  document.body.classList.add("has-tts");
  const a=TT.queue[TT.ai];
  bar.innerHTML=`<div class="in">${msg?`<span class="tmsg">${esc(msg)}</span><button class="tb" data-tt="close">${IC.x}</button>`:`
    <span class="tnow"><small>${esc(TT.label)}${TT.paused?" · 멈춤":" · 읽는 중"}</small><b>${a?(a.utt?esc(a.title):a.no+(a.title?"("+esc(a.title)+")":"")):""}</b></span>
    <button class="tb" data-tt="prev" aria-label="이전 조문">‹</button>
    <button class="tb main" data-tt="pause" aria-label="${TT.paused?"이어 듣기":"멈추기"}">${TT.paused?"▶":"❚❚"}</button>
    <button class="tb" data-tt="next" aria-label="다음 조문">›</button>
    <button class="tb rate" data-tt="rate" aria-label="읽기 속도">${TT.rate}×</button>
    <button class="tb" data-tt="stop" aria-label="그만 듣기">${IC.x}</button>`}</div>`;
  bar.querySelectorAll("[data-tt]").forEach(b=>b.onclick=()=>({prev:()=>ttsJump(-1),next:()=>ttsJump(1),pause:ttsPause,rate:ttsRate,stop:ttsStop,close:()=>renderTtsBar()})[b.dataset.tt]());
}
