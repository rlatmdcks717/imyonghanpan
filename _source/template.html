<title>임용한판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: bright single-theme learning game — title → subjects → zigzag stage path with bottom nav → lesson with bottom check sheet → result */
:root{
  --bg:#FFFFFF; --ink:#3C3C3C; --muted:#777777; --faint:#AFAFAF; --line:#E5E5E5; --wash:#F7F7F7;
  --green:#58CC02; --green-d:#58A700; --green-l:#D7FFB8;
  --blue:#1CB0F6;  --blue-d:#1899D6;  --blue-l:#DDF4FF;
  --red:#FF4B4B;   --red-d:#EA2B2B;   --red-l:#FFDFE0;
  --gold:#FFC800;  --gold-d:#E5A800;
  --orange:#FF9600;--orange-d:#E07F00;
  --purple:#CE82FF;--purple-d:#A568CC;
  --pink:#FF7EB6;--pink-d:#E0609A;
  --teal:#2EC4B6;--teal-d:#1FA295;
  --photo:#FFFFFF; --line2:#D0D0D0;
  --f-display:"Jua","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:only light;
}
html{height:100%}
body{min-height:100%}
*{box-sizing:border-box}
html{touch-action:manipulation} /* 더블탭 확대만 막고 핀치줌은 그대로 둠 */
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:14px 40px}
body.has-bottom .wrap{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:10px}
svg.i{width:1em;height:1em;vertical-align:-.13em;flex:none}

/* buttons */
.btn{--c:var(--green);--d:var(--green-d);border:0;border-radius:16px;background:var(--c);color:#fff;box-shadow:0 4px 0 var(--d);font-weight:700;font-size:16px;letter-spacing:.04em;padding:14px 20px;transition:transform .06s,box-shadow .06s;width:100%}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--d)}
.btn.blue{--c:var(--blue);--d:var(--blue-d)}
.btn.red{--c:var(--red);--d:var(--red-d)}
.btn.ghost{background:var(--bg);color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn:disabled{background:var(--line);color:var(--faint);box-shadow:0 4px 0 var(--line2);cursor:default}
.icon-btn{border:0;background:none;color:var(--faint);width:40px;height:40px;display:grid;place-items:center;font-size:24px;border-radius:12px}
.icon-btn:hover{background:var(--wash)}

/* top bar */
.top{display:flex;align-items:center;gap:10px;min-height:44px}
.top .t{flex:1;font-family:var(--f-display);font-size:22px;color:var(--ink)}
.stat-chip{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;color:var(--gold-d)}
.stat-chip svg{color:var(--gold)}

/* title */
.ts{min-height:calc(100dvh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center}
.logo{display:flex;flex-direction:column;align-items:center}
.logo .small{font-family:var(--f-display);font-size:28px;background:var(--gold);color:#4A3600;padding:2px 18px;border-radius:14px;box-shadow:0 4px 0 var(--gold-d);transform:rotate(-4deg)}
.logo .main{font-family:var(--f-display);font-size:clamp(68px,22vw,108px);line-height:1;color:var(--green);text-shadow:0 6px 0 var(--green-d);margin-top:12px}
.tagline{color:var(--muted);font-size:16px;line-height:1.65;font-weight:500}
.ts .btn{max-width:320px;font-size:18px;padding:15px}
/* 진입 화면은 한 화면에 딱 맞으므로 스크롤·당겨짐(바운스)을 막음. 화면이 너무 낮으면 버튼이 잘리지 않게 풀어 줌 */
body.on-title{overflow:hidden;overscroll-behavior:none}
@media (max-height:520px){body.on-title{overflow:auto;overscroll-behavior:auto}}

.credits{position:fixed;inset:0;z-index:50;background:#0F1A14;color:#F1F7EE;overflow-y:auto;display:flex;flex-direction:column;align-items:center;cursor:pointer;animation:cfade .35s ease}
@keyframes cfade{from{opacity:0}to{opacity:1}}
.credits .roll{width:min(420px,88vw);text-align:center;padding:clamp(40px,7vh,64px) 0 clamp(20px,4vh,40px);margin:auto 0;cursor:default}
.credits .ctitle{font-family:var(--f-display);font-size:clamp(38px,7vh,52px);color:var(--green);text-shadow:0 4px 0 var(--green-d);margin:0 0 6px}
.credits .csub{color:#A9C2A8;font-size:14px;line-height:1.6;margin:0 0 clamp(6px,2vh,18px)}
.credits dl{margin:0;display:flex;flex-direction:column;gap:4px}
.credits dt{font-size:11px;letter-spacing:.2em;color:#7FA07C;text-transform:uppercase;margin-top:clamp(10px,2.4vh,20px);font-weight:700}
.credits dt.nocap{text-transform:none;letter-spacing:.12em;font-size:12.5px}
.credits dd{margin:0;font-family:var(--f-display);font-size:clamp(18px,3vh,22px);line-height:1.35}
.credits dd.thx{display:flex;flex-direction:column;align-items:center;gap:clamp(22px,3.6vh,32px);margin-top:10px}
.credits .tg{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%}
.credits .tg small{font-family:var(--f-body);font-size:12.5px;color:#A9C2A8;font-weight:700;letter-spacing:.04em;margin-bottom:4px}
.credits .tp{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 22px}
.credits .tp span{display:flex;flex-direction:column;align-items:center}
.credits .tp i{font-family:var(--f-body);font-style:normal;font-size:13px;color:#8FB38C}
.credits .tg.many .tp{gap:8px 0;width:100%}
.credits .tg.many .tp{max-width:300px;margin:0 auto;justify-content:flex-start}
.credits .tg.many .tp span{flex:0 0 50%;min-width:0}
.credits .tg.many .tp i{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.credits .tg.many b{font-size:17px}
.credits .tg.many i{font-size:12px}
.credits dd.hdl{font-family:var(--f-body);font-size:13px;color:#8FB38C;margin-top:-2px}
.credits dd.many{font-family:var(--f-body);font-size:16px;font-weight:600}
.credits dd.small{font-family:var(--f-body);font-size:13px;color:#C9DCC7}
.credits dd.empty{font-family:var(--f-body);font-size:14px;color:#6E8A6C;font-style:italic}
.credits .cmeta{margin-top:clamp(14px,3vh,26px);padding-top:clamp(10px,2vh,16px);border-top:1px solid rgba(255,255,255,.1);font-size:12.5px;line-height:1.8;color:#9FB89D}
.credits .cmeta b{color:#F1F7EE;font-weight:700}
.credits .cend{margin-top:clamp(10px,2.4vh,22px);font-size:15px;line-height:1.7;color:#C9DCC7}
@media (max-height:640px){.credits .csub,.credits .cend{display:none}.credits .roll{padding-top:52px}}
.credits .cclose{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;border:0;background:rgba(255,255,255,.12);color:#fff;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;cursor:pointer}
.logo .main{cursor:default;-webkit-tap-highlight-color:transparent;user-select:none}
/* subjects */
.h-big{font-family:var(--f-display);font-size:26px;line-height:1.2}
.sub-txt{color:var(--muted);font-size:15px}
.subjects{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.subj{--c:var(--green);--d:var(--green-d);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;min-height:136px;text-align:center;background:var(--bg);border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:14px 16px}
.subj:active:not(.off){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.subj .g{position:relative;flex:none;width:52px;height:52px;border-radius:14px;background:var(--c);box-shadow:0 4px 0 var(--d);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:26px}
.subj b{display:block;font-size:18px;font-weight:700;line-height:1.25;word-break:keep-all}
.subj small{display:block;font-size:13px;color:var(--muted);margin-top:-6px}
.subj .arrow{margin-left:auto;color:var(--faint);font-size:20px}
.subj.off{cursor:default}
.subj.off .g{background:var(--line);box-shadow:0 4px 0 var(--line2);color:var(--faint)}
.subj .g svg{width:30px;height:30px}
.subj .g .lk{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:2px solid var(--line);display:grid;place-items:center;color:var(--faint)}
.subj .g .lk svg{width:12px;height:12px}
.subj.off b{color:var(--faint)}
.note{font-size:13px;color:var(--faint);text-align:center}

/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line);display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.bnav .in{display:flex;gap:6px;width:100%;max-width:560px}
.bnav button{flex:1;border:2px solid transparent;background:none;border-radius:14px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--faint)}
.bnav button svg{font-size:24px}
.bnav button[aria-selected="true"]{border-color:var(--blue);background:var(--blue-l);color:var(--blue)}

/* stage path */
.unit{--c:var(--green);--d:var(--green-d);background:var(--c);color:#fff;border-radius:16px;padding:14px 18px;box-shadow:0 4px 0 var(--d);display:flex;flex-direction:column}
.unit small{font-size:13px;font-weight:700;opacity:.85;letter-spacing:.04em}
.unit b{font-family:var(--f-display);font-weight:400;font-size:22px}
.unit.locked{--c:var(--line);--d:var(--line2);color:var(--faint)}
.path{display:flex;flex-direction:column;align-items:center;gap:22px;padding-block:8px 6px}
.node{--c:var(--green);--d:var(--green-d);display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:0}
.node .disc{width:76px;height:70px;border-radius:50%;background:var(--c);box-shadow:0 7px 0 var(--d);display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:30px;transition:transform .06s,box-shadow .06s;position:relative}
.node:active:not(.lock) .disc{transform:translateY(6px);box-shadow:0 1px 0 var(--d)}
.node .disc img{width:46px;height:46px;border-radius:50%;background:var(--photo)}
.node .name{font-weight:700;font-size:14px;color:var(--ink)}
.node .stars{display:flex;gap:1px;font-size:16px;color:var(--line)}
.node .stars .on{color:var(--gold)}
.node.lock{cursor:default}
.node.lock .disc{background:var(--line);box-shadow:0 7px 0 var(--line2);color:var(--faint);font-size:26px}
.node.lock .name{color:var(--faint)}
.node.done .disc::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:4px solid var(--gold);opacity:.9}
.hint{font-size:13px;color:var(--faint);text-align:center}

/* stage list */
.group-h{font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--ink);margin-top:4px}
.stages{display:flex;flex-direction:column;gap:12px}
.stage{--c:var(--green);--d:var(--green-d);display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--bg);border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:12px 14px}
.stage:active:not(.lock){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.stage .badge{flex:none;width:56px;height:56px;border-radius:16px;background:var(--c);box-shadow:0 4px 0 var(--d);display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:26px;overflow:hidden}
.stage .badge.photo{background:var(--photo);border:3px solid var(--c);box-shadow:0 4px 0 var(--d)}
.stage .badge img{width:100%;height:100%;object-fit:contain}
.stage .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.stage .txt b{font-size:17px;font-weight:700;line-height:1.3}
.stage .txt small{color:var(--muted);font-size:13px;line-height:1.35}
.stage .lv{align-self:flex-start;font-size:11px;font-weight:700;color:var(--d);background:color-mix(in srgb,var(--c) 15%,#fff);border-radius:6px;padding:0 6px;margin-bottom:2px}
.stage .stars{display:flex;gap:1px;font-size:18px;color:var(--line);flex:none}
.stage .stars .on{color:var(--gold)}
.stage.lock{cursor:default}
.stage.lock .badge{background:var(--line);box-shadow:0 4px 0 var(--line2);color:var(--faint)}
.stage.lock b{color:var(--faint)}
.stage.lock .lv{color:var(--faint);background:var(--wash)}

.stage.cat{padding:16px}
.stage.cat .badge{width:64px;height:64px}
.stage.cat .txt b{font-size:19px}
.stage .arrow{color:var(--faint);font-size:20px;flex:none}
.catbar{display:flex;align-items:center;gap:8px;margin-top:6px}
.catbar .meter{flex:1;height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.catbar .meter i{display:block;height:100%;background:var(--c);border-radius:999px}
.catbar .cnt{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:700;color:var(--gold-d);font-variant-numeric:tabular-nums}
.catbar .cnt svg{color:var(--gold)}
.crumb{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-bottom-width:4px;background:var(--bg);border-radius:14px;padding:6px 14px 6px 10px;font-family:var(--f-display);font-size:19px;color:var(--ink)}
.crumb svg{color:var(--faint)}
/* lesson */
.ltop{display:flex;align-items:center;gap:12px}
.prog{flex:1;height:16px;background:var(--line);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:999px;position:relative;transition:width .35s}
.prog i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.lives{display:flex;align-items:center;gap:4px;color:var(--red);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.lives svg{font-size:24px}
.combo{display:inline-flex;align-items:center;gap:4px;color:var(--orange);font-weight:700;font-size:14px}
.ask{font-family:var(--f-display);font-size:26px;line-height:1.3;word-break:keep-all}
.big{align-self:center;width:min(200px,62%);aspect-ratio:1;border-radius:18px;border:2px solid var(--line);border-bottom-width:4px;background:var(--photo);display:block}
.bigchar.long{font-size:52px;width:auto;padding-inline:20px;max-width:100%}
.bigchar.xl{white-space:normal;font-size:clamp(30px,9vw,44px);height:auto;min-height:110px;padding:18px 20px;text-align:center;line-height:1.25;word-break:keep-all}
.opt.small{font-size:22px}
.bigchar{align-self:center;font-family:var(--f-display);font-size:90px;line-height:1;color:var(--ink);border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;min-width:150px;width:auto;max-width:100%;padding-inline:16px;white-space:nowrap;height:150px;display:grid;place-items:center}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{border:2px solid var(--line);border-bottom-width:4px;background:var(--bg);border-radius:16px;padding:14px;font-family:var(--f-display);font-size:32px;color:var(--ink);transition:background .1s}
.opt:hover:not(:disabled){background:var(--wash)}
.opt.img{padding:8px}
.opt.img img{width:100%;aspect-ratio:1;display:block}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-l);color:var(--blue-d)}
.opt.right{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.opt.wrong{border-color:var(--red);background:var(--red-l);color:var(--red-d)}
.opt:disabled{cursor:default}
.word{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.syl{display:flex;gap:2px;padding:6px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--photo)}
.syl img{width:56px;height:56px;display:block}
.answer-in{width:100%;font-family:var(--f-display);font-size:24px;padding:14px;border:2px solid var(--line);border-radius:16px;background:var(--wash);color:var(--ink);text-align:center}
.answer-in:focus{border-color:var(--blue);outline:none;background:var(--bg)}

.modebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.modes{display:inline-flex;gap:4px;background:var(--wash);border:2px solid var(--line);border-radius:14px;padding:3px}
.modes button{border:0;background:none;border-radius:10px;padding:5px 10px;font-size:13px;font-weight:700;color:var(--faint);display:inline-flex;align-items:center;gap:4px}
.modes button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.modes button[data-mode="heart"][aria-pressed="true"] svg{color:var(--red)}
.modes button[data-mode="free"][aria-pressed="true"] svg{color:var(--blue)}
.modehint{font-size:12px;color:var(--faint);margin-top:-10px}
.count{font-weight:700;font-size:15px;color:var(--blue);font-variant-numeric:tabular-nums;white-space:nowrap}
.linkbtn{border:0;background:none;color:var(--blue);font-weight:700;font-size:14px;padding:4px 2px}
.freebadge{width:84px;height:84px;border-radius:50%;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;font-size:48px}
.answer-in.mono,.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.06em}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keypad button{border:2px solid var(--line);border-bottom-width:4px;background:var(--bg);border-radius:12px;padding:10px 0;font-weight:700;font-size:20px;color:var(--ink)}
.keypad button:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
/* bottom sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;border-top:2px solid var(--line);background:var(--bg);padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:6}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheet.ok{background:var(--green-l);border-color:transparent}
.sheet.no{background:var(--red-l);border-color:transparent}
.sheet .v{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:24px}
.sheet .v .ic{width:36px;height:36px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:20px}
.sheet.ok .v{color:var(--green-d)} .sheet.no .v{color:var(--red-d)}
.sheet .detail{font-weight:700;font-size:15px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.sheet .detail .bwrap{background:var(--bg);border-radius:8px;padding:6px 8px}
.sheet.ok .detail{color:var(--green-d)} .sheet.no .detail{color:var(--red-d)}
.sheet .jamo{font-weight:500;letter-spacing:.06em;opacity:.85}
.pop{animation:pop .3s ease} .shake{animation:shake .35s ease}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.sheet-up{animation:up .2s ease-out}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}

/* result */
.result{min-height:calc(100dvh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.bigstars{display:flex;gap:6px;font-size:58px;color:var(--line)}
.bigstars .on{color:var(--gold);filter:drop-shadow(0 4px 0 var(--gold-d))}
.result h2{font-family:var(--f-display);font-weight:400;font-size:32px;color:var(--gold-d)}
.result h2.fail{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tile3{--c:var(--gold);border:2px solid var(--c);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;background:var(--c)}
.tile3 small{color:#fff;font-weight:700;font-size:12px;padding:4px}
.tile3 b{background:var(--bg);border-radius:13px;padding:10px 4px;font-size:22px;font-weight:700;color:var(--c);font-variant-numeric:tabular-nums}
.tile3.g{--c:var(--green)} .tile3.b{--c:var(--blue)} .tile3.o{--c:var(--orange)}

function writeActive(){return S.view==="play"&&S.game&&!S.game.done&&S.game.st.type==="write"&&!S.game.answered;}
document.addEventListener("keydown",e=>{
  if(e.target&&e.target.tagName==="INPUT")return;
  const d=KEYDOT[e.code];
  if(typingActive()){
    if(d){e.preventDefault();if(!e.repeat){held.add(e.code);chord=sortDots(chord+d);S.bt.cur=chord;render();}}
    else if(e.code==="Space"){e.preventDefault();S.bt.seq.push("0");S.bt.cur="";render();}
    else if(e.code==="Backspace"){e.preventDefault();S.bt.seq.pop();render();}
  }else if(writeActive()&&d&&!e.repeat){e.preventDefault();const s=new Set((S.game.sel||"").split("").filter(Boolean));s.has(d)?s.delete(d):s.add(d);S.game.sel=sortDots([...s].join(""));render();}
});
document.addEventListener("keyup",e=>{
  if(!typingActive()||!KEYDOT[e.code])return;
  held.delete(e.code);
  if(!held.size&&chord){S.bt.seq.push(chord);chord="";S.bt.cur="";render();}
});

const compose=(c,v,j="")=>String.fromCharCode(0xAC00+CHO.indexOf(c)*588+JUNG.indexOf(v)*28+JONG.indexOf(j));
function koBraille(word){
  if(KABBR[word])return {cells:KABBR[word],gloss:["약어 "+word]};
  const syl=split(word);if(!syl)return null;
  const cells=[],gloss=[];const add=(c,g)=>{cells.push(c);gloss.push(g);};
  for(let i=0;i<syl.length;i++){
    const [c,v,j=""]=syl[i],next=syl[i+1],prev=syl[i-1];
    if(!KCHO[c]&&c!=="ㅇ")return null;                 // 된소리
    if(j&&!KJONG[j])return null;                        // 겹받침 등
    if(!KVOW[v])return null;
    if(c==="ㅇ"&&v==="ㅖ"&&prev&&prev.length===2)return null;            // 모음 뒤 ‘예’
    if(c==="ㅇ"&&v==="ㅐ"&&prev&&prev.length===2&&"ㅑㅘㅜㅝ".includes(prev[1]))return null; // ㅑ·ㅘ·ㅜ·ㅝ 뒤 ‘애’
    if(c==="ㄱ"&&v==="ㅓ"&&j==="ㅅ"){cells.push("456","234");gloss.push("약자 것");continue;}
    if(v==="ㅏ"&&KA[c]){
      if(!j&&next&&next[0]==="ㅇ"&&"ㄴㄷㅌㅍㅎ".includes(c))return null;  // ‘나·다·타·파·하’ 뒤 모음
      add(KA[c],"약자 "+compose(c,"ㅏ"));
      if(j)add(KJONG[j],j==="ㅆ"?"약자 ㅆ받침":"받침 "+j);
      continue;
    }
    if(c!=="ㅇ")add(KCHO[c],"초성 "+c);
    let rk=v+j;
    if(v==="ㅓ"&&j==="ㅇ"&&"ㅅㅈㅊ".includes(c))rk="ㅕㅇ";              // 성·정·청
    if(j&&KRIME[rk]){add(KRIME[rk],"약자 "+compose("ㅇ",rk[0],rk[1]));continue;}
    KVOW[v].forEach((d,k)=>add(d,k?"":"모음 "+v));
    if(j)add(KJONG[j],j==="ㅆ"?"약자 ㅆ받침":"받침 "+j);
  }
  return {cells,gloss:gloss.filter(Boolean)};
}

const LAW_TERMS=["특수교육 관련서비스","개별화교육계획","통합교육계획","진로 및 직업교육","직업재활훈련","자립생활훈련","의무교육","무상","진단ㆍ평가","선별검사","순회교육","원격수업","전공과","가족지원","치료지원","지원인력","기숙사","생활지도원","간호사 또는 간호조무사","통학 지원","학습보조기","보조공학기기","서면","행정심판","심사청구","의견진술","대통령령","교육부령","교육규칙","실태조사","인권침해","최종의견","조기발견","취학지도","특수교육종합계획","특성화특수학교","정보접근","화면해설","폐쇄자막","수어통역","편의제공","개인별 교육지원계획","학칙","통합학급","특수학급","특수학교","일반학급","장애영아","거주지에서 가장 가까운 곳","행동중재전문가"];
const NUM_RE="만 \\d+세(?:부터 만 \\d+세)?|만 \\d+세미만|\\d+년마다|\\d+년 이상|\\d+주일 이내|\\d+주 이내|\\d+일 이내|\\d+개월 이상|\\d+인 이상 \\d+인 이하|\\d+인을 초과|\\d+분의 \\d+|\\d+년 이하|\\d+천만원 이하|\\d+만원 이하|매 학기|매년";
const BLANK_RE=new RegExp(`(${ACTORS.map(a=>a.re).join("|")})|(${NUM_RE})|(${LAW_TERMS.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")})`,"g");

const lawNote=s=>s.replace(/(<(?:개정|신설|전문개정|제목개정|본조신설)[^>]*>|\[[^\]]*(?:개정|신설|이동)[^\]]*\])/g,"\u0000$1\u0001");
function lawLineHTML(text,hl){
  // 개정 표시는 회색 작은 글씨, 나머지는 형광펜
  return lawNote(text).split(/(\u0000[^\u0001]*\u0001)/).map(part=>{
    if(part.startsWith("\u0000"))return `<span class="lnote">${esc(part.slice(1,-1))}</span>`;
    let out="",last=0;ACTOR_RE.lastIndex=0;let m;
    while((m=ACTOR_RE.exec(part))){
      const gi=m.slice(1).findIndex(Boolean);const ac=ACTORS[gi];
      out+=esc(part.slice(last,m.index));
      out+=hl&&S.lawOn[ac.id]!==false?`<mark style="--hl:${ac.col}" title="${ac.name}">${esc(m[0])}</mark>`:esc(m[0]);
      last=m.index+m[0].length;
    }
    return out+esc(part.slice(last));
  }).join("");
}
const lineCls=l=>/^[①-⑳]/.test(l)?"hang":/^\d+(의\d+)?\./.test(l)?"ho":/^\[/.test(l)?"lnote blk":"";
function artBody(v,hl){
  return v.lines.map((l,i)=>i===0?(l?`<p>${lawLineHTML(l,hl)}</p>`:""):`<p class="${lineCls(l)}">${lawLineHTML(l,hl)}</p>`).join("");
}


/* ----- 소리로 듣기 (브라우저 기본 음성 읽기, Web Speech API) ----- */
const TTS_OK=typeof window!=="undefined"&&"speechSynthesis" in window&&"SpeechSynthesisUtterance" in window;
const TT={on:false,paused:false,doc:null,subj:"law",label:"",queue:[],ai:0,li:0,rate:1,voice:null};
function vScore(x){const n=x.name;return (/natural|online|neural/i.test(n)?100:0)+(/premium|enhanced|고품질|향상/i.test(n)?80:0)+(/google/i.test(n)?40:0)+(/sun-?hi|injoon|yuna|heami|hyunsu|seoyeon|jimin/i.test(n)?20:0)+(x.localService===false?10:0);}
function koVoices(){if(!TTS_OK)return[];return speechSynthesis.getVoices().filter(x=>/^ko/i.test(x.lang)).sort((a,b)=>vScore(b)-vScore(a));}
function ttsVoice(){const v=koVoices();return v[0]||null;}
function voiceLabel(x){let n=x.name.replace(/^Microsoft\s+/i,"").replace(/\s*-\s*Korean.*$/i,"").replace(/\s*\(Korean.*\)/i,"");return n+(vScore(x)>=80?" · 자연스러운 목소리":"");}
function fillVoices(){const sel=document.getElementById("voiceSel");if(!sel)return;const v=koVoices();
  if(!v.length){sel.parentElement.innerHTML='<span class="src">이 기기에는 한국어 목소리가 없어요.</span>';return;}
  sel.innerHTML=v.map((x,i)=>`<option value="${i}" ${TT.voice&&x.name===TT.voice.name?"selected":""}>${esc(voiceLabel(x))}</option>`).join("");
  sel.onchange=()=>{TT.voice=v[+sel.value];try{localStorage.setItem("imyong_voice",TT.voice.name);}catch(e){}if(TT.on&&!TT.paused){ttsCancel();ttsSpeak();}};}
if(TTS_OK){try{speechSynthesis.onvoiceschanged=()=>{TT.voice=ttsVoice();fillVoices();};TT.voice=ttsVoice();}catch(e){}}
function speakable(line){
  let s=line.replace(/<[^>]*>/g,"").replace(/\[[^\]]*\]/g,"")
    .replace(/\([一-鿿豈-﫿]+\)/g,"")
    .replace(/[「」“”‘’]/g,"").replace(/ㆍ/g,", ");
  s=s.replace(/^([①-⑳])\s*/,(m,c)=>"제"+(c.charCodeAt(0)-0x245F)+"항. ")
     .replace(/^(\d+)의(\d+)\.\s*/,"제$1호의$2. ").replace(/^(\d+)\.\s*/,"제$1호. ")
     .replace(/^([가-하])\.\s*/,"$1목. ");
  return s.trim();
}
function artUtterances(a){
  if(a.utt)return a.utt;
  const out=[`${a.no.replace(/의(\d+)$/,"의 $1")}${a.title?", "+a.title:""}.`];
  a.lines.forEach(l=>{const s=speakable(l);if(s)out.push(s);});
  return out;
}
function ttsArts(doc){return DOCS[doc].data.flatMap(c=>c.arts).filter(a=>!/^삭제/.test(a.lines[0]));}
function ttsCancel(){TT.gen=(TT.gen||0)+1;if(TTS_OK)speechSynthesis.cancel();}
function ttsStart(doc,no){
  if(!TTS_OK)return;
  ttsCancel();
  const arts=ttsArts(doc);TT.subj="law";TT.label=DOCS[doc].label;TT.on=true;TT.paused=false;TT.doc=doc;TT.queue=arts;TT.ai=Math.max(0,arts.findIndex(a=>a.no===no));TT.li=0;
  ttsSpeak();renderTtsBar();
}
function ttsSpeak(){
  if(!TT.on)return;
  const a=TT.queue[TT.ai];if(!a){ttsStop();return;}
  const lines=artUtterances(a);
  if(TT.li>=lines.length){TT.ai++;TT.li=0;ttsMark();return ttsSpeak();}
  const u=new SpeechSynthesisUtterance(lines[TT.li]);
  u.lang="ko-KR";u.rate=TT.rate;if(TT.voice)u.voice=TT.voice;
  const g=TT.gen;
  u.onend=()=>{if(g!==TT.gen||!TT.on||TT.paused)return;TT.li++;ttsSpeak();};
  u.onerror=e=>{if(g!==TT.gen||e.error==="interrupted"||e.error==="canceled")return;TT.on=false;renderTtsBar(`소리를 낼 수 없어요 (${e.error||"오류"})`);};
  speechSynthesis.speak(u);ttsMark();
}
function ttsPause(){if(!TT.on)return;TT.paused=!TT.paused;if(TT.paused)ttsCancel();else ttsSpeak();renderTtsBar();}
function ttsStop(){TT.on=false;TT.paused=false;ttsCancel();ttsMark();renderTtsBar();}
function ttsJump(d){if(!TT.on)return;ttsCancel();TT.ai=Math.min(Math.max(0,TT.ai+d),TT.queue.length-1);TT.li=0;TT.paused=false;ttsSpeak();renderTtsBar();}
function ttsRate(){const R=[0.8,1,1.2,1.5];TT.rate=R[(R.indexOf(TT.rate)+1)%R.length];if(TT.on&&!TT.paused){ttsCancel();ttsSpeak();}renderTtsBar();}
function ttsMark(){
  document.querySelectorAll(".lart.speaking").forEach(e=>e.classList.remove("speaking"));
  if(!TT.on)return;
  if(TT.subj==="law"&&(S.tab!=="read"||S.lawDoc!==TT.doc))return;
  if(TT.subj==="law"&&!S.lawQ.trim()&&S.lawMode!=="type"){const a0=TT.queue[TT.ai];if(a0){const chs=lawChs(TT.doc),pos=lawPos(TT.doc),cur=chs[pos.k]&&chs[pos.k].arts[pos.a];
    if(!cur||cur.no!==a0.no){chs.forEach((c,k)=>c.arts.forEach((a,i)=>{if(a.no===a0.no)Object.assign(pos,{k,a:i});}));render();return;}}}
  if(TT.subj==="curr"&&(S.tab!=="cread"||S.cu.ch!==TT.doc))return;
  const a=TT.queue[TT.ai];if(!a)return;const el=document.getElementById(a.el||("art-"+TT.doc+"-"+a.no));
  if(el){el.classList.add("speaking");if(TT.li===0){const r=el.getBoundingClientRect();if(r.top<60||r.top>innerHeight*0.6)scrollTo({top:r.top+scrollY-70,behavior:"smooth"});}}
}
function renderTtsBar(msg){
  let bar=document.getElementById("ttsbar");
  const show=S.view==="room"&&S.subject===TT.subj&&(TT.on||msg);
  if(!show){if(bar)bar.remove();document.body.classList.remove("has-tts");return;}
  if(!bar){bar=document.createElement("div");bar.id="ttsbar";document.body.appendChild(bar);}
  document.body.classList.add("has-tts");
  const a=TT.queue[TT.ai];
  bar.innerHTML=`<div class="in">${msg?`<span class="tmsg">${esc(msg)}</span><button class="tb" data-tt="close">${IC.x}</button>`:`
    <span class="tnow"><small>${esc(TT.label)}${TT.paused?" · 멈춤":" · 읽는 중"}</small><b>${a?(a.utt?esc(a.title):a.no+(a.title?"("+esc(a.title)+")":"")):""}</b></span>
    <button class="tb" data-tt="prev" aria-label="이전 조문">‹</button>
    <button class="tb main" data-tt="pause" aria-label="${TT.paused?"이어 듣기":"멈추기"}">${TT.paused?"▶":"❚❚"}</button>
    <button class="tb" data-tt="next" aria-label="다음 조문">›</button>
    <button class="tb rate" data-tt="rate" aria-label="읽기 속도">${TT.rate}×</button>
    <button class="tb" data-tt="stop" aria-label="그만 듣기">${IC.x}</button>`}</div>`;
  bar.querySelectorAll("[data-tt]").forEach(b=>b.onclick=()=>({prev:()=>ttsJump(-1),next:()=>ttsJump(1),pause:ttsPause,rate:ttsRate,stop:ttsStop,close:()=>renderTtsBar()})[b.dataset.tt]());
}

/* ----- 법 읽기 (법 · 시행령 · 시행규칙) ----- */

S.lawPos={};S.lawMode="read";
function lawChs(doc){
  const D=DOCS[doc],L=D.data.map((c,ci)=>({ci,label:c.no?`${c.no} ${c.title}`:"전체 조문",short:c.no||"전체",arts:c.arts}));
  if(doc==="dec"||doc==="rul")L.push({ci:-1,label:"별표",short:"별표",byl:true,arts:[]});
  return L;
}
function lawFlat(doc){const out=[];lawChs(doc).forEach((c,k)=>{if(c.byl)out.push({k,a:-1});else c.arts.forEach((_,i)=>out.push({k,a:i}));});return out;}
function lawPos(doc){return S.lawPos[doc]||(S.lawPos[doc]={k:0,a:0});}
function lawArtCard(doc,a){
  const pre=doc+"-",del=/^삭제/.test(a.lines[0]),key=pre+a.no;
  return `<article class="lart lawone ${del?"del":""}" id="art-${key}">

    <div class="lchips">${ACTORS.map(a=>`<button class="lchip" data-act="${a.id}" aria-pressed="${S.lawOn[a.id]!==false}"><i style="background:${a.col}"></i>${a.name}</button>`).join("")}</div>
    <div class="row2"><button class="btn ghost" id="hlAll">모두 켜기</button><button class="btn ghost" id="hlNone">모두 끄기</button></div>
  </details>

`;
  if(q){
    const hits=[];chs.forEach((c,k)=>c.arts.forEach((a,i)=>{if([a.no,a.title,...a.lines].join(" ").includes(q))hits.push({k,i,a});}));

    <div class="lawhits">${hits.map(h=>{const ln=h.a.lines.find(l=>l.includes(q))||h.a.lines[0];return `<button class="lawhit" data-go="${h.k}:${h.i}"><b>${h.a.no}${h.a.title?`(${esc(h.a.title)})`:""}</b><small>${esc(chs[h.k].short)} · ${esc(ln.replace(/<[^>]*>/g,"").slice(0,60))}${ln.length>60?"…":""}</small></button>`;}).join("")}
    ${bylHit>=0?`<button class="lawhit" data-go="${bylHit}:-1"><b>별표</b><small>별표 안에 있어요</small></button>`:""}</div>
    ${!hits.length&&bylHit<0?`<p class="src">‘${esc(q)}’이(가) 들어간 조문이 없어요.</p>`:""}`;

  const modeSeg=`<div class="moderow"><div class="seg modeseg" role="group" aria-label="읽기 방식">${[["read","읽기"],["type","따라 쓰기"]].map(([k,l])=>`<button aria-pressed="${S.lawMode===k}" data-lawmode="${k}">${l}</button>`).join("")}</div>${TTS_OK&&S.lawMode!=="type"?`<button class="sqlisten" id="listenAll" aria-label="${D.label} 처음부터 소리로 듣기" title="처음부터 소리로 듣기">${IC.speaker}</button>`:""}</div>`;
  let card=body;
  if(S.lawMode==="type"){
    if(C.byl)card=`<p class="src">별표는 표라서 따라 쓰기에서 빼 두었어요. 다른 조를 골라 주세요.</p>`;
    else{const a=C.arts[pos.a];tySet("law-"+doc+"-"+a.no,/^삭제/.test(a.lines[0])?[]:a.lines);card=typingHTML(`${a.no}${a.title?`(${a.title})`:""}`);}
  }
  return seg+modeSeg+`
  <p class="lawtitle"><b>${D.full}</b></p>
  <div class="lbtop"><label for="lawch" class="vh">장 선택</label>
    <select id="lawch">${chs.map((c,k)=>`<option value="${k}" ${k===pos.k?"selected":""}>${esc(c.label)}${c.byl?"":` (${c.arts.length}개 조)`}</option>`).join("")}</select></div>
  ${C.byl?"":`<div class="lawstrip" id="lawstrip">${C.arts.map((a,i)=>`<button class="${i===pos.a?"on":""} ${/^삭제/.test(a.lines[0])?"del":""}" data-ai="${i}">${a.no.replace(/^제/,"").replace(/조/,"조")}</button>`).join("")}</div>`}

const LAW_BLANKABLE=LAW_ARTS.filter(a=>!/^삭제/.test(a.lines[0])&&!a.futureOnly);
S.lb={idx:0,amt:"low",seed:1,vals:{},graded:false,reveal:false};
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function buildBlanks(a,seed,amt){
  const segs=[];let id=0;const r=rng(seed+a.no.length*97+a.no.charCodeAt(a.no.length-2)*13);
  a.lines.forEach((line,li)=>{
    const parts=[];
    lawNote(line).split(/(\u0000[^\u0001]*\u0001)/).forEach(part=>{
      if(part.startsWith("\u0000")){parts.push({t:"note",s:part.slice(1,-1)});return;}
      BLANK_RE.lastIndex=0;let m,lst=0;
      while((m=BLANK_RE.exec(part))){
        parts.push({t:"txt",s:part.slice(lst,m.index)});
        const kind=m[1]?"actor":m[2]?"num":"term";let act=null;
        if(kind==="actor"){ACTOR_RE.lastIndex=0;const am=ACTOR_RE.exec(m[0]);if(am)act=ACTORS[am.slice(1).findIndex(Boolean)];}
        parts.push({t:"cand",s:m[0],kind,act});lst=m.index+m[0].length;
      }
      parts.push({t:"txt",s:part.slice(lst)});
    });
    segs.push({li,parts});
  });
  // 기간·숫자 > 행위 주체 > 핵심 용어 순으로 우선, 조금만
  const cands=segs.flatMap(s=>s.parts.filter(p=>p.t==="cand"));
  const cap={low:2,mid:4,high:7}[amt], ratio={low:.15,mid:.3,high:.5}[amt];
  const n=Math.min(cap,Math.max(1,Math.round(cands.length*ratio)),cands.length);
  const w={num:4,actor:3,term:1};
  const pool=cands.map(p=>({p,k:Math.pow(r(),1/w[p.kind])}));   // 가중 무작위 추출
  pool.sort((x,y)=>y.k-x.k);
  const used=new Set();
  for(const {p} of pool){if(used.size>=n)break;if([...used].some(q=>q.s===p.s))continue;p.blank=true;used.add(p);}
  cands.filter(p=>p.blank).forEach(p=>p.id=id++);
  return {segs,count:id};
}
const normAns=s=>s.replace(/\s+/g,"").replace(/[·・.]/g,"ㆍ");
function lawBlank(){
  const a=LAW_BLANKABLE[S.lb.idx],b=buildBlanks(a,S.lb.seed,S.lb.amt);
  const all=b.segs.flatMap(s=>s.parts).filter(p=>p.blank);
  const right=all.filter(p=>normAns(S.lb.vals[p.id]||"")===normAns(p.s)).length;
  const body=b.segs.map(({li,parts})=>{
    const cls=li===0?"":lineCls(a.lines[li]);
    return `<p class="${cls}">${parts.map(p=>{
      if(p.t==="note")return `<span class="lnote">${esc(p.s)}</span>`;
      if(p.t!=="cand"||!p.blank)return esc(p.s);
      const v=S.lb.vals[p.id]||"",ok=normAns(v)===normAns(p.s);
      if(S.lb.reveal)return `<span class="bl show ${p.act?"act":""}" ${p.act?`style="--hl:${p.act.col}"`:""}>${esc(p.s)}</span>`;
      const hl=p.act?` style="--hl:${p.act.col}"`:"";
      if(S.lb.graded)return ok?`<span class="bl okv ${p.act?"act":""}"${hl}>${esc(p.s)}</span>`:`<span class="bl wrongv">${v.trim()?`<s>${esc(v)}</s> `:""}${esc(p.s)}</span>`;
      return `<input class="bl ${p.act?"act":""}" data-b="${p.id}" value="${esc(v)}" title="${p.act?p.act.name+" 자리":p.kind==="num"?"기간·숫자":"핵심 용어"}" style="${p.act?`--hl:${p.act.col};`:""}width:${Math.min(Math.max(3,p.s.length)*1.05+1.4,18)}em" aria-label="빈칸 ${p.id+1}" autocomplete="off">`;
    }).join("")}</p>`;}).join("");
  return `

    <select id="lbsel">${LAW.map((c,ci)=>`<optgroup label="${c.no} ${esc(c.title)}">${LAW_BLANKABLE.map((x,i)=>x.ch===ci?`<option value="${i}" ${i===S.lb.idx?"selected":""}>${x.no}${x.title?`(${esc(x.title)})`:""}</option>`:"").join("")}</optgroup>`).join("")}</select>

  ${S.lb.graded?`<div class="lbscore ${right===b.count?"ok":""}"><b>${right} / ${b.count}</b> 맞혔어요${right===b.count?" · 완벽해요!":" · 빨간 칸이 틀린 곳이에요"}</div>`:""}
  <div class="row2"><button class="btn ghost" id="lbReveal">${S.lb.reveal?"빈칸으로 돌아가기":"정답 보기"}</button><button class="btn" id="lbGrade">${S.lb.graded?"다시 풀기":"채점하기"}</button></div>

}

const cuHasCand=l=>{if(!l.s)return false;CU_RE.lastIndex=0;let m;while((m=CU_RE.exec(l.s))){if(!(m[2]&&/[가-힣]/.test(l.s[m.index-1]||"")))return true;}return false;};
const cuLab=s=>{const h=cuHead(s);const rest=s.slice(h.endsWith("…")?0:h.length).trim();return (h.endsWith("…")?"":h+" ")+rest.slice(0,16)+(rest.length>16?"…":"");};
const cuHead=s=>(s.match(/^([가-하]\.|\d+\)|[가-하]\)|[①-⑳])/)||[s.slice(0,10)+"…"])[0];
function cuUnits(id){
  const C=cuCh(id),units=[];
  C.secs.forEach(sec=>{
    let cur=null,ctx=null;
    const flush=()=>{if(cur)units.push(cur);cur=null;};
    const start=(l,label)=>{flush();cur={sec:sec.h,ctx,label,lines:[l]};};
    sec.lines.forEach(l=>{
      const last=cur&&cur.lines[cur.lines.length-1];
      switch(l.k){
        case "gh":flush();ctx=l.s;break;
        case "gs":if(cur&&(last.k==="p"||cur.list)){if(!cur.list&&cur.lines.length>1){const lp=cur.lines.pop();units.push(cur);cur={sec:sec.h,ctx,label:cuLab(lp.s),lines:[lp]};}cur.lines.push(l);cur.list=true;}else start(l,cuLab(l.s));break;
        case "p":if(cur&&last.k==="p")cur.lines.push(l);else start(l,cuLab(l.s));break;
        case "i1":if(cur&&(cur.lines[0].k==="gs"||cur.lines[0].k==="p")&&!cur.list)cur.lines.push(l);else start(l,cuLab(l.s));break;
        case "i2":case "i3":case "dot":if(cur)cur.lines.push(l);else start(l,cuHead(l.s));break;
        case "note":{let u=units.find(x=>x.note&&x.sec===sec.h);if(!u){flush();u={sec:sec.h,ctx,label:"표 아래 설명 (①~)",lines:[],note:true};units.push(u);}u.lines.push(l);break;}
        case "box":flush();units.push({sec:sec.h,ctx,label:"범교과 학습 주제",lines:l.lines.map(s=>({k:"p",s}))});break;
        default:break; // 표·표 번호는 시수표 외우기에서
      }
    });
    flush();
  });
  return units.filter(u=>u.lines.some(cuHasCand));
}
function cuBuild(u,seed,amt){
  const r=rng(seed*7+u.label.length*13+u.lines.length);let id=0;
  const segs=u.lines.map(l=>{const parts=[];let m,last=0;CU_RE.lastIndex=0;
    while((m=CU_RE.exec(l.s))){if(m[2]&&/[가-힣]/.test(l.s[m.index-1]||""))continue;parts.push({t:"txt",s:l.s.slice(last,m.index)});parts.push({t:"cand",s:m[0],kind:m[1]?"num":"term"});last=m.index+m[0].length;}
    parts.push({t:"txt",s:l.s.slice(last)});return {k:l.k,parts};});
  const cands=segs.flatMap(s=>s.parts.filter(p=>p.t==="cand"));
  const cap={low:2,mid:4,high:7}[amt],ratio={low:.2,mid:.4,high:.65}[amt];
  const n=Math.min(cap,Math.max(1,Math.round(cands.length*ratio)),cands.length);
  const w={num:4,term:1.5};
  const pool=cands.map(p=>({p,k:Math.pow(r(),1/w[p.kind])})).sort((a,b)=>b.k-a.k);
  const used=[];for(const {p} of pool){if(used.length>=n)break;if(used.some(q=>q.s===p.s))continue;p.blank=true;used.push(p);}
  cands.filter(p=>p.blank).forEach(p=>p.id=id++);
  return {segs,count:id};
}

    <div class="seg" role="group" aria-label="빈칸 양">${[["low","조금"],["mid","보통"],["high","많이"]].map(([k,l])=>`<button aria-pressed="${S.cu.amt===k}" data-cuamt="${k}">${l}</button>`).join("")}</div>
  </div>
  <article class="lart cart blankart"><header><b>${esc(u.sec||C.short)}${u.ctx?" › "+esc(u.ctx):""}</b><span class="src">빈칸 ${b.count}개 · ${S.cu.bi+1}/${units.length}</span></header>${body}</article>
  ${S.cu.graded?`<div class="lbscore ${right===b.count?"ok":""}"><b>${right} / ${b.count}</b> 맞혔어요${right===b.count?" · 완벽해요!":" · 빨간 칸이 틀린 곳이에요"}</div>`:""}
  <div class="row2"><button class="btn ghost" id="cuReveal">${S.cu.reveal?"빈칸으로 돌아가기":"정답 보기"}</button><button class="btn" id="cuGrade">${S.cu.graded?"다시 풀기":"채점하기"}</button></div>

/* ===== 따라 쓰기 (타자 연습) ===== */
const TY={key:null,lines:[],labels:[],li:0,start:null,stats:[],done:false};
const tyNormCh=c=>/[ㆍ·⋅‧･.]/.test(c)?"·":c;   // 가운뎃점 종류는 같은 글자로 봄
function tyClean(line){
  return String(line).replace(/<[^>]*>/g,"").replace(/\[[^\]]*\]/g,"").replace(/\([一-鿿豈-﫿]+\)/g,"")
    .replace(/[「」“”‘’『』]/g,"").replace(/\s+/g," ").trim();
}
function tySplitLabel(s){const m=s.match(/^([①-⑳]|\d+의\d+\.|\d+\.|\d+\)|[가-하]\.|[가-하]\)|\(\d+\)|[•⦁∙－-])\s*/);return m?[m[1],s.slice(m[0].length)]:["",s];}
function tyJamo(ch){const c=ch.charCodeAt(0);if(c<0xAC00||c>0xD7A3)return 1;const i=c-0xAC00,jung=Math.floor(i/28)%21,jong=i%28;
  const dv=[9,10,11,14,15,16,19].includes(jung)?2:1,dj=[3,5,6,9,10,11,12,13,14,15,18].includes(jong)?2:(jong?1:0);return 1+dv+dj;}
function tySet(key,rawLines){
  if(TY.key===key)return;
  const L=[],lab=[];rawLines.forEach(r=>{const t=tyClean(r);if(!t)return;const [a,b]=tySplitLabel(t);if(b.trim()){L.push(b.trim());lab.push(a);}});
  Object.assign(TY,{key,lines:L,labels:lab,li:0,start:null,stats:[],done:false});
}
const tyCore=c=>/[가-힣ㄱ-ㅎㅏ-ㅣA-Za-z0-9]/.test(c);   // 글자·숫자만 채점, 특수문자와 띄어쓰기는 채점하지 않음
function tyCmp(target,val){ // 글자별 상태: ok / no / cur(조합 중일 수 있는 마지막 글자) / todo, 그리고 다음에 쓸 위치
  const v=[...val].filter(tyCore),T=[...target],out=[];let k=0,caret=-1;
  T.forEach((c,i)=>{
    if(!tyCore(c)){out.push((k>0&&k<=v.length)||(k===0&&v.length>0)?"ok":"todo");return;}
    if(k<v.length){const ok=v[k].toLowerCase()===c.toLowerCase();out.push(ok?"ok":(k===v.length-1?"cur":"no"));}
    else{out.push("todo");if(caret<0)caret=i;}
    k++;
  });
  return {st:out,caret,done:k<=v.length&&out.every(x=>x==="ok"),need:k,have:v.length,right:out.filter((x,i)=>tyCore(T[i])&&x==="ok").length};
}
function tyLineHTML(target,val){const r=tyCmp(target,val);return [...target].map((c,i)=>`<span class="t-${r.st[i]}${i===r.caret?" caret":""}">${c===" "?"&nbsp;":esc(c)}</span>`).join("")+(r.caret<0?`<span class="caret end">&nbsp;</span>`:"");}
function tySummary(){
  const typed=TY.stats.reduce((n,s)=>n+s.len,0),right=TY.stats.reduce((n,s)=>n+s.ok,0),jamo=TY.stats.reduce((n,s)=>n+s.jamo,0),ms=TY.stats.reduce((n,s)=>n+s.ms,0);
  return {acc:typed?Math.round(right/typed*100):0,speed:ms?Math.round(jamo/(ms/60000)):0};
}
function typingHTML(title){
  if(!TY.lines.length)return `<p class="src">따라 쓸 문장이 없어요.</p>`;
  if(TY.done){const s=tySummary();return `<article class="lart tydone"><header><b>${esc(title)}</b><span class="src">끝까지 썼어요</span></header>
    <div class="tystats"><div><b>${s.speed}</b><small>타/분</small></div><div><b>${s.acc}%</b><small>정확도</small></div><div><b>${TY.lines.length}</b><small>줄</small></div></div>
    <button class="btn ghost" id="tyAgain">처음부터 다시 쓰기</button></article>`;}
  const t=TY.lines[TY.li],s=tySummary();
  return `<article class="lart tycard"><header><b>${esc(title)}</b><span class="src">줄 ${TY.li+1} / ${TY.lines.length}</span></header>
    <div class="tytarget" id="tyTarget">${TY.labels[TY.li]?`<span class="tylab">${esc(TY.labels[TY.li])}</span>`:""}${tyLineHTML(t,"")}</div>
    <label for="tyIn" class="vh">위 문장을 따라 쓰기</label>
    <textarea id="tyIn" class="tyin" rows="2" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="여기에 위 문장을 그대로 써 보세요"></textarea>
    <div class="tymeta"><span id="tyLive">${TY.stats.length?`지금까지 ${s.speed}타/분 · 정확도 ${s.acc}%`:"입력을 시작하면 시간을 재요"}</span><button class="btn ghost tyskip" id="tySkip">건너뛰기</button></div>
  </article>
  <p class="src">줄 끝까지 맞게 쓰면 다음 줄로 넘어가요. 틀린 글자는 빨갛게 보여요. 한글·영어·숫자만 채점하고, 문장부호 같은 특수문자와 띄어쓰기는 빼먹거나 다르게 써도 틀린 것으로 치지 않아요. ①, 1., 가. 같은 번호와 개정 표시는 쓰지 않아도 돼요.</p>`;
}
function wireTyping(onRerender){
  const inp=document.getElementById("tyIn"),tgt=document.getElementById("tyTarget");
  const again=document.getElementById("tyAgain");if(again)again.onclick=()=>{Object.assign(TY,{li:0,start:null,stats:[],done:false});onRerender();};
  const skip=document.getElementById("tySkip");if(skip)skip.onclick=()=>{TY.start=null;if(TY.li<TY.lines.length-1)TY.li++;else TY.done=true;onRerender(true);};
  if(!inp)return;
  const lab=TY.labels[TY.li]?`<span class="tylab">${esc(TY.labels[TY.li])}</span>`:"";
  const finishLine=()=>{const t=TY.lines[TY.li],v=inp.value.replace(/\n/g,"");const r=tyCmp(t,v);
    TY.stats.push({len:r.need,ok:r.right,jamo:[...t].filter(tyCore).reduce((n,c)=>n+tyJamo(c),0),ms:Date.now()-(TY.start||Date.now())});
    TY.start=null;if(TY.li<TY.lines.length-1)TY.li++;else TY.done=true;onRerender(true);};
  inp.addEventListener("input",()=>{
    const t=TY.lines[TY.li];let v=inp.value;
    if(v.includes("\n")){inp.value=v=v.replace(/\n/g,"");const r0=tyCmp(t,v);if(r0.have>=r0.need-1){finishLine();return;}}
    if(!TY.start&&v)TY.start=Date.now();
    tgt.innerHTML=lab+tyLineHTML(t,v);
    if(tyCmp(t,v).done)setTimeout(()=>{if(inp.value.replace(/\n/g,"")===v)finishLine();},250);
  });
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();const r=tyCmp(TY.lines[TY.li],inp.value);if(r.have>=r.need-1)finishLine();}});
}

/* 모드: heart = 하트 3개, 10문제 / free = 하트 없이 스테이지의 모든 문제를 한 번씩 */
const keyOf=x=>typeof x==="string"?x:x.w;
function buildQueue(st,n){
  const items=st.words||st.pool;
  const seen=new Set(saved.seen[st.id]||[]);
  const unseen=shuffle(items.filter(x=>!seen.has(keyOf(x)))), rest=shuffle(items.filter(x=>seen.has(keyOf(x))));
  const all=unseen.concat(rest);
  return n?all.slice(0,n):all;
}
function markSeen(st,x){
  const items=st.words||st.pool;
  const list=saved.seen[st.id]||[];const k=keyOf(x);
  if(!list.includes(k))list.push(k);
  saved.seen[st.id]=list.length>=items.length?[]:list;   // 다 보면 처음부터 다시
  save();
}
function startGame(id,mode="heart"){
  const st=STAGES.find(s=>s.id===id);
  const qs=buildQueue(st,mode==="heart"?ROUND:0);
  S.game={st,mode,qs,i:0,lives:LIVES,right:0,wrong:0,combo:0,best:0,answered:null,sel:null,input:"",opts:null,done:false,anim:""};
  makeOpts();S.view="play";render();scrollTo(0,0);
}
function makeOpts(){
  const g=S.game;if(g.st.type==="word"||g.st.type==="dots"){g.opts=null;return;}
  const a=g.qs[g.i];
  if(g.st.kind==="br"){if(g.st.type==="write"){g.opts=null;return;}const ck=x=>BR[x].c.join("|");const used=new Set([ck(a)]),labs=new Set([label(g.st,a)]);const ds=[];for(const x of shuffle(g.st.pool)){if(ds.length>=3)break;if(used.has(ck(x))||labs.has(label(g.st,x)))continue;used.add(ck(x));labs.add(label(g.st,x));ds.push(x);}g.opts=shuffle([a,...ds]);return;}
  if(g.st.kind==="num"&&g.st.type==="reverse"){const BIG=["100","1000","10000"];const same=g.st.pool.filter(x=>x!==a&&BIG.includes(x)===BIG.includes(a));const other=g.st.pool.filter(x=>x!==a&&BIG.includes(x)!==BIG.includes(a));g.opts=shuffle([a,...shuffle(same).slice(0,3),...shuffle(other)].slice(0,4));return;}
  const pool=g.st.kind==="num"||g.st.kind==="en"?g.st.pool:g.st.type==="reverse"?(CONS.includes(a)?CONS:VOWS):g.st.pool;
  g.opts=shuffle([a,...shuffle(pool.filter(x=>x!==a)).slice(0,3)]);
}
function check(){
  const g=S.game,a=g.qs[g.i];
  let ok;
  if(g.st.type==="dots"){const v=(app.querySelector("#win")||{}).value||"";if(!v.trim())return;g.input=v.trim();ok=parseDots(g.input).join("-")===a.s[0].join("-");}
  else if(g.st.type==="word"){const v=(app.querySelector("#win")||{}).value||"";if(!v.trim())return;g.input=v.trim();ok=norm(g.input)===norm(a.w);}
  else if(g.st.type==="write"){if(!g.sel)return;ok=g.sel===BR[a].c[0];}
  else{if(!g.sel)return;ok=g.st.kind==="br"?BR[g.sel].c.join("|")===BR[a].c.join("|"):g.sel===a;}
  g.answered={ok};markSeen(g.st,a);
  if(ok){g.right++;g.combo++;g.best=Math.max(g.best,g.combo);g.anim="pop";}
  else{g.wrong++;g.combo=0;g.anim="shake";if(g.mode==="heart")g.lives--;}
  render();
}
const isLast=g=>(g.mode==="heart"&&g.lives<=0)||g.i>=g.qs.length-1;
function nextQ(){
  const g=S.game;

function finish(){
  const g=S.game;g.done=true;
  if(g.mode==="heart"){
    const rate=g.right/g.qs.length;
    g.stars=g.lives<=0?0:rate>=.9?3:rate>=.7?2:rate>=.5?1:0;
    g.newBest=g.stars>(saved.stars[g.st.id]||0);
    if(g.newBest){saved.stars[g.st.id]=g.stars;save();}
  }
  render();
}

  }else if(g.st.type==="write"){

    q=`<h2 class="ask">점 6개를 눌러 점자로 찍어 보세요</h2><span class="bigchar ${label(g.st,a).length>2?"long":""}">${esc(label(g.st,a))}</span>
    <div class="dots6 ingame" role="group" aria-label="점 6개">${[1,4,2,5,3,6].map(n=>`<button class="dot ${cur.includes(String(n))?"on":""} ${ans?(BR[a].c[0].includes(String(n))?"should":""):""}" data-wdot="${n}" aria-pressed="${cur.includes(String(n))}" ${ans?"disabled":""}>${n}</button>`).join("")}</div>
    <p class="dtxt" style="text-align:center">${cur?dotsText(cur):"키보드 F·D·S·J·K·L로도 찍을 수 있어요"}</p>`;
  }else if(g.st.type==="dots"){
    const what={ko:a.w.length===1?"글자를":"단어를",en:"영어 단어를",num:"숫자를"}[a.t];
    q=`<h2 class="ask">이 ${what} 점 번호로 써 보세요</h2><span class="bigchar ${a.w.length>4?"long xl":a.w.length>2?"long":""}">${esc(a.w)}</span>
    <label for="win" class="vh">점 번호 입력</label><input class="answer-in mono" id="win" autocomplete="off" inputmode="numeric" placeholder="예: 245-25" value="${esc(g.input)}" ${ans?"disabled":""}>
    ${ans?"":`<div class="keypad">${["1","2","3","4","5","6","-","⌫"].map(k=>`<button data-k="${k}" aria-label="${k==="⌫"?"한 글자 지우기":k==="-"?"칸 나누기":"점 "+k}">${k}</button>`).join("")}</div>`}
    <p class="src" style="text-align:center">칸 사이는 - 또는 띄어쓰기로 나눠요. 한 칸 안의 점 순서는 상관없어요.</p>`;
  }else if(g.st.kind==="brw"){
    const what={ko:"한글 단어를",en:"영어 단어를",num:"숫자를"}[a.t];
    q=`<h2 class="ask">점자로 쓴 ${g.st.id==="bw4"?"말을":what} 읽어 보세요</h2>
    <div class="paper bigp">${bcells(a.s[0])}</div>
    <label for="win" class="vh">답 입력</label><input class="answer-in" id="win" autocomplete="off" autocapitalize="off" placeholder="${g.st.id==="bw4"?"한글·영어·숫자로 입력":"답 입력"}" value="${esc(g.input)}" ${ans?"disabled":""}>`;
  }else{
    q=`<h2 class="ask">지문자로 쓴 ${g.st.kind==="en"?"영어 ":""}단어를 읽어 보세요</h2>
    <div class="word">${a.s.map(sy=>`<div class="syl">${sy.map(j=>face(g.st,j)).join("")}</div>`).join("")}</div>
    <label for="win" class="vh">단어 입력</label><input class="answer-in" id="win" autocomplete="off" placeholder="단어 입력" value="${esc(g.input)}" ${ans?"disabled":""}>`;
  }
  const right=g.st.type==="dots"?`<b class="mono">${a.s[0].join("-")}</b> <span class="bwrap sm">${bcells(a.s[0])}</span>`:g.st.type==="word"?a.w:g.st.kind==="br"?`${esc(label(g.st,a))} <span class="bwrap sm">${bcells(brCells(g.st,a))}</span> <span class="jamo">${esc(brCells(g.st,a).map(dotsText).join(" + "))}</span>`:label(g.st,a);
  const last=isLast(g);
  const sheet=ans
    ?`<div class="sheet sheet-up ${ans.ok?"ok":"no"}"><div class="in">
        <div class="v"><span class="ic">${ans.ok?IC.check:IC.x}</span>${ans.ok?pick(["정답이에요!","훌륭해요!","잘했어요!"]):"아쉬워요"}</div>
        ${!ans.ok||g.st.kind==="br"||g.st.type==="dots"?`<p class="detail">${ans.ok?"":"정답: "}${right}</p>`:""}
        ${g.st.type==="word"||g.st.type==="dots"?`<p class="detail jamo">${g.st.kind==="brw"?a.gloss.map(esc).join(" · "):a.s.map(sy=>sy.join(" ")).join("  +  ")}</p>`:""}
        <button class="btn ${ans.ok?"":"red"}" id="nextQ">${last?"결과 보기":"계속"}</button></div></div>`
    :`<div class="sheet"><div class="in"><button class="btn" id="check" ${(g.st.type==="word"||g.st.type==="dots"?g.input:g.sel)?"":"disabled"}>확인</button></div></div>`;
  const status=g.mode==="heart"
    ?`<span class="lives" aria-label="남은 하트 ${g.lives}개">${IC.heart}${g.lives}</span>`
    :`<span class="count">${done} / ${total}</span>`;
  app.innerHTML=`
  <div class="ltop"><button class="icon-btn" id="quit" aria-label="그만하기">${IC.x}</button>
    <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}"><i style="width:${Math.max(4,done/total*100)}%"></i></div>
    ${status}</div>
  <div class="modebar">
    <div class="modes" role="group" aria-label="풀이 모드">
      <button data-mode="heart" aria-pressed="${g.mode==="heart"}">${IC.heart} 하트 모드</button>
      <button data-mode="free" aria-pressed="${g.mode==="free"}">${IC.inf} 자유 모드</button>
    </div>
    ${g.mode==="free"&&g.i>0&&!ans?`<button class="linkbtn" id="stopFree">그만 풀고 결과 보기</button>`:`<span class="combo" aria-live="polite">${g.combo>=2?`${IC.fire} ${g.combo}연속`:""}</span>`}
  </div>
  <p class="modehint">${g.mode==="heart"?`${ROUND}문제 · 틀리면 하트가 줄어요 · 별을 받을 수 있어요`:`하트 없이 이 스테이지의 ${total}문제를 한 번씩 풀어요 · 별은 하트 모드에서만`}</p>
  <section class="${g.anim}" style="display:flex;flex-direction:column;gap:22px">${q}</section>
  ${sheet}`;
  g.anim="";
  const $=s=>app.querySelector(s);
  $("#quit").onclick=()=>{S.view="room";S.tab="stage";render();};
  app.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{if(b.dataset.mode!==g.mode)startGame(g.st.id,b.dataset.mode);});
  const sf=$("#stopFree");if(sf)sf.onclick=()=>{g.i=Math.max(0,g.i-1);finish();};
  app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{g.sel=b.dataset.o;render();});
  app.querySelectorAll("[data-wdot]").forEach(b=>b.onclick=()=>{const s=new Set((g.sel||"").split("").filter(Boolean));const n=b.dataset.wdot;s.has(n)?s.delete(n):s.add(n);g.sel=sortDots([...s].join(""));render();});
  const w=$("#win");
  if(w){w.oninput=()=>{g.input=w.value;const c=$("#check");if(c)c.disabled=!w.value.trim();};
        w.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();check();}};}
  app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const inp=$("#win");if(!inp)return;const k=b.dataset.k;
    inp.value=k==="⌫"?inp.value.slice(0,-1):inp.value+k;g.input=inp.value;const c=$("#check");if(c)c.disabled=!inp.value.trim();});
  const c=$("#check");if(c)c.onclick=check;
  const nq=$("#nextQ");if(nq){nq.onclick=nextQ;nq.focus();}
}
function result(){
  setBottom(false);
  const g=S.game,answered=Math.max(1,g.right+g.wrong);
  const free=g.mode==="free";
  const msg=free?(g.right+g.wrong>=g.qs.length?"모든 문제를 풀었어요":"여기까지 풀었어요")
    :g.lives<=0?"하트를 모두 썼어요":g.stars===3?"완벽해요!":g.stars===2?"잘했어요!":g.stars===1?"조금만 더!":"다시 도전해 봐요";
  app.innerHTML=`
  <section class="result pop">
    <span class="sub-txt">${g.st.lv?g.st.lv+" · ":""}${g.st.name} · ${free?"자유 모드":"하트 모드"}</span>
    ${free?`<span class="freebadge">${IC.inf}</span>`:starRow(g.stars,"bigstars")}
    <h2 class="${free||g.stars?"":"fail"}">${msg}</h2>
    ${g.newBest?`<span class="newbest">새 최고 기록</span>`:""}
    <div class="tiles">
      <div class="tile3 g"><small>맞힌 문제</small><b>${g.right}</b></div>
      <div class="tile3 b"><small>정답률</small><b>${Math.round(g.right/answered*100)}%</b></div>
      <div class="tile3 o"><small>${free?"틀린 문제":"최대 연속"}</small><b>${free?g.wrong:g.best}</b></div>
    </div>
    <div class="row2"><button class="btn ghost" id="toList">목록으로</button><button class="btn" id="again">다시 하기</button></div>
    ${free?`<button class="linkbtn" id="tryHeart">하트 모드로 별 받으러 가기</button>`:""}
  </section>`;
  app.querySelector("#toList").onclick=()=>{S.view="room";S.tab="stage";render();};
  app.querySelector("#again").onclick=()=>startGame(g.st.id,g.mode);
  const th=app.querySelector("#tryHeart");if(th)th.onclick=()=>startGame(g.st.id,"heart");
}

render();
</script>
